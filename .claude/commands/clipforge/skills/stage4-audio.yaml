skill:
  meta:
    id: "skill.clipforge.stage4-audio"
    version: "1.3.0"
    type: EXECUTIVE
    tags: ["audio", "tts", "bgm"]
    rigor: STANDARD
  intent:
    objective: "音频资产就绪，旁白和 BGM 已合成且技术参数合规"
    criteria:
      - "segment_durations.json 存在且含 meta + segments"
      - "narration.mp3 经过 loudnorm 标准化（max_volume >= -10 dB）"
      - "bgm.wav 存在且音量已通过 bgm_pipeline.sh 校准"
  boundary:
    rules:
      - ref: "R-G-*"
      - ref: "R-A-*"
      - ref: "R-C-*"
    preferences:
      - text: "BGM 选曲优先考虑纯音乐（无人声），避免与 TTS 旁白冲突"
        weight: "HIGH"
      - text: "科技类内容倾向电子/氛围乐，人文类倾向钢琴/弦乐"
        weight: "MEDIUM"
  guard:
    red_flags:
      - thought: "预估时长够用了"
        reality: "事故：预估偏差累计 8 秒导致全片空白。必须用分段 TTS 实测 actual_duration"
        trigger: "试图跳过分段 TTS"
      - thought: "BGM 音量后面再调"
        reality: "segment_durations.json 是唯一传递通道，不写入 Stage 6 就无法控制音量"
        trigger: "试图跳过 BGM 音量校准"
      - thought: "听起来差不多就行"
        reality: "loudnorm 标准化不是差不多，是防止部分段过响或过轻影响混音"
        trigger: "试图跳过 loudnorm 校验"
      - thought: "BGM 不够长用 HTML loop 就行"
        reality: "HyperFrames 对 loop 支持不可靠，必须用 FFmpeg 循环扩展 WAV"
        trigger: "试图用 HTML loop 替代 FFmpeg 循环"
      - thought: "max_volume 够了不需要 loudnorm"
        reality: "raw edge-tts 的 max_volume 可能 >= -10dB 但采样率 24000Hz 暴露了真相。loudnorm 不是调音量，是标准化响度分布"
        trigger: "narration.mp3 采样率为 24000 Hz"
      - thought: "bgm_volume 写个常见值就行"
        reality: "0.35 是 2026-06-01 事故的元凶。bgm_pipeline.sh 的 12 档查表会根据 BGM 实际响度给出精确值"
        trigger: "试图手动设置 bgm_volume 而非运行 bgm_pipeline.sh"
    spirit_vs_letter:
      - rule_ref: "R-A-*"
        mode: LETTER
        intent: "音频技术参数是流程层硬约束：loudnorm、音量通道、分段 TTS、TTS 音色固定、BGM 音量控制机制"
      - rule_ref: "R-G-*"
        mode: LETTER
        intent: "全局安全规则是流程层约束，精确遵守"
      - rule_ref: "R-C-*"
        mode: SPIRIT
        intent: "BGM 选曲享有最大自由度，从内容和情绪自主推导"
  gate:
    hard:
      - gate: file_exists
        params:
          files: ["segment_durations.json", "narration.mp3", "bgm.wav"]
      - gate: json_valid
        params:
          files: ["segment_durations.json"]
          required_keys: ["meta", "segments"]
      - gate: loudnorm_verified
        params:
          file: "narration.mp3"
          min_db: -10
      - gate: bgm_volume_set
        params:
          file: "segment_durations.json"
          key: "meta.bgm_volume"
      - gate: bgm_duration_covers
        params:
          bgm_file: "bgm.wav"
          segments_file: "segment_durations.json"
          narration_file: "narration.mp3"
          min_coverage_ratio: 0.95
      - gate: bgm_silence_valid
        params:
          bgm_file: "bgm.wav"
          segments_file: "segment_durations.json"
      - gate: narration_sample_rate_valid
        params:
          file: "narration.mp3"
          forbidden_rates: [24000]
          expected_min: 44100
      - gate: bgm_volume_provenance_valid
        params:
          file: "segment_durations.json"
      - gate: bgm_volume_table_valid
        params:
          file: "segment_durations.json"
          tolerance: 0.03
      - gate: duration_in_range
        params:
          file: "segment_durations.json"
    soft:
      - gate: estimation_accuracy_valid
        params:
          narration_file: "narration_segments.json"
          segments_file: "segment_durations.json"
          segment_threshold: 0.30
          total_threshold: 0.20
    max_retries: 2
  trace:
    capture: true
    level: FULL
    sensitive_fields: []
