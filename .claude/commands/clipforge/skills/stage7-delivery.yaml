skill:
  meta:
    id: "skill.clipforge.stage7-delivery"
    version: "1.0.0"
    type: EXECUTIVE
    tags: ["delivery", "publish"]
    rigor: STANDARD
  intent:
    objective: "生成封面、发布文案和最终交付物"
    criteria:
      - "cover.html 存在且遵循 7 层封面模板"
      - "douyin.md 包含发布文案和标签"
      - "评论区格式正确（只列名称，不放链接）"
  boundary:
    rules:
      - ref: "R-G-*"
      - ref: "R-S7-*"
  guard:
    red_flags:
      - thought: "评论区放个链接方便用户"
        reality: "抖音审查禁止评论区放链接，只列项目名 + 搜索指引"
        trigger: "试图在评论区放完整 URL"
      - thought: "封面随便写个标题就行"
        reality: "封面是第二眼看到的内容，必须严格遵循 7 层模板"
        trigger: "试图简化封面设计"
  gate:
    hard:
      - gate: file_exists
        params:
          files: ["douyin.md"]
      - gate: no_url_in_output
        params:
          files: ["douyin.md"]
    soft: []
    max_retries: 2
  trace:
    capture: true
    level: FULL
    sensitive_fields: []
