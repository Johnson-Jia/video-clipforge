skill:
  meta:
    id: "skill.clipforge.stage6-production"
    version: "1.2.0"
    type: EXECUTIVE
    tags: ["html", "render", "video"]
    rigor: STRICT
  intent:
    objective: "HTML 场景就绪，视频已渲染输出"
    criteria:
      - "index.html 存在且包含所有场景"
      - "所有场景使用三层架构"
      - "GSAP timeline 已正确注册"
  boundary:
    rules:
      - ref: "R-G-*"
      - ref: "R-C-*"
      - ref: "R-R-*"
      - ref: "R-S6-*"
    preferences:
      - text: "特效、布局和视觉表达从内容自主推导，不查表套用"
        weight: "HIGH"
        source_pattern: "P-feedback-template-reference"
  guard:
    red_flags:
      - thought: "这个效果用 CSS animation 更简单"
        reality: "HyperFrames seek 不执行 CSS animation，所有入场必须用 GSAP"
        trigger: "试图使用 CSS animation 做入场"
      - thought: "三层架构太麻烦，直接写内容就行"
        reality: "三层是正确结构，扁平化会导致渲染异常和视觉分层混乱"
        trigger: "试图省略三层架构"
      - thought: "bg 层用 glow+grid 三件套就够了，反正渲染出来差别不大"
        reality: "H.264 编码后低质量 bg 差异极小，必须有纹理/光束/粒子等丰富元素才有效。R-R-011 已升级为 HARD 门禁"
        trigger: "试图用 glow+grid 三件套作为唯一 bg 方案"
      - thought: "相邻场景用同样的渐变没关系，反正内容不同"
        reality: "视觉同质化导致观众疲劳，R-R-012 要求相邻场景 bg 必须有可区分的差异"
        trigger: "连续场景使用相同的 bg 渐变色值"
      - thought: "padding 设两层更安全"
        reality: "双重 padding 是最常见的渲染事故，只设一层"
        trigger: "试图同时设置 scene-wrap 和 .phase 的 padding"
      - thought: "window.__hf 是可选的，HyperFrames 会自动处理"
        reality: "__hf 是 HyperFrames 渲染的必需 API，缺少会导致 45s 超时后渲染崩溃。已有 2 次事故记录"
        trigger: "完成 HTML 编写但未注入 window.__hf"
      - thought: "场景 div 不需要 id，用 class 选择器就行"
        reality: "GSAP 动画使用 #sN .xxx 选择器，缺少 id 会导致场景动画静默丢失，尤其是首尾关键场景"
        trigger: "场景包裹 div 未设置 id=\"sN\" 属性"
      - thought: "用 CSS .scene-wrap{opacity:0} + .active{opacity:1} 控制场景切换"
        reality: "HyperFrames 通过 GSAP timeline seek 驱动，不会添加/移除 CSS class。所有场景永远 opacity:0 → 黑屏。正确方式：GSAP timeline .set() 控制可见性"
        trigger: "试图用 CSS class 切换场景可见性"
      - thought: "渲染成功就代表视频没问题"
        reality: "黑屏视频（所有帧相同颜色）码率极低（<500 kbps），HyperFrames 不报错但产出的视频无内容。必须检查码率"
        trigger: "HyperFrames 渲染完成后未验证视频质量"
    spirit_vs_letter:
      - rule_ref: "R-S6-*"
        mode: LETTER
        intent: "HTML 结构规则是流程层硬约束：三层架构、单层 padding、GSAP timeline"
      - rule_ref: "R-R-*"
        mode: LETTER
        intent: "渲染管线约束：HTML 实体净化、禁用 anim-in、cover.html 渲染前移除"
      - rule_ref: "R-C-*"
        mode: SPIRIT
        intent: "视觉设计享有最大自由度：配色、布局、动效从内容自主推导"
  gate:
    hard:
      - gate: file_exists
        params:
          files: ["index.html"]
      - gate: hf_api_present
        params:
          file: "index.html"
      - gate: scene_ids_match
        params:
          html_file: "index.html"
          segments_file: "narration_segments.json"
      - gate: composition_structure
        params:
          file: "index.html"
      - gate: output_no_bgm_valid
        params:
          bgm_file: "output.mp4"
          no_bgm_file: "output_no_bgm.mp4"
      - gate: bg_visual_diversity
        params:
          file: "index.html"
      - gate: adjacent_bg_diversity
        params:
          file: "index.html"
      - gate: fx_layer_not_empty
        params:
          file: "index.html"
      - gate: html_no_css_visibility
        params:
          file: "index.html"
      - gate: video_bitrate_valid
        params:
          file: "output.mp4"
          min_bitrate_kbps: 500
    soft: []
    max_retries: 2
  trace:
    capture: true
    level: FULL
    sensitive_fields: []
