rules:
  - id: "R-S7-001"
    type: FORBIDDEN_ACTION
    pattern: "发布文案中包含完整 URL"
    positive: "评论区只列项目名称 + '搜名字就能找到'，不放完整链接"
    guardrail: "douyin.md 中包含 github.com 或 https:// 形式的 URL"
    detection:
      keywords: ["github.com/", "https://", "http://"]
      regex: "https?://[^\\s]+"
    severity: HARD
    class: SAFETY
    scope: SKILL
    skill: "stage7-delivery"
    source: "stage7-delivery.md + shared/shared-rules.md §4"

  - id: "R-S7-002"
    type: FORBIDDEN_ACTION
    pattern: "封面缺少必要层级"
    positive: "封面必须包含：日期 + 场景标签 + 胶囊徽章 + 双色主标题"
    guardrail: "cover.html 缺少日期/标签/主标题之一"
    detection: {keywords: [], semantic_check: true}
    severity: HARD
    class: EXPERIENTIAL
    scope: SKILL
    skill: "stage7-delivery"
    source: "feedback-cover-design.md"

  - id: "R-S7-003"
    type: FORBIDDEN_ACTION
    pattern: "封面文字使用英文"
    positive: "封面所有可见文字使用中文，仅保留项目名和技术缩写英文"
    guardrail: "封面 HTML 中包含 TRENDING、TOP、FOLLOW 等英文装饰文字"
    detection: {keywords: [], semantic_check: true}
    severity: HARD
    class: EXPERIENTIAL
    scope: SKILL
    skill: "stage7-delivery"
    source: "shared/shared-rules.md §2"

  - id: "R-S7-004"
    type: FORBIDDEN_ACTION
    pattern: "未执行 cleanup 阶段"
    positive: "delivery 完成后必须执行 shared/cleanup-rules，删除临时文件"
    guardrail: "项目目录中残留大量临时文件（.renderbak, debug_*.html 等）"
    detection: {keywords: [], semantic_check: true}
    severity: HARD
    class: SAFETY
    scope: SKILL
    skill: "stage7-delivery"
    source: "clipforge.md 全局原则 10"

  # R-S7-006: gate.py checker 内联校验规则，编号与 gate.py 输出消息对齐

  - id: "R-S7-006"
    type: FORBIDDEN_ACTION
    pattern: "douyin.md 缺少多平台文案或评论区自评格式"
    positive: "douyin.md 必须包含三平台适配文案（标题+正文），GitHub 项目评论区必须同时包含搜索方式和完整路径格式"
    guardrail: "评论区缺少'GitHub搜索: Xxx'格式或'owner/repo'路径格式"
    detection:
      keywords: []
      semantic_check: true
    severity: SOFT
    class: EXPERIENTIAL
    scope: SKILL
    skill: "stage7-delivery"
    source: "engine/gate.py check_douyin_platforms_complete"
