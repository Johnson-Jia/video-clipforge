rules:
  - id: "R-S3-001"
    type: FORBIDDEN_ACTION
    pattern: "narration_segments.json 缺少 hook 纯钩子验证"
    positive: "第一个场景的 narration 必须是纯钩子（震撼数据/反直觉/强对比/悬念），不含信息性内容"
    guardrail: "segments[0] 的 narration 包含项目介绍或功能描述"
    detection: {keywords: [], semantic_check: true}
    severity: HARD
    class: EXPERIENTIAL
    scope: SKILL
    skill: "stage3-scenes"
    source: "stage3-scenes.md 节奏铁律（5s 完播率 ≥44% 对应 36K 播放）"

  - id: "R-S3-002"
    type: FORBIDDEN_ACTION
    pattern: "hook 使用疑问/互动模式（平均播放仅 1,195）"
    positive: "hook 使用反直觉/冲突（首选）或数字锚定模式，禁止疑问句式（'你知道…吗？''有没有想过…？'）"
    guardrail: "segments[0] 的 narration 以疑问词开头或包含'你知道吗''有没有想过''猜猜'"
    detection: {keywords: ["你知道吗", "有没有想过", "猜猜", "你知道"], semantic_check: false}
    severity: HARD
    class: EXPERIENTIAL
    scope: SKILL
    skill: "stage3-scenes"
    source: "数据分析：疑问/互动模式平均 1,195 播放（最低）"

  - id: "R-S3-003"
    type: FORBIDDEN_ACTION
    pattern: "hook 前 5 秒包含项目名或功能描述"
    positive: "前 5 秒只允许：震撼数据 / 反直觉陈述 / 强对比，项目名和功能描述从第 2 个场景开始"
    guardrail: "segments[0] 的 narration 包含项目英文名或功能说明"
    detection: {keywords: [], semantic_check: true}
    severity: HARD
    class: EXPERIENTIAL
    scope: SKILL
    skill: "stage3-scenes"
    source: "数据分析：5s 完播率 ≥44% 对应 36K 播放 vs <38% 仅 3.1K"

  - id: "R-S3-004"
    type: FORBIDDEN_ACTION
    pattern: "场景数量不在合理范围（标准 3-8 个，深度解析 8-15 个）"
    positive: "标准视频 4-7 个场景，深度解析 8-15 个场景"
    guardrail: "narration_segments.json 的 segments 数量：标准模式 <3 或 >8，深度解析模式 <5 或 >15（深度解析支持≤3min 长视频）"
    detection: {keywords: [], semantic_check: true}
    severity: SOFT
    class: EXPERIENTIAL
    scope: SKILL
    skill: "stage3-scenes"
    source: "stage3-scenes.md Red Flags"

  - id: "R-S3-005"
    type: FORBIDDEN_ACTION
    pattern: "场景间缺少情绪起伏设计"
    positive: "每个场景必须定义 emotion 字段，相邻场景 emotion 不应完全相同"
    guardrail: "segments 中存在连续 3+ 个场景 emotion 相同"
    detection: {keywords: [], semantic_check: true}
    severity: SOFT
    class: EXPERIENTIAL
    scope: SKILL
    skill: "stage3-scenes"
    source: "stage3-scenes.md 节奏铁律"

  - id: "R-S3-006"
    type: FORBIDDEN_ACTION
    pattern: "总旁白字数超出目标范围"
    positive: "标准模式 250-380 字，深度解析 300-950 字（≤3min）"
    guardrail: "narration_segments.json 总字数不在目标范围内"
    detection: {keywords: [], semantic_check: true}
    severity: SOFT
    class: EXPERIENTIAL
    scope: SKILL
    skill: "stage3-scenes"
    source: "stage3-scenes.md Red Flags"

  - id: "R-S3-007"
    type: FORBIDDEN_METHOD
    pattern: "未从 design.md 的 immersion_mode 推导视觉风格"
    positive: "每个场景的 visual_type 必须与 design.md 的 immersion_mode 一致"
    guardrail: "visual_type 与 immersion_mode 的视觉风格不匹配"
    detection: {keywords: [], semantic_check: true}
    severity: HARD
    class: EXPERIENTIAL
    scope: SKILL
    skill: "stage3-scenes"
    source: "stage3-scenes.md Red Flags"
