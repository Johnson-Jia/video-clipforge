rules:
  - id: "R-R-001"
    type: FORBIDDEN_METHOD
    pattern: "使用 .anim-in CSS 类或 CSS opacity:0 入场动画"
    positive: "所有内容元素默认可见（opacity:1），入场动画使用 GSAP .from()"
    guardrail: "HTML 中包含 .anim-in 类或在 CSS 中设置 opacity:0 的入场机制"
    detection:
      keywords: ["anim-in", "opacity:0"]
      regex: "\\.anim-in|opacity\\s*:\\s*0"
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/render-safety.md §1.1"

  - id: "R-R-002"
    type: FORBIDDEN_METHOD
    pattern: "使用 HTML 实体字符（&#9733; 等）"
    positive: "使用 Unicode 字符直接输入（★ 而非 &#9733;）"
    guardrail: "HTML 中包含 &amp;# 等实体编码"
    detection:
      regex: "&#\\d+;"
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/render-safety.md §1.2"

  - id: "R-R-003"
    type: FORBIDDEN_ACTION
    pattern: "scene-wrap 和 .phase 同时设置 padding（双重 padding）"
    positive: "安全区 padding 只设一层（180px 90px 220px 90px），scene-wrap 或 .phase 二选一"
    guardrail: ".scene-wrap 和 .phase 都有 padding 属性"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/render-safety.md §1.4a"

  - id: "R-R-004"
    type: FORBIDDEN_ACTION
    pattern: "场景缺少安全区 padding"
    positive: "每个场景必须有四方向安全区 padding（180px 90px 220px 90px）"
    guardrail: ".scene-wrap 和 .phase 都没有 padding"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/render-safety.md §1.3"

  - id: "R-R-005"
    type: FORBIDDEN_ACTION
    pattern: "渲染前未移除非 index.html 的 composition 文件"
    positive: "渲染前将 cover.html 等其他 HTML 文件重命名为 .renderbak，渲染后恢复"
    guardrail: "项目目录中存在多个含 data-composition-id 的 HTML 文件"
    detection:
      keywords: ["data-composition-id"]
      semantic_check: true
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/render-safety.md §1.5"

  - id: "R-R-006"
    type: FORBIDDEN_ACTION
    pattern: "GSAP timeline 未注册（__timelines 为空对象）"
    positive: "注册 GSAP timeline：window.__timelines['main'] = tl，确保 HyperFrames 可驱动动画"
    guardrail: "HTML 中只有 window.__timelines = {}; 而无赋值"
    detection:
      keywords: ["__timelines"]
      semantic_check: true
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/render-safety.md §1.7"

  - id: "R-R-007"
    type: FORBIDDEN_ACTION
    pattern: "场景缺少三层架构（.layer-bg / .layer-fx / .layer-content）"
    positive: "每个场景包含三层：.layer-bg(z:1) + .layer-fx(z:2) + .layer-content(z:3)"
    guardrail: "某个 .scene-wrap 内缺少 .layer-bg、.layer-fx 或 .layer-content 之一"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/render-safety.md §2"

  - id: "R-R-008"
    type: FORBIDDEN_ACTION
    pattern: ".layer-fx 为空 div"
    positive: ".layer-fx 必须包含至少 1 个特效子元素（光球/射线/粒子等）"
    guardrail: ".layer-fx 内无子元素"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: QUALITY
    scope: GLOBAL
    source: "shared/render-safety.md §2.4"

  - id: "R-R-009"
    type: FORBIDDEN_ACTION
    pattern: "bg 层仅使用 glow+grid 三件套模板（线性渐变 + 1-2个模糊光圆 + grid-bg）"
    positive: "bg 层必须包含至少 2 种不同类型的视觉元素（渐变 + 纹理 + 光效/粒子，三者取二以上）。允许的类型：渐变、噪点纹理、等高线、光束射线、扫描线、波纹、暗角聚光、浮动粒子"
    guardrail: ".layer-bg 内只有 linear-gradient + blur(140px) 圆 + grid-bg 三件套，无其他视觉元素"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: QUALITY
    scope: GLOBAL
    source: "feedback-bg-fx-quality.md — 2026-05-30 用户反馈 bg 层质量差"

  - id: "R-R-010"
    type: FORBIDDEN_ACTION
    pattern: "相邻场景 bg 层使用相同的渐变色值组合（视觉同质化）"
    positive: "相邻场景的 bg 层必须有可区分的视觉差异：不同的主色调、不同的纹理类型、或不同的光效模式。20个场景至少有 4-5 种不同的 bg 风格组"
    guardrail: "连续 2+ 个场景使用完全相同的 background linear-gradient 色值"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: QUALITY
    scope: GLOBAL
    source: "feedback-bg-fx-quality.md — 2026-05-30 用户反馈场景间视觉同质化"

  - id: "R-R-011"
    type: FORBIDDEN_METHOD
    pattern: "CSS animation 从不可见状态开始（scaleY:0 / opacity:0→1 / translateY(-100%)→0）"
    positive: "CSS animation 仅用于可见位置之间的移动（如漂移），'从无到有'用 GSAP .from()"
    guardrail: "CSS keyframes 中存在从 opacity:0/scaleY(0)/translateY(-100%) 到可见状态的 animation"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/render-safety.md §1.1b"

  - id: "R-R-012"
    type: FORBIDDEN_ACTION
    pattern: "音频文件不在 index.html 同级目录"
    positive: "确保 narration.mp3 和 bgm.wav 存在于 index.html 同级目录"
    guardrail: "<audio src> 引用的文件在项目目录中不存在"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/render-safety.md §1.6"

  - id: "R-R-013"
    type: FORBIDDEN_ACTION
    pattern: ".layer-fx 中特效元素无 GSAP 动画（纯静态 div）"
    positive: "每个 fx 元素必须有 GSAP 动画（持续 repeat:-1 或入场 .from()）。动画类型不限，由内容推导。组件库无匹配时创建新特效"
    guardrail: "场景有 fx 子元素但 GSAP timeline 中无对应 .to()/.from() 调用"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: QUALITY
    scope: GLOBAL
    source: "shared/render-safety.md §2.5 — 2026-05-30 VibeCoding 大赏视频 20/22 场景 fx 无动画事故"

  - id: "R-R-014"
    type: FORBIDDEN_ACTION
    pattern: "根组合 div 缺少 data-width 或 data-height 属性"
    positive: "根组合必须包含 data-width=\"1080\" data-height=\"1920\"，audio 必须包含 data-start=\"0\""
    guardrail: "根组合无 data-width/data-height，或 <audio> 无 data-start"
    detection:
      keywords: ["data-composition-id"]
      semantic_check: true
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "feedback-missing-dims-black-screen.md — 2026-05-30 VibeCoding 视频 100% 黑帧事故"

  - id: "R-R-015"
    type: FORBIDDEN_ACTION
    pattern: "内容层文字字号低于正文最低标准（竖屏<36px / 横屏<32px）"
    positive: "竖屏(1080×1920)字号最低标准：标题≥64px、正文≥36px、标注≥28px。横屏(1920×1080)：标题≥56px、正文≥32px、标注≥24px"
    guardrail: ".layer-content 内存在 font-size 低于正文最低标准（竖屏 36px / 横屏 32px）的文字元素"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: QUALITY
    scope: GLOBAL
    source: "shared/render-safety.md §3.1 — 2026-05-30 竖屏文字手机端不可读事故"

  - id: "R-R-016"
    type: FORBIDDEN_METHOD
    pattern: "使用 section-tag 小徽章标签作为场景标题（20-24px 带背景色小标签）"
    positive: "场景标题使用标题层字号（竖屏≥64px/横屏≥56px），用字重/颜色/位置区分层级"
    guardrail: "HTML 中存在 class=\"section-tag\" 的元素"
    detection:
      keywords: ["section-tag"]
      regex: "class=['\"][^'\"]*section-tag[^'\"]*['\"]"
    severity: HARD
    class: QUALITY
    scope: GLOBAL
    source: "shared/render-safety.md §3.2 — 2026-05-30 用户反馈小标签视觉廉价"

  - id: "R-R-017"
    type: REQUIRED_METHOD
    pattern: "hook(s1) 首个文字动画从 t>0 启动（旁白先于画面）"
    positive: "hook 场景首个文字 GSAP 动画 t=0 启动、duration ≤ 0.15s、使用 scale 而非 y 位移"
    guardrail: "index.html 中 s1 场景的 .from() 调用第三个参数（时间位置）> 0"
    detection:
      regex: "tl\\.from\\(['\"]#s1[^,]+,[^)]+},\\s*(0\\.[1-9]|[1-9])"
    severity: HARD
    class: QUALITY
    scope: stage6-production
    source: "stages/stage6-production.md §动画规则 R15 — 2026-05-31 A/V 同步修复"

  - id: "R-R-018"
    type: REQUIRED_METHOD
    pattern: "封面 HTML 未使用 .cover 根容器或缺少模板规定的 CSS class"
    positive: "cover.html 必须使用 .cover 根容器 + 模板规定的 7 层 CSS class（.date .scene-label .badge .main-title .divider .data-subtitle .cards）+ :root CSS 变量控制配色"
    guardrail: "cover.html 中不存在 class=\"cover\" 根容器，或缺少模板规定的 CSS class"
    detection:
      keywords: ["cover"]
      semantic_check: true
    severity: HARD
    class: QUALITY
    scope: stage7-delivery
    source: "stages/stage7-delivery.md §封面铁律 — 2026-05-31 封面偏离模板事故"

  - id: "R-R-019"
    type: FORBIDDEN_METHOD
    pattern: "封面 HTML 中 CSS 子元素硬编码色值（绕过 :root 变量）"
    positive: "封面配色通过 :root CSS 变量（--accent-warm --accent-cool --bg-dark 等）控制，子元素引用变量"
    guardrail: "cover.html 中 .date/.scene-label/.badge/.main-title/.data-subtitle/.card 等子元素使用硬编码 color: 值而非 var(--xxx)"
    detection:
      regex: "\\.(date|scene-label|badge|main-title|data-subtitle|card|num|label)\\s*\\{[^}]*color:\\s*#[0-9a-fA-F]"
    severity: HARD
    class: QUALITY
    scope: stage7-delivery
    source: "stages/stage7-delivery.md §封面铁律 — 2026-05-31 封面偏离模板事故"

  - id: "R-R-020"
    type: FORBIDDEN_ACTION
    pattern: "横屏场景内容视觉重心明显偏移（整体偏向画布一侧超过 70%）"
    positive: "横屏内容区域视觉重心应在画布中段（水平 20%-80%）。单栏文字用 max-width+margin:0 auto 居中容器（文字可左对齐）；双栏布局宽度比不超 3:1。禁止所有内容挤在画布一侧"
    guardrail: "横屏场景中内容元素集中在画布左侧或右侧 30% 区域内，另一侧无内容"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: QUALITY
    scope: stage6-production
    source: "shared/render-safety.md §3.5 — 2026-05-31 VibeCoding 大赏视频内容偏左事故"
