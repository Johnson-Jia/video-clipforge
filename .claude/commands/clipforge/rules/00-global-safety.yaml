rules:
  - id: "R-G-001"
    type: FORBIDDEN_SPEECH
    pattern: "使用绝对化用语（必装、必备、神器等）"
    positive: "所有表述使用限定性语言，如'可能'、'通常'、'值得关注'"
    guardrail: "输出包含'必装'、'必备'、'神器'、'最强'、'最好'等词视为违规"
    detection:
      keywords: ["必装", "必备", "神器", "赶紧去", "马上去", "立即下载", "全网最好", "第一", "最强", "你一定要", "千万别错过", "免费领", "福利", "白嫖", "点赞关注", "一键三连"]
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/shared-rules.md §1"

  - id: "R-G-002"
    type: FORBIDDEN_ACTION
    pattern: "视频内放网址/URL"
    positive: "只展示项目名称/产品名称，链接放评论区"
    guardrail: "画面或旁白包含 github.com/xxx 或 https://xxx.com 形式的 URL"
    detection:
      keywords: ["github.com/", "https://", "http://", "www."]
      regex: "https?://[^\\s]+|github\\.com/[^\\s]+"
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/shared-rules.md §4"

  - id: "R-G-003"
    type: FORBIDDEN_SPEECH
    pattern: "引导用户脱离平台（下载安装包、打开浏览器等）"
    positive: "只描述能力，不说获取路径：说'能做什么'，不说'去哪下载/怎么安装'"
    guardrail: "旁白或评论区出现'下载安装包'、'双击安装'、'打开浏览器就能用'等表述"
    detection:
      keywords: ["下载安装包", "双击安装", "打开浏览器", "前往github", "下载地址"]
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/shared-rules.md §4.1"

  - id: "R-G-004"
    type: FORBIDDEN_SPEECH
    pattern: "诱导互动（点赞关注、一键三连等）"
    positive: "正文自然提及，文案末尾温和引导"
    guardrail: "正文中出现'点赞关注'、'一键三连'等诱导互动词"
    detection:
      keywords: ["点赞关注", "一键三连", "点个赞", "点个关注"]
    severity: SOFT
    class: EXPERIENTIAL
    scope: GLOBAL
    source: "shared/shared-rules.md §1"

  - id: "R-G-005"
    type: FORBIDDEN_SPEECH
    pattern: "点名商业产品/品牌名称"
    positive: "使用技术类别描述（如'大语言模型'、'AI 助手'），不点品牌名"
    guardrail: "出现'GPT'、'DeepSeek'、'通义千问'等具体品牌名"
    detection:
      keywords: ["ChatGPT", "GPT-4", "DeepSeek", "通义千问", "文心一言", "Kimi"]
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/shared-rules.md §1"

  - id: "R-G-006"
    type: FORBIDDEN_ACTION
    pattern: "CTA 提及具体更新时间"
    positive: "使用通用表述如'每天更新'、'关注获取每日热门'"
    guardrail: "CTA 包含具体时间如'每天7点'、'每晚8点'"
    detection:
      keywords: ["每天7点", "每晚8点", "每天晚上", "每天早上"]
    severity: SOFT
    class: EXPERIENTIAL
    scope: GLOBAL
    source: "shared/shared-rules.md §3"

  - id: "R-G-007"
    type: FORBIDDEN_SPEECH
    pattern: "画面文字使用英文（非项目名/技术缩写）"
    positive: "画面文字全部使用中文，仅项目名和技术缩写保留英文"
    guardrail: "画面包含 TRENDING TODAY、TOP 3、FOLLOW 等非中文文字"
    detection:
      keywords: []
      semantic_check: true
    severity: HARD
    class: EXPERIENTIAL
    scope: GLOBAL
    source: "shared/shared-rules.md §2"

  - id: "R-G-008"
    type: FORBIDDEN_SPEECH
    pattern: "旁白/画面/文案提及真实人名"
    positive: "使用泛化表述（如'国内高校团队'、'研究团队'），不提具体姓名"
    guardrail: "旁白、画面文字或发布文案中出现真实人名（如教授/学者/企业家姓名），触发平台个人隐私保护审核 → 不适宜公开"
    detection:
      keywords: ["教授", "老师", "博士", "院士"]
      semantic_check: true
      heuristic: "检测'姓名+头衔'组合模式，如'X教授'、'X老师实验室'"
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/shared-rules.md §4.2 + engine/gate.py check_no_real_person_name"

  - id: "R-G-009"
    type: FORBIDDEN_SPEECH
    pattern: "旁白/画面/文案提及具体学校名/机构名"
    positive: "使用'国内高校'、'国内研究机构'等泛化表述"
    guardrail: "出现'中科大'、'清华'、'北大'、'浙大'等具体学校名或'XX实验室'等机构名，触发平台隐私保护审核"
    detection:
      keywords: ["中科大", "清华", "北大", "浙江大学", "上海交大", "复旦", "南大", "中科院", "实验室出品"]
      semantic_check: true
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/shared-rules.md §4.2 + engine/gate.py check_no_school_name"

  - id: "R-G-010"
    type: FORBIDDEN_SPEECH
    pattern: "竞品负面对比/拉踩"
    positive: "只正面描述自身项目特点，不提竞品名称和缺点。如需对比，用'同类方案侧重 XX'等中性表述"
    guardrail: "旁白或画面出现竞品名称+负面描述（如'LiveTalking缺XX'、'XX不如'），触发平台'贬低同行/恶意竞争'审核"
    detection:
      keywords: ["不如", "缺实时", "没有XX", "做不到", "比不上", "过时", "落后"]
      semantic_check: true
      heuristic: "检测'竞品名+否定描述'模式"
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/shared-rules.md §4.2 + engine/gate.py check_no_competitor_attack"

  - id: "R-G-011"
    type: FORBIDDEN_SPEECH
    pattern: "绝对化/夸大宣传用语"
    positive: "使用限定性表述（'表现不错'、'值得关注'、'颇有亮点'）"
    guardrail: "'别人没做的事'、'远超预期'、'都方便'等绝对化/夸大用语，触发平台'虚假宣传'审核"
    detection:
      keywords: ["远超预期", "别人没做的事", "史无前例", "前所未有", "都方便", "吊打", "碾压", "完爆", "秒杀"]
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "shared/shared-rules.md §4.2"

  - id: "R-G-012"
    type: FORBIDDEN_SPEECH
    pattern: "小红书文案使用'收藏！'等引导词"
    positive: "去掉'收藏！'前缀，用内容本身的吸引力吸引读者"
    guardrail: "小红书文案以'收藏！'、'快收藏'、'赶紧收藏'开头，触发小红书限流审核"
    detection:
      keywords: ["收藏！", "快收藏", "赶紧收藏", "强烈建议收藏"]
    severity: SOFT
    class: EXPERIENTIAL
    scope: SKILL
    skill: stage7-delivery
    source: "shared/shared-rules.md §4.2"

  - id: "R-G-013"
    type: FORBIDDEN_ACTION
    pattern: "narration/douyin.md/HTML 引导观众'去XX搜索''搜XX'等搜索话术"
    positive: "只列项目名和 owner/repo 路径（如 apple/container），不写'去 GitHub 搜索''搜名字就能'"
    guardrail: "'去GitHub搜'、'GitHub搜索:'、'搜项目名'、'感兴趣...搜'等表述触发平台'导流'判定限流"
    detection:
      keywords: ["去GitHub搜", "GitHub搜索", "GitHub 搜索", "搜项目名", "搜名字", "感兴趣", "去搜", "就能"]
      regex: "去\\s*GitHub\\s*搜|GitHub\\s*搜索\\s*[:：]|搜\\s*[\"\"\"]?\\w+[\"\"\"]?\\s*就\\s*能|感兴趣.*搜|去\\s*搜\\s*\\w"
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "engine/gate.py check_no_search_cTA"

  - id: "R-G-014"
    type: FORBIDDEN_ACTION
    pattern: "douyin.md 四平台文案中包含 URL/链接"
    positive: "douyin.md 全文零链接，项目只以 owner/repo 文本路径形式出现在评论区自评段"
    guardrail: "douyin.md 出现 https://... 形式 URL，平台判定导流并限流"
    detection:
      keywords: ["https://", "http://"]
      regex: "https?://\\S+"
    severity: HARD
    class: SAFETY
    scope: GLOBAL
    source: "engine/gate.py check_douyin_platforms_complete"
