<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Video Title</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
:root{
  --accent:#00D4FF;--accent2:#7B2FBE;--warm:#FFB800;
  --cream:#F0E8DA;--muted:rgba(240,232,218,0.6);
  --text:#fff
}
.comp{position:relative;width:1080px;height:1920px;overflow:hidden}
.clip{position:absolute;inset:0;overflow:hidden}
.layer-bg{position:absolute;inset:0;z-index:1}
.layer-fx{position:absolute;inset:0;z-index:2;pointer-events:none}
.layer-content{position:absolute;inset:0;z-index:3}
.phase{position:absolute;inset:0;padding:180px 80px 220px 80px;display:flex;flex-direction:column;justify-content:center;opacity:0}
/* 星空粒子（box-shadow 高性能） */
.s1,.s2,.s3,.s4,.s5{position:absolute;border-radius:50%}
.s1{width:1px;height:1px;background:transparent;box-shadow:42px 60px rgba(255,255,255,0.5),118px 35px rgba(255,255,255,0.4),203px 112px rgba(255,255,255,0.6),327px 78px rgba(255,255,255,0.3),451px 156px rgba(255,255,255,0.5),576px 42px rgba(255,255,255,0.4),698px 134px rgba(255,255,255,0.6),823px 67px rgba(255,255,255,0.3),945px 98px rgba(255,255,255,0.5),67px 289px rgba(255,255,255,0.4),189px 345px rgba(255,255,255,0.6),312px 267px rgba(255,255,255,0.3),438px 378px rgba(255,255,255,0.5),562px 312px rgba(255,255,255,0.4),687px 401px rgba(255,255,255,0.6),812px 289px rgba(255,255,255,0.3),938px 356px rgba(255,255,255,0.5),92px 523px rgba(255,255,255,0.4),215px 489px rgba(255,255,255,0.6),340px 567px rgba(255,255,255,0.3),463px 501px rgba(255,255,255,0.5),588px 612px rgba(255,255,255,0.4),713px 478px rgba(255,255,255,0.6),838px 534px rgba(255,255,255,0.3),963px 501px rgba(255,255,255,0.5),45px 734px rgba(255,255,255,0.4),168px 801px rgba(255,255,255,0.6),293px 745px rgba(255,255,255,0.3),417px 823px rgba(255,255,255,0.5),542px 756px rgba(255,255,255,0.4),667px 845px rgba(255,255,255,0.6),792px 712px rgba(255,255,255,0.3),917px 789px rgba(255,255,255,0.5),73px 967px rgba(255,255,255,0.4),198px 1023px rgba(255,255,255,0.6),322px 945px rgba(255,255,255,0.3),447px 1078px rgba(255,255,255,0.5),572px 1012px rgba(255,255,255,0.4),697px 1089px rgba(255,255,255,0.6),822px 956px rgba(255,255,255,0.3),947px 1034px rgba(255,255,255,0.5)}
.s2{width:2px;height:2px;background:transparent;box-shadow:155px 178px rgba(0,212,255,0.5),387px 92px rgba(0,212,255,0.4),612px 234px rgba(0,212,255,0.6),837px 145px rgba(0,212,255,0.3),267px 456px rgba(0,212,255,0.5),492px 389px rgba(0,212,255,0.4),717px 512px rgba(0,212,255,0.6),942px 423px rgba(0,212,255,0.3),178px 678px rgba(0,212,255,0.5),403px 734px rgba(0,212,255,0.4),628px 612px rgba(0,212,255,0.6),853px 689px rgba(0,212,255,0.3),145px 912px rgba(0,212,255,0.5),370px 867px rgba(0,212,255,0.4),595px 956px rgba(0,212,255,0.6),820px 823px rgba(0,212,255,0.3),234px 1123px rgba(0,212,255,0.5),459px 1089px rgba(0,212,255,0.4),684px 1156px rgba(0,212,255,0.6),909px 1034px rgba(0,212,255,0.3),189px 1312px rgba(0,212,255,0.5),414px 1389px rgba(0,212,255,0.4),639px 1267px rgba(0,212,255,0.6),864px 1345px rgba(0,212,255,0.3),267px 1534px rgba(0,212,255,0.5),492px 1601px rgba(0,212,255,0.4),717px 1478px rgba(0,212,255,0.6),942px 1556px rgba(0,212,255,0.3),156px 1723px rgba(0,212,255,0.5),381px 1789px rgba(0,212,255,0.4),606px 1667px rgba(0,212,255,0.6),831px 1845px rgba(0,212,255,0.3)}
.s3{width:4px;height:4px;background:transparent;box-shadow:280px 320px rgba(200,210,255,0.3),580px 480px rgba(200,210,255,0.25),830px 560px rgba(200,210,255,0.3),180px 780px rgba(200,210,255,0.25),480px 920px rgba(200,210,255,0.3),730px 1050px rgba(200,210,255,0.25),330px 1280px rgba(200,210,255,0.3),630px 1420px rgba(200,210,255,0.25),880px 1580px rgba(200,210,255,0.3),230px 1720px rgba(200,210,255,0.25),530px 1860px rgba(200,210,255,0.3),780px 180px rgba(200,210,255,0.25)}
/* 星云 */
.neb{position:absolute;border-radius:50%;filter:blur(80px)}
.neb-b{position:absolute;border-radius:50%;filter:blur(100px)}
/* 光点 */
.sp{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0.9}
.sp-a{background:var(--accent);box-shadow:0 0 8px var(--accent),0 0 20px rgba(0,212,255,0.3)}
.sp-w{background:var(--warm);box-shadow:0 0 8px var(--warm),0 0 20px rgba(255,184,0,0.3)}
.sp-d{position:absolute;width:4px;height:4px;border-radius:50%;opacity:0.7}
/* 流星 */
.shoot{position:absolute;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.7) 100%);border-radius:1px;opacity:0}
/* 光环 */
.ring{position:absolute;border:2px solid rgba(0,212,255,0.3);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
/* 渐变文字 */
.grad{background-image:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent}
</style>
</head>
<body>
<div class="comp" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="TOTAL_DURATION">
  <audio id="narration" data-track-index="1" data-volume="1" data-start="0" src="narration.mp3" preload="auto"></audio>
  <audio id="bgm" data-track-index="2" data-volume="BGM_VOLUME" data-start="0" src="bgm.wav" preload="auto" loop></audio>

  <!-- S1: hook — 星空底 + 光芒放射 + 主标题 ≥100px -->
  <div class="clip" id="s1" data-start="0" data-duration="S1_DURATION">
    <div class="layer-bg">
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#001a33,#080818)"></div>
      <div style="position:absolute;top:25%;left:20%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,hsla(210,70%,55%,0.18),hsla(260,50%,40%,0.06),transparent 70%);filter:blur(80px)"></div>
      <div style="position:absolute;top:50%;left:55%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,hsla(280,60%,50%,0.14),hsla(220,40%,35%,0.05),transparent 70%);filter:blur(70px)"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.015) 0%,transparent 35%,transparent 65%,rgba(255,255,255,0.025) 100%)"></div>
    </div>
    <div class="layer-fx">
      <div class="s1"></div><div class="s2"></div><div class="s3"></div>
      <div id="s1-rays" style="position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:800px;height:800px;background:repeating-conic-gradient(from 0deg,rgba(0,212,255,0.08) 0deg 2deg,transparent 2deg 15deg);border-radius:50%;opacity:0"></div>
      <div id="s1-glow" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:400px;height:400px;border-radius:50%;background:rgba(0,212,255,0.25);filter:blur(80px);opacity:0"></div>
      <div id="s1-d1" style="position:absolute;width:8px;height:8px;top:35%;left:45%;background:var(--accent);border-radius:50%;opacity:0"></div>
      <div id="s1-d2" style="position:absolute;width:6px;height:6px;top:38%;left:55%;background:var(--accent);border-radius:50%;opacity:0"></div>
      <div id="s1-d3" style="position:absolute;width:10px;height:10px;top:42%;left:48%;background:var(--accent2);border-radius:50%;opacity:0"></div>
      <div class="neb" style="top:10%;left:25%;width:500px;height:280px;background:radial-gradient(ellipse,rgba(0,212,255,0.08),transparent)"></div>
      <div class="neb-b" style="top:55%;right:5%;width:450px;height:350px;background:radial-gradient(ellipse,rgba(60,80,200,0.12),transparent)"></div>
      <div class="sp sp-a" style="top:10%;left:22%"></div>
      <div class="sp sp-a" style="top:28%;right:15%"></div>
      <div class="sp sp-w" style="top:80%;left:65%"></div>
      <div class="shoot" style="top:25%;left:15%;width:100px;transform:rotate(-35deg)"></div>
    </div>
    <div class="layer-content">
      <div class="phase" style="align-items:center;text-align:center">
        <h1 style="font-size:120px;font-weight:900;line-height:1.1;color:var(--cream)">标题</h1>
        <div style="width:80px;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin:24px 0"></div>
        <p style="font-size:42px;color:var(--muted)">副标题</p>
      </div>
    </div>
  </div>

  <!-- S2: content — bg 渐变差异 + 星空 + 光效 -->
  <div class="clip" id="s2" data-start="S1_DURATION" data-duration="S2_DURATION">
    <div class="layer-bg">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,#080818 0%,#0a1520 50%,#080818 100%)"></div>
      <div style="position:absolute;top:25%;left:20%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,180,200,0.12),transparent 70%);filter:blur(80px)"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.02) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.02) 100%)"></div>
    </div>
    <div class="layer-fx">
      <div class="s1"></div><div class="s2"></div><div class="s3"></div>
      <div id="s2-fx1" style="position:absolute;width:200px;height:200px;top:60%;left:70%;border-radius:50%;background:rgba(0,212,255,0.15);filter:blur(40px)"></div>
      <div id="s2-fx2" style="position:absolute;width:150px;height:150px;top:20%;left:20%;border-radius:50%;background:rgba(123,47,190,0.1);filter:blur(30px)"></div>
      <div class="sp sp-a" style="top:18%;right:22%"></div>
      <div class="sp sp-w" style="top:65%;left:15%"></div>
      <div class="neb-b" style="top:40%;left:50%;width:350px;height:350px;background:radial-gradient(ellipse,rgba(60,80,200,0.1),transparent);transform:translate(-50%,-50%)"></div>
      <div class="ring" style="top:50%;left:50%;width:250px;height:250px"></div>
    </div>
    <div class="layer-content">
      <div class="phase">
        <!-- 内容区域 -->
      </div>
    </div>
  </div>

  <!-- S3-S5: 重复 s2 结构，改变 bg 渐变/配色/特效 -->

  <!-- S_LAST: CTA — 暖色光晕 + 大标题 -->
  <div class="clip" id="sN" data-start="S_PREV_END" data-duration="SN_DURATION">
    <div class="layer-bg">
      <div style="position:absolute;inset:0;background:linear-gradient(135deg,#0a0800,#1a1200,#0a0800)"></div>
      <div style="position:absolute;top:30%;left:30%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,0,0.25),transparent 60%);filter:blur(80px)"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,transparent 30%,rgba(0,0,0,0.5) 100%)"></div>
    </div>
    <div class="layer-fx">
      <div class="s1"></div><div class="s2"></div>
      <div class="sp sp-w" style="top:24%;left:32%"></div>
      <div class="sp sp-a" style="top:65%;right:22%"></div>
      <div class="neb" style="top:50%;left:50%;width:300px;height:250px;background:radial-gradient(ellipse,rgba(255,184,0,0.08),transparent);transform:translate(-50%,-50%)"></div>
      <div class="ring" style="top:50%;left:50%;width:200px;height:200px"></div>
    </div>
    <div class="layer-content">
      <div class="phase" style="text-align:center">
        <h2 style="font-size:96px;font-weight:900;color:var(--cream);line-height:1.2">关注</h2>
        <p style="font-size:36px;color:var(--muted);margin-top:24px">副标题</p>
      </div>
    </div>
  </div>

</div>

<script>
window.__timelines = {};
window.__hf = { paused: true, duration: TOTAL_DURATION, seek: function(){} };
var tl = gsap.timeline({paused:true});
var S={s1:0, s2:S1_DURATION, sN:S_PREV_END};

// ═══ S1: hook — 光芒放射 + 光点 + 星空漂移 ═══
tl.fromTo('#s1-rays',{opacity:0,scale:0.5},{opacity:1,scale:1,duration:0.8,ease:'power2.out'},S.s1+0.1);
tl.to('#s1-rays',{rotation:90,duration:2.8,ease:'none'},S.s1+0.1);
tl.to('#s1-rays',{opacity:0,duration:0.5,ease:'power2.in'},S.s1+2.6);
tl.fromTo('#s1-glow',{opacity:0,scale:0.6},{opacity:1,scale:1.2,duration:0.6,ease:'power2.out'},S.s1+0.1);
tl.to('#s1-glow',{opacity:0.5,scale:1.4,duration:1.5,ease:'sine.inOut',yoyo:true,repeat:1},S.s1+0.7);
tl.to('#s1-glow',{opacity:0,duration:0.5,ease:'power2.in'},S.s1+2.6);
tl.fromTo('#s1-d1',{opacity:0,y:0},{opacity:0.8,y:-15,duration:1.2,ease:'sine.inOut',yoyo:true,repeat:1},S.s1+0.2);
tl.fromTo('#s1-d2',{opacity:0,y:0},{opacity:0.6,y:10,duration:1.5,ease:'sine.inOut',yoyo:true,repeat:1},S.s1+0.3);
tl.fromTo('#s1-d3',{opacity:0,scale:1},{opacity:1,scale:1.8,duration:1.0,ease:'sine.inOut',yoyo:true,repeat:1},S.s1+0.15);
// 星空漂移（每场景独立方向）
tl.to('#s1 .s1',{x:18,y:-10,duration:S1_DURATION,ease:'none'},S.s1);
tl.to('#s1 .s2',{x:-14,y:8,duration:S1_DURATION,ease:'none'},S.s1);
// 星云呼吸
tl.to('#s1 .neb',{scale:1.2,duration:S1_DURATION/2,yoyo:true,repeat:1,ease:'sine.inOut'},S.s1);
tl.to('#s1 .neb-b',{scale:1.15,duration:S1_DURATION*0.6,yoyo:true,repeat:0,ease:'sine.inOut'},S.s1);
// 光点闪烁
tl.to('#s1 .sp',{opacity:0.3,duration:1.2,yoyo:true,repeat:3,ease:'sine.inOut',stagger:{each:0.4,from:'random'}},S.s1);
// 流星
tl.fromTo('#s1 .shoot',{x:-200,y:-120,opacity:0},{x:600,y:400,opacity:0.9,duration:1.3,ease:'power2.in'},3.5);
tl.to('#s1 .shoot',{opacity:0,duration:0.4},4.8);
// hook 内容入场
tl.set('#s1 .phase',{opacity:0},S.s1).to('#s1 .phase',{opacity:1,duration:0.4,ease:'power3.out'},S.s1+0.1);

// ═══ S2: content — 星空漂移 + 光效浮动 + 光环扩散 ═══
tl.to('#s2 .s1',{x:18,y:-10,duration:S2_DURATION,ease:'none'},S.s2);
tl.to('#s2 .s2',{x:-14,y:8,duration:S2_DURATION,ease:'none'},S.s2);
tl.to('#s2 .neb-b',{scale:1.15,duration:S2_DURATION*0.6,yoyo:true,repeat:0,ease:'sine.inOut'},S.s2);
tl.to('#s2 .sp',{opacity:0.3,duration:1.2,yoyo:true,repeat:2,ease:'sine.inOut',stagger:{each:0.4,from:'random'}},S.s2);
tl.to('#s2-fx1',{x:20,y:-10,duration:4,ease:'sine.inOut',repeat:-1,yoyo:true},S.s2);
tl.to('#s2-fx2',{x:-15,y:15,duration:3,ease:'sine.inOut',repeat:-1,yoyo:true},S.s2);
tl.fromTo('#s2 .ring',{scale:0.3,opacity:0.5},{scale:2.5,opacity:0,duration:4,ease:'power2.out'},S.s2+1.5);
// 内容入场
tl.set('#s2 .phase',{opacity:0},S.s2).to('#s2 .phase',{opacity:1,duration:0.6,ease:'power2.out'},S.s2+0.1);

// ═══ S3-S5: 同 S2 模式，替换选择器和时间偏移 ═══

// ═══ SN: CTA — 暖色光点 + 光环 ═══
tl.set('#sN .phase',{opacity:0},S.sN).to('#sN .phase',{opacity:1,duration:0.8,ease:'power2.out'},S.sN+0.1);
tl.to('#sN .s1',{x:18,y:-10,duration:SN_DURATION,ease:'none'},S.sN);
tl.to('#sN .s2',{x:-14,y:8,duration:SN_DURATION,ease:'none'},S.sN);
tl.to('#sN .neb',{scale:1.2,duration:SN_DURATION/2,yoyo:true,repeat:1,ease:'sine.inOut'},S.sN);
tl.to('#sN .sp',{opacity:0.3,duration:1.2,yoyo:true,repeat:2,ease:'sine.inOut',stagger:{each:0.4,from:'random'}},S.sN);
tl.fromTo('#sN .ring',{scale:0.3,opacity:0.5},{scale:2,opacity:0,duration:3,ease:'power2.out'},S.sN+1);

window.__timelines["main"] = tl;
</script>
</body>
</html>
