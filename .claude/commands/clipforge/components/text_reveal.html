<!--
  TextReveal — 文字揭示动画
  用途: 悬念揭示、关键信息展示
  情感目标: 悬念、惊喜
  适用场景类型: reveal, surprise
  padding: 无 — 嵌入 .layer-content，padding 由 .scene-wrap 统一管理
-->
<!-- HTML -->
<div class="text-reveal">
  <div class="reveal-mask">
    <div class="reveal-text">58K Star</div>
  </div>
</div>

<!-- CSS -->
<style>
.text-reveal {
  display: flex; align-items: center; justify-content: center;
}
.reveal-mask {
  overflow: hidden;
}
.reveal-text {
  font-size: 140px; font-weight: 900;
  color: var(--accent-warm);
  text-shadow: 0 0 80px rgba(240,180,41,0.6);
}
</style>

<!-- JS (GSAP) -->
<script>
tl.from('.reveal-text', {
  y:'100%', duration:0.6, ease:'power4.out'
}, startTime);
</script>
