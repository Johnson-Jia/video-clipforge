<!--
@ComponentMeta
name: compare_split
layer: content
tags: [compare, versus, dual, split]
emotion_range: [tension, surprise]
visual_density: medium
complexity: css-only
description: 双栏对比布局，左/右分栏展示两个项目或功能的对比数据
parameters: {}
/ComponentMeta
-->
<!-- HTML -->
<div class="compare-split">
  <div class="compare-col left">
    <div class="compare-header">项目 A</div>
    <div class="compare-items">
      <div class="compare-item"><span class="label">速度</span><span class="value">快</span></div>
      <div class="compare-item"><span class="label">内存</span><span class="value">低</span></div>
    </div>
  </div>
  <div class="compare-divider"></div>
  <div class="compare-col right">
    <div class="compare-header">项目 B</div>
    <div class="compare-items">
      <div class="compare-item"><span class="label">速度</span><span class="value">更快</span></div>
      <div class="compare-item"><span class="label">内存</span><span class="value">较高</span></div>
    </div>
  </div>
</div>

<!-- CSS -->
<style>
.compare-split {
  display: flex; width: 100%; height: 100%;
}
.compare-col {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 0;
}
.compare-col.left { background: linear-gradient(135deg, rgba(0,229,160,0.08), transparent); }
.compare-col.right { background: linear-gradient(225deg, rgba(240,180,41,0.08), transparent); }
.compare-header { font-size: 42px; font-weight: 800; color: #fff; margin-bottom: 40px; }
.compare-divider {
  width: 2px; background: linear-gradient(180deg, transparent, #fff, transparent);
  opacity: 0.3; align-self: stretch; margin: 100px 0;
}
.compare-items { display: flex; flex-direction: column; gap: 20px; width: 100%; }
.compare-item {
  display: flex; justify-content: space-between;
  padding: 16px 24px; border-radius: 12px;
  background: rgba(255,255,255,0.05);
}
.compare-item .label { font-size: 40px; color: var(--text-secondary); }
.compare-item .value { font-size: 40px; font-weight: 700; color: #fff; }
</style>

<!-- JS (GSAP) -->
<script>
// Step 1: Left panel sweeps in with clip-path wipe
tl.from('.compare-col.left', {opacity:0, x:'-60%', clipPath:'inset(0 100% 0 0)', duration:0.6, ease:'power4.out'}, startTime)
  // Step 2: Right panel sweeps in from opposite side
  .from('.compare-col.right', {opacity:0, x:'60%', clipPath:'inset(0 0 0 100%)', duration:0.6, ease:'power4.out'}, startTime + 0.1)
  // Step 3: Divider draws in from center
  .fromTo('.compare-divider',
    {scaleY:0, opacity:0},
    {scaleY:1, opacity:0.5, duration:0.5, ease:'power4.out', transformOrigin:'center center'}, startTime + 0.3)
  // Step 4: Headers punch in with scale
  .from('.compare-header', {opacity:0, scale:0.7, y:-20, duration:0.35, ease:'back.out(1.8)', stagger:0.1}, startTime + 0.45)
  // Step 5: Items stagger in with alternating rotation
  .from('.compare-item', {
    opacity:0, y:25, rotation:(i) => i % 2 === 0 ? -3 : 3,
    duration:0.35, ease:'back.out(1.5)', stagger:0.1
  }, startTime + 0.65)
  // Step 6: Values glow on reveal
  .fromTo('.compare-item .value',
    {textShadow:'0 0 0px transparent'},
    {textShadow:'0 0 20px rgba(255,255,255,0.3)', duration:0.3, ease:'power2.out', stagger:0.1}, startTime + 0.9);
</script>
