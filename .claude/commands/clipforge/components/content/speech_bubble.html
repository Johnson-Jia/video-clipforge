<!-- HTML -->
<div class="speech-bubble">
  <div class="bubble-text">涨星比发际线退得还快</div>
  <div class="bubble-tail"></div>
</div>

<!-- CSS -->
<style>
.speech-bubble {
  position: absolute; bottom: 280px; right: 60px;
  background: rgba(255,255,255,0.95);
  border-radius: 24px; padding: 24px 36px;
  max-width: 500px; z-index: 10;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.bubble-text {
  font-size: 30px; font-weight: 700;
  color: #1a1a2e; line-height: 1.4;
}
.bubble-tail {
  position: absolute; bottom: -12px; right: 60px;
  width: 0; height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-top: 16px solid rgba(255,255,255,0.95);
}
</style>

<!-- JS (GSAP) -->
<script>
// Step 1: Bubble inflates from zero with elastic spring
tl.from('.speech-bubble', {scale:0, opacity:0, rotation:-5, duration:0.6, ease:'elastic.out(1, 0.35)'}, startTime)
  // Step 2: Tail springs out with overshoot
  .from('.bubble-tail', {scaleX:0, scaleY:0, opacity:0, duration:0.35, ease:'back.out(3)'}, startTime + 0.3)
  // Step 3: Text fades in with slight upward drift
  .from('.bubble-text', {opacity:0, y:15, scale:0.9, duration:0.3, ease:'power4.out'}, startTime + 0.4)
  // Step 4: Wobble settle
  .to('.speech-bubble', {rotation:1, duration:0.1, ease:'power2.out'}, startTime + 0.7)
  .to('.speech-bubble', {rotation:0, duration:0.08, ease:'power2.out'}, startTime + 0.8)
  // Step 5: Gentle floating bob
  .to('.speech-bubble', {y:-6, duration:0.5, ease:'sine.inOut', yoyo:true, repeat:1}, startTime + 1.0)
  // Step 6: Glow pulse
  .fromTo('.speech-bubble',
    {boxShadow:'0 8px 32px rgba(0,0,0,0.3)'},
    {boxShadow:'0 8px 48px rgba(0,0,0,0.4), 0 0 60px rgba(255,255,255,0.08)', duration:0.3, ease:'power2.out'}, startTime + 0.9);
</script>
