<!--
@ComponentMeta
name: project_full_card
layer: content
tags: [project-card, listing, full-screen, single-project]
emotion_range: [confidence, interest]
visual_density: compact
complexity: css-only
description: 标准模式单项目全屏卡片，8 层信息结构（类别/排名/项目名/描述/语言/星标/卖点/评语），full-page 型自带 padding
parameters:
  padding: { default: "180px 80px 220px 80px" }
/ComponentMeta
-->
<!-- HTML -->
<div class="project-full-card">
  <!-- 背景装饰 -->
  <div class="pfc-glow pfc-glow-warm"></div>
  <div class="pfc-glow pfc-glow-cool"></div>
  <div class="pfc-grid"></div>

  <!-- 第1层：类别标签 -->
  <div class="pfc-category">WiFi 黑科技</div>

  <!-- 核心信息区 -->
  <div class="pfc-main">
    <!-- 第2层：排名数字（左侧） -->
    <div class="pfc-rank">4</div>

    <!-- 中间信息列 -->
    <div class="pfc-info">
      <!-- 第3层：项目名 -->
      <div class="pfc-name">RuView</div>
      <!-- 第4层：一句话描述 -->
      <div class="pfc-desc">WiFi 信号空间感知 · 无需摄像头</div>
      <!-- 第5层：语言标签 -->
      <div class="pfc-lang">Rust</div>
    </div>

    <!-- 第6层：星标增量（右侧） -->
    <div class="pfc-stars">+700 ★</div>
  </div>

  <!-- 第7层：三词卖点 -->
  <div class="pfc-selling">射频信号 · 姿态估计 · 体征监测</div>
  <!-- 第8层：感性评语 -->
  <div class="pfc-commentary">家用 WiFi 即可实现空间智能</div>
</div>

<!-- CSS -->
<style>
.project-full-card {
  position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 180px 80px 220px 80px;
}
.pfc-glow {
  position: absolute; border-radius: 50%; filter: blur(140px);
  pointer-events: none;
}
.pfc-glow-warm {
  width: 500px; height: 500px; opacity: 0.2;
  background: var(--accent-warm);
  top: 300px; left: -80px;
}
.pfc-glow-cool {
  width: 400px; height: 400px; opacity: 0.15;
  background: var(--accent-cool);
  bottom: 400px; right: -60px;
}
.pfc-grid {
  position: absolute; width: 100%; height: 100%;
  background-image:
    linear-gradient(rgba(0,229,160,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,160,0.04) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none;
}
.pfc-category {
  font-size: 40px; font-weight: 600;
  color: var(--accent-cool);
  margin-bottom: 60px;
}
.pfc-main {
  display: flex; align-items: center; gap: 40px;
  width: 100%; margin-bottom: 60px;
}
.pfc-rank {
  font-size: 120px; font-weight: 900;
  color: var(--accent-warm);
  text-shadow: 0 0 60px rgba(240,180,41,0.4);
  flex-shrink: 0; min-width: 140px; text-align: center;
}
.pfc-info {
  flex: 1; display: flex; flex-direction: column; gap: 12px;
}
.pfc-name {
  font-size: 56px; font-weight: 800; color: #fff;
  font-family: 'JetBrains Mono', monospace;
}
.pfc-desc {
  font-size: 32px; color: var(--text-secondary); line-height: 1.4;
}
.pfc-lang {
  display: inline-block; font-size: 36px; font-weight: 600;
  color: var(--accent-cool);
  background: rgba(0,180,255,0.12);
  padding: 4px 16px; border-radius: 12px;
  margin-top: 4px; width: fit-content;
}
.pfc-stars {
  font-size: 36px; font-weight: 800;
  color: var(--accent-warm);
  text-shadow: 0 0 30px rgba(240,180,41,0.3);
  flex-shrink: 0; text-align: right; white-space: nowrap;
}
.pfc-selling {
  font-size: 32px; font-weight: 600;
  color: var(--accent-cool);
  margin-bottom: 24px; text-align: center;
}
.pfc-commentary {
  font-size: 40px;
  color: var(--text-secondary);
  text-align: center;
}
</style>

<!-- JS (GSAP) -->
<script>
// Step 1: Category tag spins in
tl.from('.pfc-category', {opacity:0, scale:0, rotation:-15, duration:0.45, ease:'back.out(2.5)'}, startTime + 0.05)
  // Step 2: Rank number zooms from distance
  .from('.pfc-rank', {scale:4, opacity:0, duration:0.55, ease:'power4.out'}, startTime + 0.15)
  .to('.pfc-rank', {scale:0.92, duration:0.2, ease:'power2.inOut'}, startTime + 0.7)
  .to('.pfc-rank', {scale:1, duration:0.15, ease:'back.out(1.5)'}, startTime + 0.9)
  // Step 3: Project name slides in with clip-path
  .from('.pfc-name', {opacity:0, x:-50, clipPath:'inset(0 100% 0 0)', duration:0.4, ease:'power4.out'}, startTime + 0.45)
  // Step 4: Description fades in
  .from('.pfc-desc', {opacity:0, y:15, duration:0.3, ease:'power4.out'}, startTime + 0.65)
  // Step 5: Language badge elastic pop
  .from('.pfc-lang', {opacity:0, scale:0, rotation:20, duration:0.35, ease:'elastic.out(1, 0.5)'}, startTime + 0.8)
  // Step 6: Stars burst in with glow
  .from('.pfc-stars', {opacity:0, scale:0, duration:0.45, ease:'elastic.out(1, 0.4)'}, startTime + 0.55)
  .fromTo('.pfc-stars',
    {textShadow:'0 0 30px rgba(240,180,41,0.3)'},
    {textShadow:'0 0 60px rgba(240,180,41,0.6), 0 0 100px rgba(240,180,41,0.3)', duration:0.3, ease:'power2.out'}, startTime + 1.0)
  // Step 7: Selling points slide up
  .from('.pfc-selling', {opacity:0, y:20, duration:0.3, ease:'back.out(1.5)'}, startTime + 1.05)
  // Step 8: Commentary drifts in
  .from('.pfc-commentary', {opacity:0, x:30, duration:0.35, ease:'power4.out'}, startTime + 1.25)
  // Step 9: Background glows pulse
  .to('.pfc-glow-warm', {scale:1.2, duration:0.5, ease:'sine.inOut', yoyo:true, repeat:1}, startTime + 0.3)
  .to('.pfc-glow-cool', {scale:1.15, duration:0.5, ease:'sine.inOut', yoyo:true, repeat:1}, startTime + 0.5);
</script>
