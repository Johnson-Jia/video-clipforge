<!--
@ComponentMeta
name: char_overlay
layer: content
tags: [character, reaction, emotion, avatar, expression]
emotion_range: [neutral, amusement, shock, excitement]
visual_density: low
complexity: css-only
description: 码力角色覆盖层，6 种表情 SVG（shock/think/cool/explode/tease/moved），根据 narration 的 character_expression 选择
parameters:
  expression: { default: "explode", range: ["shock", "think", "cool", "explode", "tease", "moved"] }
/ComponentMeta
-->
<!-- HTML (explode 表情示例) -->
<div class="char-overlay" data-expression="explode">
  <svg class="char-svg" viewBox="0 0 200 280" width="180" height="250">
    <!-- 身体 -->
    <rect x="60" y="140" width="80" height="100" rx="16" fill="#4a4a6a"/>
    <!-- 头 -->
    <circle cx="100" cy="90" r="55" fill="#6a6a8a"/>
    <!-- 眼睛 — explode: 星星眼 -->
    <text x="78" y="95" font-size="24" fill="#f0b429">★</text>
    <text x="112" y="95" font-size="24" fill="#f0b429">★</text>
    <!-- 嘴 — explode: 大张嘴 -->
    <ellipse cx="100" cy="120" rx="18" ry="14" fill="#2a2a4a"/>
    <!-- 头发 — explode: 爆炸发型 -->
    <path d="M55,55 L40,20 L70,45 L60,10 L90,40 L85,5 L110,38 L120,10 L130,45 L140,20 L145,55"
          stroke="#f0b429" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>
</div>

<!-- CSS -->
<style>
.char-overlay {
  position: absolute; bottom: 200px; left: 60px;
  z-index: 10;
}
.char-svg { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)); }
</style>

<!-- JS (GSAP) -->
<script>
// Step 1: Character bounces in with elastic spin
tl.from('.char-overlay', {opacity:0, scale:0, rotation:-30, duration:0.7, ease:'elastic.out(1, 0.4)'}, startTime)
  // Step 2: SVG elements inside stagger glow
  .from('.char-svg *', {opacity:0, scale:0.8, stagger:0.03, duration:0.15, ease:'back.out(2)'}, startTime + 0.3)
  // Step 3: Wobble settle
  .to('.char-overlay', {rotation:3, duration:0.12, ease:'power2.out'}, startTime + 0.8)
  .to('.char-overlay', {rotation:-1, duration:0.1, ease:'power2.out'}, startTime + 0.92)
  .to('.char-overlay', {rotation:0, duration:0.08, ease:'power2.out'}, startTime + 1.02)
  // Step 4: Gentle floating bob
  .to('.char-overlay', {y:-8, duration:0.6, ease:'sine.inOut', yoyo:true, repeat:1}, startTime + 1.2)
  // Step 5: Glow pulse on eyes
  .fromTo('.char-svg',
    {filter:'drop-shadow(0 4px 12px rgba(0,0,0,0.3))'},
    {filter:'drop-shadow(0 4px 24px rgba(240,180,41,0.5))', duration:0.3, ease:'power2.out'}, startTime + 1.0);
</script>
