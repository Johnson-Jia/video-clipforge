parameters: {}

<!-- HTML -->
<div class="rec-wrap">
  <div class="rec-heading">
    <span class="rec-white">创业机会</span>
    <span class="rec-accent">优先级</span>
  </div>
  <div class="rec-sub">基于市场规模、竞争格局、技术成熟度三维评估</div>
  <div class="rec-stack">
    <div class="rec-item rec-top">
      <div class="rec-icon">🥇</div>
      <div class="rec-text">
        <div class="rec-name">养老 AI 手环 / 眼镜</div>
        <div class="rec-desc">蓝海 · 刚需 · 子女付费模式</div>
      </div>
      <div class="rec-score rec-score-g">A+</div>
    </div>
    <div class="rec-item rec-mid">
      <div class="rec-icon">🥈</div>
      <div class="rec-text">
        <div class="rec-name">垂直场景 AI 眼镜</div>
        <div class="rec-desc">B 端 · 高客单价 · 行业壁垒</div>
      </div>
      <div class="rec-score rec-score-b">B+</div>
    </div>
    <div class="rec-item rec-low">
      <div class="rec-icon">🚫</div>
      <div class="rec-text">
        <div class="rec-name">通用消费 AI 眼镜</div>
        <div class="rec-desc">大厂红海 · 高投入 · 低壁垒</div>
      </div>
      <div class="rec-score rec-score-d">D</div>
    </div>
  </div>
  <div class="rec-conclusion">
    <strong>结论</strong>：养老 AI 是唯一同时满足 <span class="rec-hl">刚需 + 蓝海 + 窗口期</span> 三个条件的方向
  </div>
</div>

<!-- CSS -->
<style>
.rec-wrap {
  display: flex; flex-direction: column;
  align-items: center; width: 100%;
}
.rec-heading { font-size: 36px; font-weight: 900; margin-bottom: 12px; text-align: center; }
.rec-white { color: var(--text-primary, #F9FAFB); }
.rec-accent {
  background: linear-gradient(135deg, #10B981, #06B6D4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.rec-sub { font-size: 18px; color: var(--text-dim, #6B7280); margin-bottom: 36px; }
.rec-stack { width: 100%; display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
.rec-item {
  display: flex; align-items: center; gap: 20px;
  border-radius: 16px; padding: 28px 32px;
  border: 2px solid rgba(255,255,255,0.04);
}
.rec-top { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.2); }
.rec-mid { background: rgba(59,130,246,0.06); border-color: rgba(59,130,246,0.12); }
.rec-low { background: rgba(255,255,255,0.02); }
.rec-icon { font-size: 40px; }
.rec-text { flex: 1; }
.rec-name { font-size: 24px; font-weight: 700; color: var(--text-primary, #F9FAFB); margin-bottom: 4px; }
.rec-desc { font-size: 16px; color: var(--text-dim, #6B7280); }
.rec-score { font-size: 32px; font-weight: 900; text-align: right; }
.rec-score-g { color: #10B981; }
.rec-score-b { color: #3B82F6; }
.rec-score-d { color: var(--text-dim, #6B7280); }
.rec-conclusion {
  width: 100%;
  background: rgba(16,185,129,0.05);
  border: 1px solid rgba(16,185,129,0.1);
  border-left: 5px solid #10B981;
  border-radius: 0 14px 14px 0;
  padding: 24px 32px;
  font-size: 20px; line-height: 1.7;
  color: var(--text-secondary, #9CA3AF);
}
.rec-conclusion strong { color: var(--text-primary, #F9FAFB); }
.rec-hl { color: #F59E0B; font-weight: 700; }
</style>

<!-- JS (GSAP) -->
<script>
tl.from('.rec-heading', {opacity:0, y:20, duration:0.3, ease:'power3.out'}, startTime)
  .from('.rec-sub', {opacity:0, duration:0.3}, startTime + 0.15)
  .from('.rec-item', {
    opacity:0, x:-30, duration:0.4, ease:'power3.out',
    stagger:0.12
  }, startTime + 0.3)
  .from('.rec-score', {opacity:0, scale:0.5, duration:0.3, ease:'back.out(2)', stagger:0.12}, startTime + 0.5)
  .from('.rec-conclusion', {opacity:0, y:20, duration:0.4, ease:'power3.out'}, startTime + 0.9);
</script>
