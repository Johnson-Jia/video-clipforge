/ComponentMeta

<!-- HTML -->
<div class="timeline-flow">
  <div class="timeline-line"></div>
  <div class="timeline-node" data-index="0">
    <div class="node-dot"></div>
    <div class="node-content">
      <div class="node-date">2024.01</div>
      <div class="node-text">项目启动</div>
    </div>
  </div>
  <!-- 更多节点... -->
</div>

<!-- CSS -->
<style>
.timeline-flow {
  position: relative; width: 100%;
  display: flex; flex-direction: column; gap: 60px;
}
.timeline-line {
  position: absolute; left: 60px; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--accent-cool), var(--accent-warm));
  opacity: 0.5;
}
.timeline-node {
  display: flex; align-items: center; gap: 40px;
  margin-left: 60px;
}
.node-dot {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent-cool);
  box-shadow: 0 0 20px var(--accent-cool);
  flex-shrink: 0;
}
.node-date { font-size: 24px; color: var(--accent-warm); font-weight: 700; }
.node-text { font-size: 32px; color: #fff; margin-top: 8px; }
</style>

<!-- JS (GSAP) -->
<script>
// Step 1: Timeline line draws in from top
tl.from('.timeline-line', {scaleY:0, transformOrigin:'top center', duration:0.6, ease:'power4.out'}, startTime)
  // Step 2: Node dots pop in sequence
  .from('.node-dot', {scale:0, opacity:0, duration:0.3, ease:'back.out(2)', stagger:0.15}, startTime + 0.3)
  // Step 3: Node content slides in with alternating direction
  .from('.timeline-node', {
    opacity:0, x:(i) => i % 2 === 0 ? -40 : 40,
    duration:0.35, ease:'power3.out', stagger:0.15
  }, startTime + 0.4);
</script>
