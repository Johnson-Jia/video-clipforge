<!-- HTML -->
<div class="hero-card">
  <div class="hero-glow hero-glow-warm"></div>
  <div class="hero-glow hero-glow-cool"></div>
  <div class="hero-grid"></div>
  <div class="hero-badge">{M}月{D}日 GitHub 榜单</div>
  <div class="hero-title">AI 项目<span class="accent">直接霸榜</span></div>
  <div class="hero-sub">8 个热门 · 6 个 AI 相关</div>
</div>

<!-- CSS -->
<style>
.hero-card {
  position: relative; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 180px 80px 220px 80px;
}
.hero-glow {
  position: absolute; border-radius: 50%; filter: blur(140px);
  pointer-events: none;
}
.hero-glow-warm {
  width: 600px; height: 600px; opacity: 0.25;
  background: var(--accent-warm);
  top: 200px; left: -100px;
}
.hero-glow-cool {
  width: 500px; height: 500px; opacity: 0.2;
  background: var(--accent-cool);
  bottom: 300px; right: -80px;
}
.hero-grid {
  position: absolute; width: 100%; height: 100%;
  background-image:
    linear-gradient(rgba(0,229,160,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,160,0.04) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none;
}
.hero-badge {
  font-size: 40px; font-weight: 600;
  color: var(--accent-warm);
  background: rgba(240,180,41,0.15);
  padding: 8px 24px; border-radius: 20px;
  margin-bottom: 40px;
}
.hero-title {
  font-size: 120px; font-weight: 900; color: #fff;
  letter-spacing: -2px; line-height: 1.15;
  text-shadow: 0 0 60px rgba(240,180,41,0.5);
  text-align: center;
}
.hero-title .accent { color: var(--accent-warm); }
.hero-sub {
  font-size: 48px; font-weight: 600;
  color: var(--accent-cool); margin-top: 48px;
}
</style>

<!-- JS (GSAP) -->
<script>
// Step 1: Background glows bloom in
tl.from('.hero-glow', {opacity:0, scale:0.5, duration:0.7, stagger:0.1, ease:'power2.out'}, startTime)
  // Step 2: Grid draws in
  .from('.hero-grid', {opacity:0, duration:0.4, ease:'power2.out'}, startTime + 0.1)
  // Step 3: Badge drops in with rotation
  .from('.hero-badge', {opacity:0, y:30, scale:0.5, rotation:-10, duration:0.4, ease:'back.out(2)'}, startTime + 0.15)
  // Step 4: Title scales from zero with power4
  .from('.hero-title', {opacity:0, scale:0.6, duration:0.5, ease:'power4.out', transformOrigin:'center center'}, startTime + 0.3)
  // Step 5: Accent span overshoot
  .from('.hero-title .accent', {scale:1.4, opacity:0, duration:0.35, ease:'back.out(1.5)'}, startTime + 0.6)
  // Step 6: Subtitle scales up
  .from('.hero-sub', {opacity:0, scale:0.8, y:30, duration:0.35, ease:'back.out(1.5)'}, startTime + 0.7)
  // Step 7: Glow blobs pulse
  .to('.hero-glow-warm', {scale:1.15, duration:0.4, ease:'sine.inOut', yoyo:true, repeat:1}, startTime + 0.8)
  .to('.hero-glow-cool', {scale:1.2, duration:0.4, ease:'sine.inOut', yoyo:true, repeat:1}, startTime + 0.9);
</script>
