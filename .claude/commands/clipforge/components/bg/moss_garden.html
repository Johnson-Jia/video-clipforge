<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes mossDrift {
  0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.16; }
  50% { transform: translate(25px, -35px) scale(1.06); opacity: 0.24; }
}
@keyframes organicBreath {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.08; }
  50% { transform: scale(1.04) rotate(1deg); opacity: 0.13; }
}
@keyframes mossFloat {
  0%, 100% { transform: translateY(0); opacity: 0.5; }
  50% { transform: translateY(-50px); opacity: 0.8; }
}
@keyframes fireflyGlow {
  0%, 100% { opacity: 0.25; transform: translateY(0) translateX(0); }
  30% { opacity: 0.65; transform: translateY(-20px) translateX(8px); }
  60% { opacity: 0.45; transform: translateY(-35px) translateX(-5px); }
  80% { opacity: 0.55; transform: translateY(-15px) translateX(3px); }
}
@keyframes dappleShift {
  0%, 100% { opacity: 0.10; transform: translate(0, 0); }
  33% { opacity: 0.16; transform: translate(8px, -5px); }
  66% { opacity: 0.12; transform: translate(-5px, 3px); }
}
@keyframes veinShimmer {
  0%, 100% { opacity: 0.06; }
  50% { opacity: 0.11; }
}
@keyframes mistDrift {
  0%, 100% { transform: translateX(0); opacity: 0.12; }
  50% { transform: translateX(20px); opacity: 0.18; }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.20; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: moss_garden -->
<!-- 深绿底 -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 40% 45%, hsla(140,40%,12%,1), hsla(155,35%,5%,1))"></div>
<!-- 有机曲线 1：翠绿弧线 -->
<div style="position:absolute;inset:0;
  background:repeating-radial-gradient(ellipse at 25% 60%, transparent 0px, transparent 80px, hsla(150,55%,42%,0.09) 81px, transparent 82px);
  animation:organicBreath 22s ease-in-out infinite 0s"></div>
<!-- 有机曲线 2：浅绿波浪 -->
<div style="position:absolute;inset:0;
  background:repeating-radial-gradient(ellipse at 70% 35%, transparent 0px, transparent 100px, hsla(130,40%,55%,0.06) 101px, transparent 102px);
  animation:organicBreath 18s ease-in-out infinite 6s"></div>
<!-- 叶脉光纹：对角线 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,
    transparent 8%, hsla(80,45%,52%,0.08) 12%, transparent 16%,
    transparent 35%, hsla(140,40%,48%,0.06) 39%, transparent 43%,
    transparent 62%, hsla(100,35%,44%,0.07) 66%, transparent 70%,
    transparent 82%, hsla(120,38%,46%,0.05) 86%, transparent 90%);
  animation:veinShimmer 15s ease-in-out infinite"></div>
<!-- 绿色辉光团 1（主焦点） -->
<div style="position:absolute;top:30%;left:18%;width:550px;height:550px;border-radius:50%;
  background:radial-gradient(circle, hsla(140,50%,35%,0.20), hsla(155,45%,22%,0.08), transparent 70%);
  filter:blur(90px);animation:mossDrift 22s ease-in-out infinite 0s"></div>
<!-- 绿色辉光团 2 -->
<div style="position:absolute;top:55%;left:55%;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle, hsla(120,55%,38%,0.15), hsla(150,40%,25%,0.05), transparent 70%);
  filter:blur(80px);animation:mossDrift 26s ease-in-out infinite 8s"></div>
<!-- 翠绿焦点高光 -->
<div style="position:absolute;top:38%;left:32%;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle, hsla(135,60%,50%,0.18), transparent 55%);
  filter:blur(45px);animation:mossDrift 14s ease-in-out infinite 3s"></div>
<!-- 树冠光斑 1 -->
<div style="position:absolute;top:12%;left:28%;width:180px;height:140px;border-radius:50%;
  background:radial-gradient(ellipse, hsla(70,50%,70%,0.12), transparent 70%);
  filter:blur(30px);animation:dappleShift 20s ease-in-out infinite 0s"></div>
<!-- 树冠光斑 2 -->
<div style="position:absolute;top:20%;left:55%;width:140px;height:120px;border-radius:50%;
  background:radial-gradient(ellipse, hsla(80,45%,65%,0.10), transparent 65%);
  filter:blur(25px);animation:dappleShift 16s ease-in-out infinite 4s"></div>
<!-- 树冠光斑 3 -->
<div style="position:absolute;top:8%;left:70%;width:160px;height:100px;border-radius:50%;
  background:radial-gradient(ellipse, hsla(60,40%,68%,0.08), transparent 60%);
  filter:blur(28px);animation:dappleShift 22s ease-in-out infinite 8s"></div>
<!-- 萤火虫 1 -->
<div style="position:absolute;top:45%;left:30%;width:4px;height:4px;border-radius:50%;
  background:hsla(65,80%,60%,0.6);box-shadow:0 0 8px hsla(65,70%,55%,0.5),0 0 16px hsla(65,60%,50%,0.25);
  animation:fireflyGlow 7s ease-in-out infinite 0s"></div>
<!-- 萤火虫 2 -->
<div style="position:absolute;top:55%;left:60%;width:3px;height:3px;border-radius:50%;
  background:hsla(55,75%,58%,0.55);box-shadow:0 0 6px hsla(55,65%,50%,0.4),0 0 12px hsla(55,55%,45%,0.2);
  animation:fireflyGlow 9s ease-in-out infinite 2s"></div>
<!-- 萤火虫 3 -->
<div style="position:absolute;top:35%;left:50%;width:3px;height:3px;border-radius:50%;
  background:hsla(70,85%,62%,0.50);box-shadow:0 0 7px hsla(70,75%,55%,0.4),0 0 14px hsla(70,65%,50%,0.2);
  animation:fireflyGlow 6s ease-in-out infinite 4s"></div>
<!-- 萤火虫 4 -->
<div style="position:absolute;top:62%;left:22%;width:3px;height:3px;border-radius:50%;
  background:hsla(50,70%,55%,0.45);box-shadow:0 0 5px hsla(50,60%,48%,0.35),0 0 10px hsla(50,50%,42%,0.15);
  animation:fireflyGlow 8s ease-in-out infinite 6s"></div>
<!-- 萤火虫 5 -->
<div style="position:absolute;top:40%;left:75%;width:4px;height:4px;border-radius:50%;
  background:hsla(60,80%,58%,0.50);box-shadow:0 0 7px hsla(60,70%,52%,0.4),0 0 14px hsla(60,60%,48%,0.2);
  animation:fireflyGlow 10s ease-in-out infinite 1s"></div>
<!-- 漂浮绿色粒子 1 -->
<div style="position:absolute;top:60%;left:25%;width:3px;height:3px;border-radius:50%;
  background:hsla(130,60%,50%,0.5);box-shadow:0 0 6px hsla(130,50%,45%,0.4);
  animation:mossFloat 14s ease-in-out infinite 0s"></div>
<!-- 漂浮绿色粒子 2 -->
<div style="position:absolute;top:45%;left:65%;width:2px;height:2px;border-radius:50%;
  background:hsla(150,55%,48%,0.45);box-shadow:0 0 5px hsla(150,45%,40%,0.35);
  animation:mossFloat 18s ease-in-out infinite 3s"></div>
<!-- 漂浮绿色粒子 3 -->
<div style="position:absolute;top:70%;left:42%;width:3px;height:3px;border-radius:50%;
  background:hsla(140,50%,52%,0.5);box-shadow:0 0 6px hsla(140,40%,45%,0.4);
  animation:mossFloat 16s ease-in-out infinite 5s"></div>
<!-- 底部薄雾 -->
<div style="position:absolute;bottom:0;left:-10%;width:120%;height:25%;
  background:linear-gradient(to top,hsla(140,20%,18%,0.25),hsla(150,18%,20%,0.12),transparent);
  filter:blur(30px);animation:mistDrift 18s ease-in-out infinite"></div>
<!-- 暗角聚焦 -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 38% 45%,transparent 35%,hsla(150,30%,4%,0.40) 72%,hsla(155,35%,3%,0.65) 100%)"></div>
<!-- 玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(100,220,140,0.02) 0%,transparent 35%,transparent 65%, rgba(80,200,120,0.025) 100%);
  animation:glassShimmer 10s ease-in-out infinite"></div>
