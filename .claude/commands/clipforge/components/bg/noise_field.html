<!--
@ComponentMeta
name: noise_field
layer: bg
tags: [noise, texture, grain, static, atmospheric, depth]

visual_density: medium
complexity: css-only
description: SVG feTurbulence 噪点纹理场 + 渐变底色 + 移动光斑，提供颗粒感的氛围深度，适合警示/紧张/揭秘场景
parameters:
  grain_intensity: { default: 0.08, range: [0.04, 0.15] }
  color_a: { default: "#080818", description: "主底色" }
  color_b: { default: "#1a0a00", description: "辅底色" }
  accent: { default: "rgba(255,180,0,0.2)", description: "光斑色" }
/ComponentMeta
-->
<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes noiseShift {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-50px, 30px); }
  50% { transform: translate(30px, -40px); }
  75% { transform: translate(-30px, -20px); }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- 渐变底色 -->
<div style="position:absolute;inset:0;background:linear-gradient(160deg,var(--bg-dark,#080818),var(--bg-mid,#1a0a00))"></div>
<!-- SVG 噪点纹理 -->
<svg style="position:absolute;inset:0;width:100%;height:100%;opacity:0.08;pointer-events:none">
  <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>
<!-- 移动光斑 -->
<div style="position:absolute;top:20%;left:-15%;width:500px;height:500px;border-radius:50%;background:rgba(255,180,0,0.18);filter:blur(120px);animation:noiseShift 18s ease-in-out infinite"></div>
<div style="position:absolute;bottom:15%;right:-10%;width:400px;height:400px;border-radius:50%;background:rgba(200,100,0,0.12);filter:blur(100px);animation:noiseShift 22s ease-in-out infinite 4s"></div>
