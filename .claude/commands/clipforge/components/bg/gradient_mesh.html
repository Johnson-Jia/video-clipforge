<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes waveSway {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.20; }
}
@keyframes floatParticle {
  0%, 100% { transform: translateY(0) translateX(0); opacity: 0.4; }
  50% { transform: translateY(-50px) translateX(8px); opacity: 0.7; }
}
@keyframes prismShimmer {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.18; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: gradient_mesh -->
<!-- 渐变底色 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(160deg, var(--bg-dark, #080818) 0%, var(--bg-mid, #001a33) 100%)"></div>
<!-- 色带 1 -->
<div style="position:absolute;top:20%;left:0;width:100%;height:300px;
  background:linear-gradient(90deg,transparent,hsla(220,60%,40%,0.15),transparent);
  transform:rotate(-8deg);animation:waveSway 20s ease-in-out infinite 0s"></div>
<!-- 色带 2 -->
<div style="position:absolute;top:55%;left:0;width:100%;height:250px;
  background:linear-gradient(90deg,transparent,hsla(250,50%,45%,0.18),transparent);
  transform:rotate(5deg);animation:waveSway 25s ease-in-out infinite 5s"></div>
<!-- 色带 3（额外层次） -->
<div style="position:absolute;top:38%;left:-5%;width:110%;height:180px;
  background:linear-gradient(90deg,transparent 15%,hsla(190,55%,45%,0.16),hsla(200,45%,40%,0.10),transparent 85%);
  filter:blur(30px);animation:waveSway 28s ease-in-out infinite 10s"></div>
<!-- 漂浮粒子 1 -->
<div style="position:absolute;top:25%;left:65%;width:4px;height:4px;border-radius:50%;
  background:hsla(230,60%,60%,0.5);box-shadow:0 0 8px hsla(230,50%,50%,0.4);animation:floatParticle 7s ease-in-out infinite 0s"></div>
<!-- 漂浮粒子 2 -->
<div style="position:absolute;top:50%;left:30%;width:3px;height:3px;border-radius:50%;
  background:hsla(260,50%,55%,0.45);box-shadow:0 0 6px hsla(260,40%,45%,0.35);animation:floatParticle 9s ease-in-out infinite 3s"></div>
<!-- 漂浮粒子 3 -->
<div style="position:absolute;top:70%;left:55%;width:3px;height:3px;border-radius:50%;
  background:hsla(210,55%,58%,0.4);box-shadow:0 0 6px hsla(210,45%,48%,0.3);animation:floatParticle 8s ease-in-out infinite 5s"></div>
<!-- 玻璃折射层：半透明毛玻璃叠加 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.02) 0%,transparent 40%,rgba(255,255,255,0.03) 60%,transparent 100%);
  animation:glassShimmer 8s ease-in-out infinite"></div>
<!-- 波纹干涉（签名：色带交叠的同心圆干涉纹，区别于 light_field 光球/vignette 暗角） -->
<div style="position:absolute;top:45%;left:50%;width:700px;height:700px;border-radius:50%;opacity:0.06;
  background:repeating-radial-gradient(circle,transparent 0px,transparent 16px,hsla(220,60%,55%,0.10) 16px,hsla(220,60%,55%,0.10) 17px);
  filter:blur(1.5px);transform:translate(-50%,-50%);animation:waveSway 22s ease-in-out infinite"></div>
<!-- 棱镜色散：细微的彩虹光带 -->
<div style="position:absolute;top:30%;left:-10%;width:120%;height:200px;opacity:0.15;
  background:linear-gradient(90deg,transparent,rgba(255,100,100,0.5),rgba(100,255,100,0.5),rgba(100,100,255,0.5),transparent);
  filter:blur(60px);transform:rotate(-3deg);animation:prismShimmer 10s ease-in-out infinite"></div>
