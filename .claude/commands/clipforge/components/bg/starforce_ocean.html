<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes starWave1 {
  0%, 100% { transform: translateX(-50%) translateY(0) scaleY(1); opacity: 0.45; }
  50% { transform: translateX(-50%) translateY(-12px) scaleY(1.12); opacity: 0.62; }
}
@keyframes starWave2 {
  0%, 100% { transform: translateX(-50%) translateY(0) scaleY(1.1); opacity: 0.38; }
  50% { transform: translateX(-50%) translateY(-18px) scaleY(0.95); opacity: 0.55; }
}
@keyframes starVortexSpin {
  0% { transform: translateX(-50%) rotate(0deg); }
  100% { transform: translateX(-50%) rotate(360deg); }
}
@keyframes starFlowDrift {
  0% { transform: translateX(-40%) translateY(0); opacity: 0; }
  20% { opacity: 0.6; }
  80% { opacity: 0.55; }
  100% { transform: translateX(60%) translateY(40px); opacity: 0; }
}
@keyframes starPourDown {
  0%, 100% { opacity: 0.32; transform: translateX(-50%) scaleY(1); }
  50% { opacity: 0.50; transform: translateX(-50%) scaleY(1.08); }
}
@keyframes starCoreFlare {
  0%, 100% { opacity: 0.42; transform: translateX(-50%) scale(1); }
  50% { opacity: 0.62; transform: translateX(-50%) scale(1.12); }
}
@keyframes starSpeckFloat {
  0% { transform: translateY(0); opacity: 0; }
  20% { opacity: 0.7; }
  100% { transform: translateY(-90px); opacity: 0; }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.26; }
  50% { opacity: 0.36; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: starforce_ocean -->
<!-- 深金黑底 -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,hsl(38,32%,5%) 0%,hsl(34,46%,9%) 45%,hsl(42,52%,8%) 100%)"></div>
<!-- 顶部星力倾泻光柱（从上方向下灌注） -->
<div style="position:absolute;top:-5%;left:50%;transform:translateX(-50%);width:340px;height:75%;
  background:linear-gradient(180deg,hsla(48,95%,68%,0.28) 0%,hsla(44,88%,58%,0.16) 40%,transparent 100%);
  filter:blur(40px);animation:starPourDown 7s ease-in-out infinite"></div>
<!-- 倾泻光柱核心亮线 -->
<div style="position:absolute;top:-3%;left:50%;transform:translateX(-50%);width:40px;height:60%;
  background:linear-gradient(180deg,hsla(50,100%,78%,0.40),hsla(46,92%,66%,0.18),transparent);
  filter:blur(14px)"></div>
<!-- 金色能量海洋底层（大面积底部辉光） -->
<div style="position:absolute;bottom:-8%;left:50%;width:140%;height:380px;border-radius:50%;
  background:radial-gradient(ellipse,hsla(45,92%,58%,0.42),hsla(38,80%,45%,0.20),transparent 65%);
  filter:blur(60px);animation:starWave1 10s ease-in-out infinite"></div>
<!-- 能量海洋波涛层 2（错相位） -->
<div style="position:absolute;bottom:-5%;left:50%;width:120%;height:280px;border-radius:50%;
  background:radial-gradient(ellipse,hsla(50,90%,62%,0.32),hsla(42,78%,48%,0.16),transparent 60%);
  filter:blur(48px);animation:starWave2 13s ease-in-out infinite 2s"></div>
<!-- 能量海洋波纹高光线 1 -->
<div style="position:absolute;bottom:14%;left:50%;transform:translateX(-50%);width:90%;height:3px;
  background:linear-gradient(90deg,transparent 10%,hsla(50,95%,70%,0.40) 40%,hsla(46,90%,64%,0.48) 50%,hsla(50,95%,70%,0.40) 60%,transparent 90%);
  filter:blur(2.5px);animation:starWave1 9s ease-in-out infinite 1s"></div>
<!-- 能量海洋波纹高光线 2 -->
<div style="position:absolute;bottom:8%;left:50%;transform:translateX(-50%);width:75%;height:2px;
  background:linear-gradient(90deg,transparent 15%,hsla(48,92%,66%,0.35) 45%,hsla(48,92%,66%,0.35) 55%,transparent 85%);
  filter:blur(2px);animation:starWave2 11s ease-in-out infinite 3s"></div>
<!-- 中央能量漩涡（金色 conic 旋转） -->
<div style="position:absolute;bottom:18%;left:50%;width:520px;height:520px;border-radius:50%;
  background:conic-gradient(from 0deg,
    transparent 0deg,hsla(48,95%,64%,0.30) 30deg,transparent 60deg,
    transparent 120deg,hsla(40,90%,56%,0.24) 150deg,transparent 180deg,
    transparent 240deg,hsla(50,92%,62%,0.26) 270deg,transparent 300deg);
  filter:blur(20px);animation:starVortexSpin 18s linear infinite"></div>
<!-- 漩涡核心耀斑 -->
<div style="position:absolute;bottom:30%;left:50%;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,hsla(52,100%,75%,0.55),hsla(46,92%,60%,0.22),transparent 60%);
  filter:blur(30px);animation:starCoreFlare 5s ease-in-out infinite"></div>
<!-- 对角能量流光 1（金，向右下） -->
<div style="position:absolute;top:25%;left:-10%;width:120%;height:2.5px;
  background:linear-gradient(90deg,transparent,hsla(50,95%,68%,0.45),hsla(44,88%,58%,0.30),transparent);
  filter:blur(2px);transform:rotate(18deg);animation:starFlowDrift 8s linear infinite 0s"></div>
<!-- 对角能量流光 2（淡金，错相位） -->
<div style="position:absolute;top:42%;left:-10%;width:120%;height:2px;
  background:linear-gradient(90deg,transparent,hsla(46,90%,62%,0.38),transparent);
  filter:blur(2px);transform:rotate(18deg);animation:starFlowDrift 10s linear infinite 3s"></div>
<!-- 漂浮金星点 1 -->
<div style="position:absolute;bottom:25%;left:30%;width:4px;height:4px;border-radius:50%;
  background:hsla(50,95%,68%,0.8);box-shadow:0 0 12px hsla(46,88%,58%,0.65);animation:starSpeckFloat 7s linear infinite 0s"></div>
<!-- 漂浮金星点 2 -->
<div style="position:absolute;bottom:30%;right:32%;width:3px;height:3px;border-radius:50%;
  background:hsla(48,92%,64%,0.75);box-shadow:0 0 10px hsla(44,85%,55%,0.6);animation:starSpeckFloat 8s linear infinite 2s"></div>
<!-- 漂浮金星点 3 -->
<div style="position:absolute;bottom:22%;left:55%;width:3px;height:3px;border-radius:50%;
  background:hsla(52,94%,66%,0.72);box-shadow:0 0 10px hsla(48,87%,57%,0.58);animation:starSpeckFloat 9s linear infinite 4s"></div>
<!-- 漂浮金星点 4 -->
<div style="position:absolute;bottom:35%;left:40%;width:2px;height:2px;border-radius:50%;
  background:hsla(50,90%,62%,0.68);box-shadow:0 0 8px hsla(46,82%,53%,0.52);animation:starSpeckFloat 7.5s linear infinite 1s"></div>
<!-- 金色玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,210,100,0.05) 0%,transparent 38%,rgba(255,180,70,0.06) 62%,transparent 100%);
  animation:glassShimmer 9s ease-in-out infinite"></div>
<!-- 金色暗角（聚焦中央漩涡） -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 55%,transparent 35%,hsla(35,40%,3%,0.45) 100%)"></div>
