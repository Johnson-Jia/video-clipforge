<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes emberRise {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.35; }
  50% { transform: translateY(-40px) scale(1.08); opacity: 0.48; }
}
@keyframes emberFloat {
  0%, 100% { transform: translateY(0) translateX(0); opacity: 0.6; }
  50% { transform: translateY(-60px) translateX(10px); opacity: 0.9; }
}
@keyframes warmShift {
  0%, 100% { opacity: 0.30; }
  50% { opacity: 0.40; }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.30; }
  50% { opacity: 0.40; }
}
@keyframes cracklePulse {
  0%, 100% { opacity: 0.28; }
  30% { opacity: 0.50; }
  60% { opacity: 0.22; }
}
@keyframes hotSpotBreath {
  0%, 100% { opacity: 0.32; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(1.06); }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: ember_glow -->
<!-- 深红黑底 -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,hsl(8,18%,8%),hsl(2,12%,11%))"></div>
<!-- 余烬辉光 1：深橙红（大） -->
<div style="position:absolute;top:55%;left:15%;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,hsla(18,88%,58%,0.38),hsla(12,70%,42%,0.12),transparent 70%);
  filter:blur(100px);animation:emberRise 22s ease-in-out infinite 0s"></div>
<!-- 余烬辉光 2：炭红（中） -->
<div style="position:absolute;top:65%;left:50%;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,hsla(6,80%,48%,0.30),hsla(2,60%,35%,0.10),transparent 70%);
  filter:blur(85px);animation:emberRise 26s ease-in-out infinite 5s"></div>
<!-- 余烬辉光 3：亮橙（小） -->
<div style="position:absolute;top:40%;left:35%;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,hsla(28,85%,60%,0.28),hsla(22,65%,42%,0.10),transparent 70%);
  filter:blur(75px);animation:emberRise 20s ease-in-out infinite 10s"></div>
<!-- 对角线暖光带 -->
<div style="position:absolute;top:20%;left:-20%;width:140%;height:250px;
  background:linear-gradient(100deg,transparent 20%,hsla(18,78%,52%,0.14),hsla(8,68%,45%,0.10),transparent 80%);
  filter:blur(60px);transform:rotate(-8deg);animation:warmShift 12s ease-in-out infinite"></div>
<!-- 炭火裂纹线 1 -->
<div style="position:absolute;top:30%;left:-5%;width:80%;height:2.5px;
  background:linear-gradient(90deg,transparent 5%,hsla(15,85%,55%,0.28) 25%,hsla(10,78%,48%,0.18) 50%,hsla(18,82%,52%,0.25) 75%,transparent 95%);
  filter:blur(1.5px);transform:rotate(-12deg);animation:cracklePulse 5s ease-in-out infinite 0s"></div>
<!-- 炭火裂纹线 2 -->
<div style="position:absolute;top:58%;left:10%;width:70%;height:1.5px;
  background:linear-gradient(90deg,transparent 10%,hsla(8,80%,48%,0.20) 35%,hsla(12,75%,45%,0.15) 65%,transparent 90%);
  filter:blur(1px);transform:rotate(-8deg);animation:cracklePulse 6s ease-in-out infinite 2s"></div>
<!-- 底部聚焦热点 -->
<div style="position:absolute;top:70%;left:40%;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,hsla(22,90%,62%,0.32),hsla(15,75%,48%,0.10),transparent 60%);
  filter:blur(60px);animation:hotSpotBreath 6s ease-in-out infinite"></div>
<!-- 漂浮火星粒子 1 -->
<div style="position:absolute;top:50%;left:20%;width:4px;height:4px;border-radius:50%;background:hsla(15,92%,65%,0.75);box-shadow:0 0 10px hsla(15,85%,55%,0.65);animation:emberFloat 6s ease-in-out infinite 0s"></div>
<!-- 漂浮火星粒子 2 -->
<div style="position:absolute;top:65%;left:55%;width:3px;height:3px;border-radius:50%;background:hsla(8,88%,60%,0.65);box-shadow:0 0 8px hsla(8,78%,50%,0.55);animation:emberFloat 7s ease-in-out infinite 2s"></div>
<!-- 漂浮火星粒子 3 -->
<div style="position:absolute;top:45%;left:70%;width:3px;height:3px;border-radius:50%;background:hsla(25,85%,62%,0.70);box-shadow:0 0 9px hsla(25,75%,52%,0.6);animation:emberFloat 5s ease-in-out infinite 4s"></div>
<!-- 漂浮火星粒子 4 -->
<div style="position:absolute;top:72%;left:35%;width:4px;height:4px;border-radius:50%;background:hsla(5,88%,58%,0.65);box-shadow:0 0 8px hsla(5,78%,48%,0.55);animation:emberFloat 8s ease-in-out infinite 1s"></div>
<!-- 漂浮火星粒子 5 -->
<div style="position:absolute;top:38%;left:45%;width:2px;height:2px;border-radius:50%;background:hsla(30,92%,68%,0.65);box-shadow:0 0 7px hsla(30,85%,58%,0.55);animation:emberFloat 6.5s ease-in-out infinite 3s"></div>
<!-- 水平余烬纹 1 -->
<div style="position:absolute;top:58%;left:-5%;width:110%;height:3px;
  background:linear-gradient(90deg,transparent 10%,hsla(15,82%,55%,0.32) 40%,hsla(20,72%,50%,0.25) 60%,transparent 90%);
  filter:blur(2px)"></div>
<!-- 水平余烬纹 2 -->
<div style="position:absolute;top:75%;left:-5%;width:110%;height:2px;
  background:linear-gradient(90deg,transparent 30%,hsla(8,78%,50%,0.25) 55%,transparent 80%);
  filter:blur(1.5px)"></div>
<!-- 远山剪影 1（最远层，空气透视淡，暖灰调） -->
<div style="position:absolute;bottom:0;left:-5%;width:110%;height:220px;
  background:hsla(8,15%,10%,0.50);
  clip-path:polygon(0 100%,0 55%,5% 42%,12% 50%,20% 35%,28% 48%,35% 32%,42% 45%,50% 30%,58% 43%,65% 35%,72% 47%,78% 33%,85% 43%,92% 38%,100% 48%,100% 100%)"></div>
<!-- 地平线余晖线（远山与近山之间的暖色亮线） -->
<div style="position:absolute;bottom:140px;left:-5%;width:110%;height:2px;
  background:linear-gradient(90deg,transparent 10%,hsla(15,85%,55%,0.40) 30%,hsla(20,80%,50%,0.45) 50%,hsla(15,85%,55%,0.40) 70%,transparent 90%);
  filter:blur(2px)"></div>
<!-- 远山剪影 2（近层，更实更深） -->
<div style="position:absolute;bottom:0;left:-5%;width:110%;height:160px;
  background:hsla(4,12%,6%,0.65);
  clip-path:polygon(0 100%,0 65%,8% 52%,15% 62%,22% 45%,30% 58%,38% 42%,45% 55%,52% 40%,60% 53%,68% 45%,75% 58%,82% 44%,88% 54%,95% 48%,100% 58%,100% 100%)"></div>
<!-- 暖色玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,160,80,0.04) 0%,transparent 40%,rgba(255,120,60,0.05) 60%,transparent 100%);
  animation:glassShimmer 9s ease-in-out infinite"></div>
<!-- 暖色暗角 -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 55%,transparent 35%,hsla(5,20%,3%,0.40) 100%)"></div>
