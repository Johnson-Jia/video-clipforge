<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes gridDotBreath {
  0%, 100% { opacity: 0.06; }
  50% { opacity: 0.10; }
}
@keyframes spotlightShift {
  0%, 100% { opacity: 0.18; transform: translateX(0); }
  50% { opacity: 0.28; transform: translateX(15px); }
}
@keyframes waveDrift {
  0% { transform: translateX(0); }
  100% { transform: translateX(-120px); }
}
@keyframes accentPulse {
  0%, 100% { opacity: 0.14; }
  50% { opacity: 0.25; }
}
@keyframes shapeFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.08; }
  50% { transform: translateY(-20px) rotate(45deg); opacity: 0.18; }
}
@keyframes shapeFloat2 {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.06; }
  50% { transform: translateY(-15px) rotate(-30deg); opacity: 0.14; }
}
@keyframes slateVignette {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.22; }
}
@keyframes cornerLineGlow {
  0%, 100% { opacity: 0.12; }
  50% { opacity: 0.20; }
}
@keyframes bluePulse {
  0%, 100% { opacity: 0.20; }
  50% { opacity: 0.35; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: clean_slate -->
<!-- 钢蓝渐变底（清晰的蓝色身份，非脏灰） -->
<div style="position:absolute;inset:0;
  background:linear-gradient(170deg, hsla(215,45%,14%,1) 0%, hsla(220,40%,11%,1) 50%, hsla(218,38%,9%,1) 100%)"></div>
<!-- 蓝色辉光核心（主焦点，给画面注入清晰蓝色） -->
<div style="position:absolute;top:25%;left:30%;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle, hsla(215,55%,28%,0.35), hsla(220,45%,18%,0.12), transparent 65%);
  filter:blur(90px);animation:spotlightShift 20s ease-in-out infinite"></div>
<!-- 冷蓝聚光灯（顶部） -->
<div style="position:absolute;top:-15%;left:15%;width:70%;height:55%;
  background:radial-gradient(ellipse 90% 100% at 45% 0%, hsla(215,50%,30%,0.22), hsla(220,40%,20%,0.10) 50%, transparent 75%);
  animation:spotlightShift 22s ease-in-out infinite 3s"></div>
<!-- 点阵网格（交叉点小圆点，蓝色调） -->
<div style="position:absolute;inset:0;
  background-image:
    radial-gradient(circle, hsla(215,40%,50%,0.08) 1px, transparent 1px);
  background-size:60px 60px;animation:gridDotBreath 25s ease-in-out infinite"></div>
<!-- 左上角几何装饰线 L 型（亮钢蓝） -->
<div style="position:absolute;top:40px;left:40px;width:120px;height:2px;
  background:linear-gradient(90deg, hsla(215,50%,52%,0.22), transparent);
  animation:accentPulse 15s ease-in-out infinite"></div>
<div style="position:absolute;top:40px;left:40px;width:2px;height:80px;
  background:linear-gradient(180deg, hsla(215,50%,52%,0.22), transparent);
  animation:accentPulse 15s ease-in-out infinite"></div>
<!-- 右下角几何装饰线 L 型 -->
<div style="position:absolute;bottom:40px;right:40px;width:100px;height:2px;
  background:linear-gradient(270deg, hsla(215,48%,48%,0.18), transparent);
  animation:accentPulse 18s ease-in-out infinite 5s"></div>
<div style="position:absolute;bottom:40px;right:40px;width:2px;height:70px;
  background:linear-gradient(0deg, hsla(215,48%,48%,0.18), transparent);
  animation:accentPulse 18s ease-in-out infinite 5s"></div>
<!-- 底部波纹线（钢蓝色） -->
<div style="position:absolute;bottom:60px;left:0;width:calc(100% + 120px);height:40px;
  background:
    repeating-linear-gradient(90deg,
      transparent 0px, transparent 30px,
      hsla(215,42%,45%,0.10) 30px, hsla(215,42%,45%,0.10) 31px);
  transform:perspective(500px) rotateX(45deg);
  animation:waveDrift 30s linear infinite"></div>
<!-- 漂浮几何形状 1：菱形（蓝色边框） -->
<div style="position:absolute;top:25%;right:18%;width:60px;height:60px;opacity:0.08;
  border:1px solid hsla(215,48%,50%,0.5);
  transform:rotate(45deg);
  animation:shapeFloat 18s ease-in-out infinite 0s"></div>
<!-- 漂浮几何形状 2：圆形 -->
<div style="position:absolute;top:55%;left:22%;width:40px;height:40px;opacity:0.06;
  border:1px solid hsla(215,45%,48%,0.5);border-radius:50%;
  animation:shapeFloat2 22s ease-in-out infinite 4s"></div>
<!-- 漂浮几何形状 3：小正方形 -->
<div style="position:absolute;top:70%;right:30%;width:25px;height:25px;opacity:0.06;
  border:1px solid hsla(220,42%,45%,0.4);
  animation:shapeFloat 16s ease-in-out infinite 8s"></div>
<!-- 蓝色光点粒子（增加画面亮度和清晰度） -->
<div style="position:absolute;top:32%;left:48%;width:3px;height:3px;border-radius:50%;
  background:hsla(215,55%,58%,0.55);box-shadow:0 0 6px hsla(215,50%,52%,0.40),0 0 12px hsla(215,45%,45%,0.20);
  animation:bluePulse 8s ease-in-out infinite 0s"></div>
<div style="position:absolute;top:60%;left:25%;width:2px;height:2px;border-radius:50%;
  background:hsla(215,50%,55%,0.45);box-shadow:0 0 4px hsla(215,45%,48%,0.30);
  animation:bluePulse 10s ease-in-out infinite 3s"></div>
<div style="position:absolute;top:45%;left:72%;width:2px;height:2px;border-radius:50%;
  background:hsla(215,52%,52%,0.40);box-shadow:0 0 4px hsla(215,48%,45%,0.28);
  animation:bluePulse 12s ease-in-out infinite 6s"></div>
<!-- 角落连接线（对角淡蓝线） -->
<div style="position:absolute;inset:0;
  background:linear-gradient(45deg,
    transparent 42%, hsla(215,45%,38%,0.06) 46%, hsla(215,45%,38%,0.06) 46.5%,
    transparent 47%);
  animation:cornerLineGlow 20s ease-in-out infinite"></div>
<!-- 暗角（边缘压暗，让蓝色核心更突出） -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse 75% 70% at 50% 48%, transparent 0%, hsla(215,30%,5%,0.30) 70%, hsla(220,35%,3%,0.50) 100%);
  animation:slateVignette 25s ease-in-out infinite"></div>
