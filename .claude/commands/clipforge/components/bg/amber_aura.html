<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes auraDrift {
  0%, 100% { transform: translate(0,0) scale(1); opacity: 0.32; }
  50% { transform: translate(20px,-30px) scale(1.10); opacity: 0.45; }
}
@keyframes mistFlow {
  0%, 100% { transform: translateX(0); opacity: 0.22; }
  50% { transform: translateX(40px); opacity: 0.32; }
}
@keyframes dustTwinkle {
  0%, 100% { opacity: 0.40; }
  50% { opacity: 0.85; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: amber_aura -->
<!-- 暖黑金底 -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,hsl(40,20%,7%),hsl(30,15%,9%))"></div>
<!-- 琥珀光环 1（大，金黄） -->
<div style="position:absolute;top:50%;left:20%;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,hsla(42,90%,60%,0.36),hsla(35,75%,42%,0.12),transparent 70%);
  filter:blur(95px);animation:auraDrift 18s ease-in-out infinite 0s"></div>
<!-- 琥珀光环 2（中，琥珀） -->
<div style="position:absolute;top:60%;left:55%;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,hsla(35,85%,58%,0.30),hsla(28,70%,40%,0.10),transparent 70%);
  filter:blur(80px);animation:auraDrift 22s ease-in-out infinite 6s"></div>
<!-- 琥珀光环 3（小，亮金） -->
<div style="position:absolute;top:35%;left:40%;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,hsla(45,92%,65%,0.28),hsla(38,72%,45%,0.10),transparent 70%);
  filter:blur(70px);animation:auraDrift 16s ease-in-out infinite 11s"></div>
<!-- 漂移暖雾带 -->
<div style="position:absolute;top:30%;left:-15%;width:130%;height:200px;
  background:linear-gradient(90deg,transparent 15%,hsla(38,75%,55%,0.12),hsla(30,65%,45%,0.08),transparent 85%);
  filter:blur(55px);animation:mistFlow 14s ease-in-out infinite"></div>
<!-- 金色尘埃 1-4 -->
<div style="position:absolute;top:45%;left:25%;width:3px;height:3px;border-radius:50%;background:hsla(42,95%,68%,0.70);box-shadow:0 0 8px hsla(42,85%,58%,0.60);animation:dustTwinkle 4s ease-in-out infinite 0s"></div>
<div style="position:absolute;top:60%;left:60%;width:2px;height:2px;border-radius:50%;background:hsla(40,90%,65%,0.65);box-shadow:0 0 7px hsla(40,80%,55%,0.55);animation:dustTwinkle 5s ease-in-out infinite 1.5s"></div>
<div style="position:absolute;top:50%;left:75%;width:3px;height:3px;border-radius:50%;background:hsla(45,92%,70%,0.70);box-shadow:0 0 9px hsla(45,82%,60%,0.60);animation:dustTwinkle 4.5s ease-in-out infinite 3s"></div>
<div style="position:absolute;top:68%;left:38%;width:2px;height:2px;border-radius:50%;background:hsla(38,88%,62%,0.60);box-shadow:0 0 6px hsla(38,78%,52%,0.50);animation:dustTwinkle 6s ease-in-out infinite 0.5s"></div>
<!-- 暖色暗角 -->
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 38%,hsla(30,25%,4%,0.38) 100%)"></div>
