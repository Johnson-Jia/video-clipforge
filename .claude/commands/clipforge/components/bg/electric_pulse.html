<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes arcRotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes arcRotateReverse {
  0% { transform: rotate(360deg); }
  100% { transform: rotate(0deg); }
}
@keyframes pulseExpand {
  0% { transform: scale(0.85); opacity: 0.65; }
  100% { transform: scale(1.6); opacity: 0; }
}
@keyframes coreBreathe {
  0%, 100% { opacity: 0.44; transform: scale(1); }
  50% { opacity: 0.60; transform: scale(1.08); }
}
@keyframes scatterPulse {
  0%, 100% { opacity: 0.35; transform: scale(1); }
  50% { opacity: 0.75; transform: scale(1.2); }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.30; }
  50% { opacity: 0.40; }
}
@keyframes lightningFlicker {
  0%, 100% { opacity: 0.25; }
  15% { opacity: 0.50; }
  30% { opacity: 0.15; }
  45% { opacity: 0.45; }
  60%, 100% { opacity: 0.20; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: electric_pulse -->
<!-- 深蓝黑底 -->
<div style="position:absolute;inset:0;background:linear-gradient(160deg,hsl(220,30%,9%),hsl(200,25%,12%))"></div>
<!-- 辐射底纹（极淡放射线） -->
<div style="position:absolute;top:0;left:0;width:200%;height:200%;transform-origin:25% 17.5%;
  background:repeating-conic-gradient(from 0deg,transparent 0deg,transparent 14deg,hsla(190,40%,50%,0.015) 15deg,transparent 16deg);
  opacity:0.6"></div>
<!-- 主旋转锥形光弧（cyan） -->
<div style="position:absolute;top:0;left:0;width:200%;height:200%;transform-origin:25% 17.5%;animation:arcRotate 45s linear infinite;
  background:conic-gradient(from 0deg,
    transparent 0deg,hsla(180,72%,52%,0.15) 25deg,transparent 50deg,
    transparent 90deg,hsla(185,67%,50%,0.11) 115deg,transparent 140deg,
    transparent 180deg,hsla(175,72%,52%,0.13) 205deg,transparent 230deg,
    transparent 270deg,hsla(190,62%,47%,0.09) 295deg,transparent 320deg)"></div>
<!-- 反向旋转第二光弧（蓝白色调，更慢） -->
<div style="position:absolute;top:0;left:0;width:200%;height:200%;transform-origin:25% 17.5%;animation:arcRotateReverse 70s linear infinite;
  background:conic-gradient(from 45deg,
    transparent 0deg,hsla(200,60%,60%,0.08) 30deg,transparent 60deg,
    transparent 120deg,hsla(210,55%,55%,0.06) 150deg,transparent 180deg,
    transparent 240deg,hsla(195,58%,58%,0.07) 270deg,transparent 300deg)"></div>
<!-- 能量核心辉光 -->
<div style="position:absolute;top:25%;left:25%;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,hsla(185,92%,62%,0.44),hsla(190,72%,47%,0.16),transparent 50%);
  filter:blur(60px);animation:coreBreathe 5s ease-in-out infinite"></div>
<!-- 核心过曝闪光 -->
<div style="position:absolute;top:32%;left:32%;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,hsla(190,50%,92%,0.20),hsla(195,60%,75%,0.08),transparent 60%);
  filter:blur(30px)"></div>
<!-- 脉冲环 1 -->
<div style="position:absolute;top:calc(35% - 80px);left:calc(35% - 80px);width:160px;height:160px;border-radius:50%;
  border:2px solid hsla(190,82%,57%,0.34);animation:pulseExpand 4s ease-out infinite 0s"></div>
<!-- 脉冲环 2 -->
<div style="position:absolute;top:calc(35% - 80px);left:calc(35% - 80px);width:160px;height:160px;border-radius:50%;
  border:1.5px solid hsla(190,72%,52%,0.27);animation:pulseExpand 4s ease-out infinite 1.5s"></div>
<!-- 脉冲环 3 -->
<div style="position:absolute;top:calc(35% - 80px);left:calc(35% - 80px);width:160px;height:160px;border-radius:50%;
  border:1px solid hsla(185,67%,50%,0.20);animation:pulseExpand 4s ease-out infinite 3s"></div>
<!-- 散射点 1（右上） -->
<div style="position:absolute;top:28%;left:42%;width:4px;height:4px;border-radius:50%;
  background:hsla(190,85%,65%,0.7);box-shadow:0 0 10px hsla(190,80%,58%,0.5);
  animation:scatterPulse 3s ease-in-out infinite 0s"></div>
<!-- 散射点 2（右下） -->
<div style="position:absolute;top:42%;left:48%;width:3px;height:3px;border-radius:50%;
  background:hsla(195,80%,62%,0.6);box-shadow:0 0 8px hsla(195,75%,55%,0.45);
  animation:scatterPulse 3.5s ease-in-out infinite 1s"></div>
<!-- 散射点 3（左下） -->
<div style="position:absolute;top:40%;left:22%;width:3px;height:3px;border-radius:50%;
  background:hsla(185,82%,60%,0.6);box-shadow:0 0 8px hsla(185,78%,52%,0.4);
  animation:scatterPulse 4s ease-in-out infinite 0.5s"></div>
<!-- 散射点 4（左上） -->
<div style="position:absolute;top:26%;left:28%;width:3px;height:3px;border-radius:50%;
  background:hsla(200,78%,58%,0.55);box-shadow:0 0 7px hsla(200,72%,50%,0.4);
  animation:scatterPulse 3.2s ease-in-out infinite 2s"></div>
<!-- 闪电分支线 1（从核心向右下延伸） -->
<div style="position:absolute;top:22%;left:33%;width:1.5px;height:110px;
  background:linear-gradient(180deg,hsla(190,80%,70%,0.22),hsla(195,70%,60%,0.12),transparent);
  transform:rotate(-8deg);filter:blur(0.5px);animation:lightningFlicker 4s ease-in-out infinite 0s"></div>
<!-- 闪电分支线 2（从核心向左下延伸） -->
<div style="position:absolute;top:20%;left:37%;width:1px;height:90px;
  background:linear-gradient(180deg,hsla(185,75%,68%,0.18),hsla(190,65%,58%,0.10),transparent);
  transform:rotate(14deg);filter:blur(0.5px);animation:lightningFlicker 5s ease-in-out infinite 1.5s"></div>
<!-- 闪电分支线 3（更长的外围闪电） -->
<div style="position:absolute;top:15%;left:30%;width:1px;height:140px;
  background:linear-gradient(180deg,hsla(195,72%,66%,0.15),hsla(200,62%,55%,0.08),transparent);
  transform:rotate(-3deg);filter:blur(0.5px);animation:lightningFlicker 6s ease-in-out infinite 3s"></div>
<!-- 风暴云层 1（底部大面积暗色团，远层） -->
<div style="position:absolute;bottom:-5%;left:-10%;width:120%;height:300px;
  background:radial-gradient(ellipse at 35% 75%,hsla(220,28%,12%,0.70),hsla(215,22%,8%,0.40),transparent 65%);
  filter:blur(50px)"></div>
<!-- 风暴云层 2（近层，更深更实） -->
<div style="position:absolute;bottom:-3%;left:-10%;width:120%;height:200px;
  background:radial-gradient(ellipse at 65% 70%,hsla(210,25%,14%,0.60),hsla(205,20%,10%,0.30),transparent 60%);
  filter:blur(40px)"></div>
<!-- 暗角聚焦 -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 45%,transparent 25%,hsla(220,30%,2%,0.35) 80%,hsla(220,35%,2%,0.52) 100%)"></div>
<!-- 玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(150deg,rgba(255,255,255,0.05) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.06) 100%);
  animation:glassShimmer 7s ease-in-out infinite"></div>
