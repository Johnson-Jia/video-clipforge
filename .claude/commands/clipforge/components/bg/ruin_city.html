<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: ruin_city -->
<!-- 血色黄昏天空底（上暗下亮，地平线偏红） -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,hsl(355,38%,6%) 0%,hsl(15,48%,9%) 35%,hsl(26,58%,14%) 68%,hsl(18,52%,10%) 100%)"></div>
<!-- 血色夕阳辉光（地平线右侧，大范围过曝） -->
<div style="position:absolute;bottom:6%;right:14%;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,hsla(28,95%,62%,0.55),hsla(16,85%,46%,0.24),transparent 60%);
  filter:blur(48px);animation:ruinSunGlow 9s ease-in-out infinite"></div>
<!-- 夕阳核心（更亮更实） -->
<div style="position:absolute;bottom:11%;right:21%;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,hsla(36,100%,72%,0.52),hsla(24,90%,56%,0.18),transparent 72%);
  filter:blur(22px)"></div>
<!-- 高空暖色云带（拉长横向） -->
<div style="position:absolute;top:18%;left:-10%;width:120%;height:130px;
  background:linear-gradient(90deg,transparent 8%,hsla(18,55%,38%,0.14) 28%,hsla(14,52%,33%,0.20) 50%,hsla(24,62%,42%,0.12) 72%,transparent 92%);
  filter:blur(42px)"></div>
<!-- 远处烟柱（左） -->
<div style="position:absolute;bottom:24%;left:16%;width:6px;height:95px;
  background:linear-gradient(180deg,transparent,hsla(14,28%,30%,0.38),hsla(14,28%,30%,0.2),transparent);
  filter:blur(3px);transform:rotate(4deg);animation:ruinSmokeRise 7s ease-in-out infinite 0s"></div>
<!-- 远处烟柱（右） -->
<div style="position:absolute;bottom:29%;right:32%;width:5px;height:75px;
  background:linear-gradient(180deg,transparent,hsla(20,32%,32%,0.32),hsla(20,32%,32%,0.16),transparent);
  filter:blur(3px);transform:rotate(-3deg);animation:ruinSmokeRise 8s ease-in-out infinite 2.5s"></div>
<!-- 底部尘埃雾霾（水平暖橙雾带） -->
<div style="position:absolute;bottom:0;left:-10%;width:120%;height:230px;
  background:linear-gradient(90deg,transparent 5%,hsla(26,55%,38%,0.22) 25%,hsla(18,50%,32%,0.30) 50%,hsla(28,58%,40%,0.20) 75%,transparent 95%);
  filter:blur(46px);animation:ruinHazeDrift 14s ease-in-out infinite"></div>
<!-- 地平线余晖线（楼群缝隙的暖光） -->
<div style="position:absolute;bottom:168px;left:-5%;width:110%;height:2.5px;
  background:linear-gradient(90deg,transparent 12%,hsla(30,90%,56%,0.38) 38%,hsla(22,85%,50%,0.44) 58%,transparent 86%);
  filter:blur(2px)"></div>
<!-- 远景楼群剪影（淡，空气透视，参差断壁） -->
<div style="position:absolute;bottom:0;left:-5%;width:110%;height:270px;
  background:hsla(12,18%,9%,0.55);
  clip-path:polygon(0 100%,0 58%,4% 58%,4% 40%,8% 40%,8% 54%,12% 54%,12% 28%,16% 28%,16% 24%,18% 24%,18% 38%,22% 38%,22% 50%,27% 50%,27% 18%,30% 18%,30% 34%,34% 34%,34% 48%,39% 48%,39% 26%,43% 26%,43% 40%,48% 40%,48% 52%,53% 52%,53% 20%,57% 20%,57% 44%,62% 44%,62% 32%,66% 32%,66% 50%,71% 50%,71% 24%,75% 24%,75% 42%,80% 42%,80% 54%,85% 54%,85% 28%,90% 28%,90% 48%,95% 48%,95% 40%,100% 40%,100% 100%)"></div>
<!-- 近景楼群剪影（实，深，更破碎倒塌） -->
<div style="position:absolute;bottom:0;left:-5%;width:110%;height:175px;
  background:hsla(6,12%,3%,0.86);
  clip-path:polygon(0 100%,0 76%,3% 76%,3% 48%,7% 48%,7% 46%,9% 46%,9% 64%,13% 64%,13% 32%,17% 32%,17% 28%,19% 28%,19% 54%,24% 54%,24% 70%,29% 70%,29% 38%,33% 38%,33% 58%,38% 58%,38% 22%,42% 22%,42% 48%,47% 48%,47% 62%,52% 62%,52% 30%,57% 30%,57% 50%,62% 50%,62% 68%,67% 68%,67% 36%,72% 36%,72% 54%,77% 54%,77% 72%,83% 72%,83% 40%,88% 40%,88% 60%,93% 60%,93% 50%,100% 50%,100% 100%)"></div>
<!-- 飘散灰烬粒子 1 -->
<div style="position:absolute;bottom:28%;left:24%;width:3px;height:3px;border-radius:50%;
  background:hsla(25,70%,55%,0.62);box-shadow:0 0 8px hsla(25,60%,45%,0.5);animation:ruinDustFloat 9s linear infinite 0s"></div>
<!-- 飘散灰烬粒子 2 -->
<div style="position:absolute;bottom:40%;left:62%;width:2px;height:2px;border-radius:50%;
  background:hsla(18,72%,52%,0.58);box-shadow:0 0 6px hsla(18,62%,42%,0.45);animation:ruinDustFloat 11s linear infinite 2s"></div>
<!-- 飘散灰烬粒子 3 -->
<div style="position:absolute;bottom:22%;left:48%;width:3px;height:3px;border-radius:50%;
  background:hsla(30,68%,58%,0.6);box-shadow:0 0 8px hsla(30,58%,48%,0.5);animation:ruinDustFloat 10s linear infinite 4s"></div>
<!-- 飘散灰烬粒子 4 -->
<div style="position:absolute;bottom:45%;left:32%;width:2px;height:2px;border-radius:50%;
  background:hsla(12,75%,50%,0.55);box-shadow:0 0 6px hsla(12,65%,40%,0.42);animation:ruinDustFloat 12s linear infinite 6s"></div>
<!-- 暖色玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,150,80,0.04) 0%,transparent 38%,rgba(255,110,50,0.05) 62%,transparent 100%);
  animation:glassShimmer 10s ease-in-out infinite"></div>
<!-- 暖色暗角（聚焦中央） -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 50%,transparent 38%,hsla(8,30%,3%,0.42) 100%)"></div>
