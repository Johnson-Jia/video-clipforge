<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes vignettePulse {
  0%, 100% { opacity: 0.10; }
  50% { opacity: 0.16; }
}
@keyframes warmBreath {
  0%, 100% { transform: scale(1); opacity: 0.08; }
  50% { transform: scale(1.06); opacity: 0.14; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- 深色底 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(170deg, #0c0c14 0%, #141420 50%, #0a0a12 100%)"></div>
<!-- 中心暖辉光 -->
<div style="position:absolute;top:30%;left:25%;width:600px;height:500px;border-radius:50%;
  background:radial-gradient(ellipse,hsla(38,70%,55%,0.12),hsla(25,50%,40%,0.04),transparent 70%);
  filter:blur(100px);animation:warmBreath 12s ease-in-out infinite 0s"></div>
<!-- 径向暗角 -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(0,0,0,0.55) 80%, rgba(0,0,0,0.75) 100%)"></div>
<!-- 中心微光呼吸 -->
<div style="position:absolute;top:35%;left:30%;width:480px;height:360px;border-radius:50%;
  background:radial-gradient(ellipse,hsla(45,80%,65%,0.06),transparent 60%);
  filter:blur(60px);animation:vignettePulse 8s ease-in-out infinite 3s"></div>
