<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes bloodMoonGlow {
  0%, 100% { opacity: 0.78; transform: scale(1); }
  50% { opacity: 0.92; transform: scale(1.03); }
}
@keyframes bloodHaloPulse {
  0%, 100% { opacity: 0.40; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(1.06); }
}
@keyframes bloodFogDrift {
  0%, 100% { transform: translateX(-14px); opacity: 0.34; }
  50% { transform: translateX(14px); opacity: 0.46; }
}
@keyframes bloodEmberFloat {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  15% { opacity: 0.7; }
  85% { opacity: 0.45; }
  100% { transform: translateY(-100px) translateX(8px); opacity: 0; }
}
@keyframes bloodFlash {
  0%, 88%, 100% { opacity: 0; }
  90%, 92% { opacity: 0.5; }
  94% { opacity: 0.15; }
  96% { opacity: 0.4; }
  98% { opacity: 0; }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.24; }
  50% { opacity: 0.34; }
}

<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: bloodmoon_wild -->
<!-- 暗紫红黑底（不祥夜空） -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,hsl(282,32%,4%) 0%,hsl(292,40%,7%) 45%,hsl(278,34%,5%) 100%)"></div>
<!-- 血月大范围月晕（ ominous 红光弥散） -->
<div style="position:absolute;top:2%;left:8%;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,hsla(355,70%,42%,0.30),hsla(345,60%,30%,0.14),transparent 60%);
  filter:blur(55px);animation:bloodHaloPulse 9s ease-in-out infinite"></div>
<!-- 巨型血月本体（中上偏左，又大又红） -->
<div style="position:absolute;top:6%;left:13%;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle at 42% 40%,hsla(12,78%,55%,0.72),hsla(355,72%,42%,0.46) 45%,hsla(342,65%,28%,0.22) 75%,transparent 100%);
  box-shadow:0 0 90px hsla(0,72%,45%,0.42),0 0 180px hsla(350,60%,33%,0.26);
  filter:blur(1.5px);animation:bloodMoonGlow 8s ease-in-out infinite"></div>
<!-- 血月表面暗斑（陨石坑感） -->
<div style="position:absolute;top:14%;left:22%;width:48px;height:38px;border-radius:50%;
  background:hsla(342,55%,28%,0.30);filter:blur(6px)"></div>
<div style="position:absolute;top:20%;left:32%;width:30px;height:26px;border-radius:50%;
  background:hsla(340,52%,26%,0.26);filter:blur(5px)"></div>
<div style="position:absolute;top:9%;left:30%;width:22px;height:18px;border-radius:50%;
  background:hsla(344,50%,27%,0.24);filter:blur(4px)"></div>
<!-- 高空紫红云带 -->
<div style="position:absolute;top:38%;left:-10%;width:120%;height:120px;
  background:linear-gradient(90deg,transparent 8%,hsla(300,45%,35%,0.12) 30%,hsla(290,40%,30%,0.16) 50%,hsla(310,42%,38%,0.10) 72%,transparent 92%);
  filter:blur(44px)"></div>
<!-- 远处血色闪电 1（细线，偶现） -->
<div style="position:absolute;top:20%;right:24%;width:1.5px;height:200px;
  background:linear-gradient(180deg,transparent,hsla(330,80%,60%,0.55),hsla(340,75%,55%,0.35),transparent);
  filter:blur(0.5px);transform:rotate(6deg);animation:bloodFlash 7s linear infinite 0s"></div>
<!-- 远处血色闪电 2 -->
<div style="position:absolute;top:15%;right:18%;width:1px;height:240px;
  background:linear-gradient(180deg,transparent,hsla(320,75%,58%,0.45),transparent);
  filter:blur(0.5px);transform:rotate(-4deg);animation:bloodFlash 9s linear infinite 3s"></div>
<!-- 远处血色闪电 3（分支感） -->
<div style="position:absolute;top:25%;right:30%;width:1px;height:160px;
  background:linear-gradient(180deg,transparent,hsla(335,78%,58%,0.40),transparent);
  filter:blur(0.5px);transform:rotate(10deg);animation:bloodFlash 8s linear infinite 5s"></div>
<!-- 底部血色雾气（水平红紫雾带） -->
<div style="position:absolute;bottom:0;left:-10%;width:120%;height:240px;
  background:linear-gradient(90deg,transparent 5%,hsla(350,55%,35%,0.24) 25%,hsla(340,50%,30%,0.32) 50%,hsla(355,58%,38%,0.22) 75%,transparent 95%);
  filter:blur(48px);animation:bloodFogDrift 15s ease-in-out infinite"></div>
<!-- 远景荒原地形剪影（淡起伏） -->
<div style="position:absolute;bottom:0;left:-5%;width:110%;height:200px;
  background:hsla(280,25%,8%,0.55);
  clip-path:polygon(0 100%,0 62%,8% 54%,16% 60%,24% 48%,32% 58%,40% 50%,48% 62%,56% 52%,64% 60%,72% 50%,80% 58%,88% 52%,100% 58%,100% 100%)"></div>
<!-- 近景荒原地形剪影（实深起伏） -->
<div style="position:absolute;bottom:0;left:-5%;width:110%;height:130px;
  background:hsla(285,20%,4%,0.85);
  clip-path:polygon(0 100%,0 70%,10% 62%,20% 72%,30% 60%,42% 70%,52% 58%,62% 72%,72% 62%,82% 70%,92% 64%,100% 70%,100% 100%)"></div>
<!-- 枯树剪影 1（左，细高） -->
<div style="position:absolute;bottom:10%;left:18%;width:38px;height:160px;
  background:hsla(288,18%,3%,0.92);
  clip-path:polygon(42% 0,52% 0,56% 30%,50% 32%,58% 55%,48% 56%,54% 78%,46% 80%,52% 100%,44% 100%,40% 60%,46% 58%,38% 35%,48% 33%,44% 10%);
  filter:blur(0.5px)"></div>
<!-- 枯树剪影 2（右，更高更瘦） -->
<div style="position:absolute;bottom:8%;right:20%;width:30px;height:200px;
  background:hsla(290,16%,3%,0.90);
  clip-path:polygon(40% 0,54% 0,56% 28%,48% 30%,60% 52%,46% 54%,56% 76%,44% 78%,52% 100%,42% 100%,38% 58%,50% 56%,36% 32%,48% 30%,42% 8%);
  filter:blur(0.5px)"></div>
<!-- 枯树剪影 3（中远，矮小） -->
<div style="position:absolute;bottom:7%;left:60%;width:26px;height:120px;
  background:hsla(286,18%,4%,0.80);
  clip-path:polygon(42% 0,56% 0,52% 34%,48% 36%,58% 60%,46% 62%,54% 100%,44% 100%,40% 64%,50% 62%,38% 36%,48% 34%,44% 8%);
  filter:blur(0.5px)"></div>
<!-- 飘散血红尘埃 1 -->
<div style="position:absolute;bottom:18%;left:26%;width:3px;height:3px;border-radius:50%;
  background:hsla(350,75%,52%,0.65);box-shadow:0 0 9px hsla(345,68%,42%,0.52);animation:bloodEmberFloat 9s linear infinite 0s"></div>
<!-- 飘散血红尘埃 2 -->
<div style="position:absolute;bottom:25%;right:28%;width:2px;height:2px;border-radius:50%;
  background:hsla(340,72%,50%,0.60);box-shadow:0 0 7px hsla(338,65%,40%,0.48);animation:bloodEmberFloat 11s linear infinite 2s"></div>
<!-- 飘散血红尘埃 3 -->
<div style="position:absolute;bottom:15%;left:52%;width:3px;height:3px;border-radius:50%;
  background:hsla(355,70%,48%,0.62);box-shadow:0 0 8px hsla(350,63%,38%,0.5);animation:bloodEmberFloat 10s linear infinite 4s"></div>
<!-- 飘散血红尘埃 4 -->
<div style="position:absolute;bottom:30%;left:40%;width:2px;height:2px;border-radius:50%;
  background:hsla(345,68%,46%,0.55);box-shadow:0 0 6px hsla(342,60%,36%,0.42);animation:bloodEmberFloat 12s linear infinite 6s"></div>
<!-- 暗紫玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(180,80,120,0.04) 0%,transparent 38%,rgba(140,50,90,0.05) 62%,transparent 100%);
  animation:glassShimmer 10s ease-in-out infinite"></div>
<!-- 暗紫暗角（强化不祥压迫感） -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 30%,transparent 30%,hsla(285,40%,3%,0.50) 100%)"></div>
