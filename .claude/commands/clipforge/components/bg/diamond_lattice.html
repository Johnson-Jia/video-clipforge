<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes latticeDrift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,30px)} }
@keyframes glassShimmer { 0%,100%{opacity:0.15} 50%{opacity:0.20} }
@keyframes goldParticleDrift { 0%,100%{transform:translate(0,0);opacity:0.5} 50%{transform:translate(20px,-30px);opacity:0.9} }
@keyframes diamondNodePulse { 0%,100%{opacity:0.4;transform:translate(-50%,-50%) scale(0.9)} 50%{opacity:0.9;transform:translate(-50%,-50%) scale(1.05)} }
@keyframes energyFlow { 0%{transform:translateX(-100%);opacity:0} 50%{opacity:0.6} 100%{transform:translateX(100%);opacity:0} }
@keyframes centerDiamondSpin { 0%{transform:translate(-50%,-50%) rotate(0deg)} 100%{transform:translate(-50%,-50%) rotate(90deg)} }
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: diamond_lattice -->
<!-- 暖金黑底 -->
<div style="position:absolute;inset:0;background:linear-gradient(135deg,hsl(40,20%,4%),hsl(30,15%,7%))"></div>
<!-- 菱形网格（45° + -45° 交叉线） -->
<div style="position:absolute;inset:0;animation:latticeDrift 24s ease-in-out infinite;
  background-image:
    repeating-linear-gradient(45deg,transparent,transparent 59px,hsla(40,70%,55%,0.055) 59px,hsla(40,70%,55%,0.055) 60px),
    repeating-linear-gradient(-45deg,transparent,transparent 59px,hsla(40,70%,55%,0.055) 59px,hsla(40,70%,55%,0.055) 60px);
  background-size:85px 85px"></div>
<!-- 中心金色辉光 -->
<div style="position:absolute;top:30%;left:25%;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,hsla(38,80%,50%,0.20),hsla(35,60%,40%,0.08),transparent 70%);
  filter:blur(90px)"></div>
<!-- 副辉光 -->
<div style="position:absolute;top:60%;left:50%;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,hsla(42,65%,48%,0.10),transparent 70%);
  filter:blur(70px)"></div>
<!-- 金色粒子 1-6（dots 类型，钻石折射漂浮感） -->
<div style="position:absolute;top:25%;left:45%;width:6px;height:6px;border-radius:50%;
  background:hsla(45,90%,65%,0.9);box-shadow:0 0 12px hsla(45,80%,60%,0.7);
  animation:goldParticleDrift 7s ease-in-out infinite"></div>
<div style="position:absolute;top:50%;left:70%;width:5px;height:5px;border-radius:50%;
  background:hsla(40,85%,60%,0.85);box-shadow:0 0 10px hsla(40,75%,55%,0.6);
  animation:goldParticleDrift 9s ease-in-out infinite 1s"></div>
<div style="position:absolute;top:68%;left:35%;width:7px;height:7px;border-radius:50%;
  background:hsla(50,90%,68%,0.9);box-shadow:0 0 14px hsla(50,80%,60%,0.7);
  animation:goldParticleDrift 8s ease-in-out infinite 2s"></div>
<div style="position:absolute;top:38%;left:75%;width:4px;height:4px;border-radius:50%;
  background:hsla(42,80%,58%,0.8);box-shadow:0 0 8px hsla(42,70%,52%,0.5);
  animation:goldParticleDrift 10s ease-in-out infinite 0.5s"></div>
<div style="position:absolute;top:75%;left:60%;width:5px;height:5px;border-radius:50%;
  background:hsla(45,85%,62%,0.85);box-shadow:0 0 10px hsla(45,75%,55%,0.6);
  animation:goldParticleDrift 7.5s ease-in-out infinite 3s"></div>
<div style="position:absolute;top:32%;left:62%;width:6px;height:6px;border-radius:50%;
  background:hsla(38,88%,63%,0.88);box-shadow:0 0 12px hsla(38,78%,57%,0.65);
  animation:goldParticleDrift 8.5s ease-in-out infinite 1.5s"></div>
<!-- 菱形高亮节点 1（clip-path 大菱形，装饰前景） -->
<div style="position:absolute;top:42%;left:50%;width:160px;height:160px;
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  background:linear-gradient(135deg,hsla(42,70%,50%,0.14),transparent,hsla(50,60%,45%,0.10));
  border:1.5px solid hsla(42,70%,55%,0.22);
  animation:diamondNodePulse 6s ease-in-out infinite"></div>
<!-- 菱形高亮节点 2（小） -->
<div style="position:absolute;top:65%;left:30%;width:70px;height:70px;
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  background:hsla(40,60%,48%,0.10);
  border:1px solid hsla(40,70%,52%,0.20);
  animation:diamondNodePulse 7s ease-in-out infinite 2s"></div>
<!-- 对角能量流光（beams 类型） -->
<div style="position:absolute;top:45%;left:0;width:100%;height:3px;
  background:linear-gradient(90deg,transparent,hsla(45,80%,60%,0.5),hsla(50,90%,70%,0.7),hsla(45,80%,60%,0.5),transparent);
  filter:blur(2px);animation:energyFlow 8s ease-in-out infinite"></div>
<!-- 中心装饰菱形边框（clip-path，旋转） -->
<div style="position:absolute;top:42%;left:50%;width:100px;height:100px;
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  border:1px solid hsla(45,70%,58%,0.3);
  animation:centerDiamondSpin 18s linear infinite"></div>
<!-- 暖色玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,220,150,0.02) 0%,transparent 40%,rgba(255,200,120,0.025) 60%,transparent 100%);
  animation:glassShimmer 8s ease-in-out infinite"></div>
<!-- 棱镜色散 -->
<div style="position:absolute;bottom:15%;left:-10%;width:120%;height:160px;opacity:0.15;
  background:linear-gradient(90deg,transparent,hsla(40,60%,50%,0.4),hsla(25,50%,45%,0.3),hsla(50,70%,55%,0.4),transparent);
  filter:blur(60px)"></div>
