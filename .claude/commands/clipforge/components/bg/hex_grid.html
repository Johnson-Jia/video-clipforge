<!--

layer: bg
tags: [hexagon, grid, honeycomb, emerald, tech, pattern, pulse, glass, scan-wave, node, holo, hud]

visual_density: high
complexity: css-only
description: SVG 六边形蜂窝网格 + 翡翠中心辉光 + 蜂巢扫描波（conic 旋转）+ 高亮节点闪烁 + 四角数据角标 + 中心全息菱形 + 毛玻璃折射 + 棱镜色散
parameters:
  grid_scale: { default: 1.4, range: [1.0, 2.0], description: "网格缩放倍率" }
  glow_color: { default: "hsla(150,80%,50%,0.22)", description: "中心辉光颜色" }
  pulse_period: { default: 7, range: [5, 12] }
visual_types: [beams, geometry, glow, gradient, particles]
/ComponentMeta
-->
<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes hexPulse { 0%,100%{opacity:0.5} 50%{opacity:0.85} }
@keyframes glassShimmer { 0%,100%{opacity:0.15} 50%{opacity:0.20} }
@keyframes hexScanRotate { 0%{transform:translate(-50%,-50%) rotate(0deg)} 100%{transform:translate(-50%,-50%) rotate(360deg)} }
@keyframes hexNodePulse { 0%,100%{opacity:0.3;transform:scale(0.9)} 50%{opacity:1;transform:scale(1.15)} }
@keyframes holoHexSpin { 0%{transform:translate(-50%,-50%) rotate(0deg)} 100%{transform:translate(-50%,-50%) rotate(60deg)} }
@keyframes cornerBlink { 0%,100%{opacity:0.35} 50%{opacity:0.85} }
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: hex_grid -->
<!-- 翡翠黑底 -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,hsl(160,20%,4%),hsl(170,15%,8%),hsl(160,20%,4%))"></div>
<!-- 六边形网格 SVG -->
<svg style="position:absolute;inset:0;width:100%;height:100%;opacity:0.55" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hexPat" width="56" height="100" patternUnits="userSpaceOnUse" patternTransform="scale(1.4)">
      <path d="M28 0 L56 16.7 L56 50 L28 66.7 L0 50 L0 16.7 Z" fill="none" stroke="hsla(155,70%,45%,0.12)" stroke-width="0.8"/>
      <path d="M28 33.3 L56 50 L56 83.3 L28 100 L0 83.3 L0 50 Z" fill="none" stroke="hsla(155,70%,45%,0.12)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#hexPat)"/>
</svg>
<!-- 蜂巢扫描波（conic 旋转扫描，签名元素 + scan/beams 类型） -->
<div style="position:absolute;top:42%;left:50%;width:900px;height:900px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,hsla(150,80%,55%,0.10) 30deg,transparent 70deg,transparent 360deg);
  filter:blur(40px);animation:hexScanRotate 14s linear infinite"></div>
<!-- 网格脉冲叠加 -->
<div style="position:absolute;inset:0;background:rgba(0,0,0,0);animation:hexPulse 7s ease-in-out infinite"></div>
<!-- 中心翡翠辉光 -->
<div style="position:absolute;top:30%;left:25%;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,hsla(150,80%,50%,0.22),hsla(155,60%,40%,0.08),transparent 70%);
  filter:blur(100px)"></div>
<!-- 副辉光 -->
<div style="position:absolute;top:60%;left:55%;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,hsla(140,60%,45%,0.10),transparent 70%);
  filter:blur(80px)"></div>
<!-- 高亮节点 1（dots 类型，蜂巢节点闪烁） -->
<div style="position:absolute;top:28%;left:42%;width:14px;height:14px;border-radius:50%;
  background:hsla(150,90%,60%,0.9);box-shadow:0 0 16px hsla(150,80%,55%,0.8),0 0 32px hsla(150,70%,50%,0.4);
  animation:hexNodePulse 4s ease-in-out infinite"></div>
<!-- 高亮节点 2 -->
<div style="position:absolute;top:55%;left:68%;width:10px;height:10px;border-radius:50%;
  background:hsla(160,85%,58%,0.85);box-shadow:0 0 14px hsla(160,75%,52%,0.7);
  animation:hexNodePulse 5s ease-in-out infinite 1s"></div>
<!-- 高亮节点 3 -->
<div style="position:absolute;top:70%;left:30%;width:12px;height:12px;border-radius:50%;
  background:hsla(145,80%,55%,0.8);box-shadow:0 0 14px hsla(145,70%,50%,0.6);
  animation:hexNodePulse 6s ease-in-out infinite 2s"></div>
<!-- 高亮节点 4 -->
<div style="position:absolute;top:40%;left:78%;width:9px;height:9px;border-radius:50%;
  background:hsla(155,85%,60%,0.85);box-shadow:0 0 12px hsla(155,75%,52%,0.7);
  animation:hexNodePulse 4.5s ease-in-out infinite 0.5s"></div>
<!-- 中心全息菱形（clip-path 装饰前景，旋转） -->
<div style="position:absolute;top:42%;left:50%;width:180px;height:180px;
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  background:linear-gradient(135deg,hsla(150,70%,50%,0.12),transparent,hsla(170,60%,45%,0.10));
  border:1.5px solid hsla(150,70%,55%,0.25);
  animation:holoHexSpin 20s linear infinite"></div>
<!-- 四角数据角标（clip-path L 形，HUD 监控感） -->
<div style="position:absolute;top:120px;left:90px;width:40px;height:40px;
  border-top:2px solid hsla(150,70%,55%,0.4);border-left:2px solid hsla(150,70%,55%,0.4);
  animation:cornerBlink 5s ease-in-out infinite"></div>
<div style="position:absolute;top:120px;right:90px;width:40px;height:40px;
  border-top:2px solid hsla(150,70%,55%,0.4);border-right:2px solid hsla(150,70%,55%,0.4);
  animation:cornerBlink 5s ease-in-out infinite 1.5s"></div>
<div style="position:absolute;bottom:160px;left:90px;width:40px;height:40px;
  border-bottom:2px solid hsla(150,70%,55%,0.4);border-left:2px solid hsla(150,70%,55%,0.4);
  animation:cornerBlink 5s ease-in-out infinite 3s"></div>
<div style="position:absolute;bottom:160px;right:90px;width:40px;height:40px;
  border-bottom:2px solid hsla(150,70%,55%,0.4);border-right:2px solid hsla(150,70%,55%,0.4);
  animation:cornerBlink 5s ease-in-out infinite 4s"></div>
<!-- 玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,0.015) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.02) 100%);
  animation:glassShimmer 8s ease-in-out infinite"></div>
<!-- 棱镜色散 -->
<div style="position:absolute;top:50%;right:-8%;width:50%;height:200px;opacity:0.15;
  background:linear-gradient(90deg,hsla(120,60%,50%,0.5),hsla(160,50%,45%,0.4),hsla(200,60%,50%,0.5));
  filter:blur(70px);border-radius:50%"></div>
