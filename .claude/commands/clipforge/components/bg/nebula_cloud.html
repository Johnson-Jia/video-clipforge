parameters:

<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes orbDrift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -40px) scale(1.05); }
  50% { transform: translate(-20px, 20px) scale(0.95); }
  75% { transform: translate(15px, 35px) scale(1.02); }
}
@keyframes starTwinkle {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 0.85; }
}
@keyframes brightStarTwinkle {
  0%, 100% { opacity: 0.65; }
  50% { opacity: 0.95; }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.30; }
  50% { opacity: 0.40; }
}
@keyframes dustDrift {
  0%, 100% { transform: translate(0, 0) rotate(-25deg); opacity: 0.12; }
  50% { transform: translate(15px, -10px) rotate(-25deg); opacity: 0.18; }
}
@keyframes focusBreath {
  0%, 100% { opacity: 0.28; transform: scale(1); }
  50% { opacity: 0.40; transform: scale(1.05); }
}
@keyframes auroraWave {
  0%, 100% { transform: translateX(-15px) scaleY(1); opacity: 0.7; }
  50% { transform: translateX(15px) scaleY(1.25); opacity: 1; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: nebula_cloud -->
<!-- 深紫黑底 -->
<div style="position:absolute;inset:0;background:linear-gradient(160deg,hsl(260,30%,10%),hsl(240,25%,13%),hsl(255,28%,11%))"></div>
<!-- 星云 1：深紫（主星云） -->
<div style="position:absolute;top:12%;left:8%;width:550px;height:550px;border-radius:50%;
  background:radial-gradient(circle,hsla(280,65%,42%,0.34),hsla(270,50%,30%,0.13),transparent 70%);
  filter:blur(100px);animation:orbDrift 24s ease-in-out infinite 0s"></div>
<!-- 星云 2：暗红 -->
<div style="position:absolute;top:45%;left:45%;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,hsla(350,55%,38%,0.28),hsla(340,45%,28%,0.10),transparent 70%);
  filter:blur(90px);animation:orbDrift 28s ease-in-out infinite 6s"></div>
<!-- 星云 3：深蓝（缩小，拉开层次） -->
<div style="position:absolute;top:62%;left:5%;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,hsla(220,60%,42%,0.26),hsla(230,45%,30%,0.10),transparent 70%);
  filter:blur(85px);animation:orbDrift 22s ease-in-out infinite 12s"></div>
<!-- 银河星尘带（对角线方向淡色雾带） -->
<div style="position:absolute;top:25%;left:-10%;width:120%;height:180px;
  background:linear-gradient(90deg,transparent 5%,hsla(265,40%,50%,0.12) 20%,hsla(250,35%,45%,0.08) 50%,hsla(280,38%,48%,0.10) 80%,transparent 95%);
  filter:blur(50px);transform:rotate(-25deg);animation:dustDrift 30s ease-in-out infinite"></div>
<!-- 聚焦辉光（小而亮的星云热点） -->
<div style="position:absolute;top:22%;left:62%;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,hsla(300,70%,65%,0.30),hsla(290,55%,50%,0.10),transparent 60%);
  filter:blur(40px);animation:focusBreath 7s ease-in-out infinite"></div>
<!-- 极光帘幕 1（宽，绿-青渐变波动条带） -->
<div style="position:absolute;top:60%;left:-10%;width:120%;height:100px;
  background:linear-gradient(90deg,transparent 5%,hsla(160,62%,50%,0.10) 20%,hsla(180,55%,45%,0.08) 40%,hsla(150,65%,48%,0.12) 60%,hsla(170,58%,46%,0.08) 80%,transparent 95%);
  filter:blur(40px);animation:auroraWave 12s ease-in-out infinite 0s"></div>
<!-- 极光帘幕 2（窄，青-紫渐变，节奏不同） -->
<div style="position:absolute;top:70%;left:-10%;width:120%;height:70px;
  background:linear-gradient(90deg,transparent 10%,hsla(140,55%,45%,0.08) 30%,hsla(170,50%,40%,0.06) 55%,hsla(130,60%,42%,0.09) 75%,transparent 90%);
  filter:blur(35px);animation:auroraWave 16s ease-in-out infinite 5s"></div>
<!-- 亮星 1（5px，双层 glow） -->
<div style="position:absolute;top:12%;left:65%;width:5px;height:5px;border-radius:50%;background:white;opacity:0.75;box-shadow:0 0 12px rgba(255,255,255,0.8),0 0 25px rgba(200,180,255,0.3);animation:brightStarTwinkle 4s ease-in-out infinite 0s"></div>
<!-- 亮星 2 -->
<div style="position:absolute;top:42%;left:78%;width:5px;height:5px;border-radius:50%;background:white;opacity:0.80;box-shadow:0 0 14px rgba(255,255,255,0.85),0 0 28px rgba(180,200,255,0.3);animation:brightStarTwinkle 3.5s ease-in-out infinite 3s"></div>
<!-- 星点 3（升级亮星） -->
<div style="position:absolute;top:82%;left:18%;width:4px;height:4px;border-radius:50%;background:white;opacity:0.70;box-shadow:0 0 10px rgba(255,255,255,0.75),0 0 22px rgba(220,200,255,0.25);animation:starTwinkle 5.5s ease-in-out infinite 1s"></div>
<!-- 星点 4 -->
<div style="position:absolute;top:28%;left:25%;width:2px;height:2px;border-radius:50%;background:white;opacity:0.55;box-shadow:0 0 7px rgba(255,255,255,0.6);animation:starTwinkle 5s ease-in-out infinite 1.5s"></div>
<!-- 星点 5 -->
<div style="position:absolute;top:55%;left:40%;width:2px;height:2px;border-radius:50%;background:white;opacity:0.50;box-shadow:0 0 6px rgba(255,255,255,0.55);animation:starTwinkle 6s ease-in-out infinite 2s"></div>
<!-- 星点 6 -->
<div style="position:absolute;top:70%;left:60%;width:2px;height:2px;border-radius:50%;background:white;opacity:0.58;box-shadow:0 0 7px rgba(255,255,255,0.65);animation:starTwinkle 4.5s ease-in-out infinite 4s"></div>
<!-- 星点 7 -->
<div style="position:absolute;top:35%;left:52%;width:2px;height:2px;border-radius:50%;background:white;opacity:0.52;box-shadow:0 0 6px rgba(255,255,255,0.6);animation:starTwinkle 4s ease-in-out infinite 5s"></div>
<!-- 星点 8 -->
<div style="position:absolute;top:8%;left:42%;width:2px;height:2px;border-radius:50%;background:white;opacity:0.56;box-shadow:0 0 7px rgba(255,255,255,0.6);animation:starTwinkle 3s ease-in-out infinite 2.5s"></div>
<!-- 暗星 1 -->
<div style="position:absolute;top:18%;left:80%;width:1px;height:1px;border-radius:50%;background:white;opacity:0.35;box-shadow:0 0 3px rgba(255,255,255,0.3)"></div>
<!-- 暗星 2 -->
<div style="position:absolute;top:48%;left:15%;width:1px;height:1px;border-radius:50%;background:white;opacity:0.30;box-shadow:0 0 3px rgba(255,255,255,0.25)"></div>
<!-- 暗星 3 -->
<div style="position:absolute;top:75%;left:48%;width:1px;height:1px;border-radius:50%;background:white;opacity:0.32;box-shadow:0 0 3px rgba(255,255,255,0.28)"></div>
<!-- 暗星 4 -->
<div style="position:absolute;top:60%;left:85%;width:1px;height:1px;border-radius:50%;background:white;opacity:0.28;box-shadow:0 0 3px rgba(255,255,255,0.25)"></div>
<!-- 玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.04) 0%,transparent 35%,transparent 65%,rgba(255,255,255,0.06) 100%);
  animation:glassShimmer 10s ease-in-out infinite"></div>
<!-- 棱镜色散 -->
<div style="position:absolute;top:20%;right:-5%;width:40%;height:250px;opacity:0.26;
  background:linear-gradient(180deg,rgba(255,80,180,0.45),rgba(80,120,255,0.35),rgba(180,80,255,0.45));
  filter:blur(80px);border-radius:50%"></div>
