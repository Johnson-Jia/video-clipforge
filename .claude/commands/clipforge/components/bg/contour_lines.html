  line_color: { default: "rgba(0,200,200,0.06)", description: "等高线颜色" }

<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes glassShimmer {
  0%, 100% { opacity: 0.03; }
  50% { opacity: 0.08; }
}
@keyframes contourPulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 0.9; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- 渐变底色 -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#080818 0%,#0a1520 50%,#080818 100%)"></div>
<!-- 等高线纹理 -->
<div style="position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 40%,transparent 0px,transparent 78px,rgba(0,200,200,0.06) 78px,rgba(0,200,200,0.06) 80px);animation:contourPulse 8s ease-in-out infinite"></div>
<!-- 中心辉光 -->
<div style="position:absolute;top:25%;left:20%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,180,200,0.12) 0%,transparent 70%);filter:blur(80px)"></div>
<!-- 对角线光带 -->
<div style="position:absolute;top:0;left:30%;width:2px;height:100%;background:linear-gradient(transparent 10%,rgba(0,200,200,0.08) 50%,transparent 90%)"></div>
<!-- 玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(145deg,rgba(255,255,255,0.02) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.02) 100%);
  animation:glassShimmer 9s ease-in-out infinite"></div>
<!-- 棱镜色散 -->
<div style="position:absolute;bottom:20%;left:-10%;width:120%;height:150px;opacity:0.03;
  background:linear-gradient(90deg,transparent,rgba(0,255,200,0.4),rgba(200,100,255,0.4),rgba(0,150,255,0.4),transparent);
  filter:blur(60px);transform:rotate(2deg)"></div>
