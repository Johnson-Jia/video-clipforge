<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes glassShimmer { 0%,100%{opacity:0.15} 50%{opacity:0.20} }
@keyframes contourPulse { 0%,100%{opacity:0.7} 50%{opacity:0.9} }
@keyframes contourShift { 0%,100%{background-position:0% 50%} 50%{background-position:3% 48%} }
@keyframes glowPulse { 0%,100%{opacity:0.6;transform:translate(-50%,-50%) scale(1)} 50%{opacity:0.9;transform:translate(-50%,-50%) scale(1.05)} }
@keyframes beamBreath { 0%,100%{opacity:0.5} 50%{opacity:0.8} }
@keyframes starDot { 0%,100%{opacity:0.3} 50%{opacity:0.6} }
@keyframes prismShimmer { 0%,100%{opacity:0.15} 50%{opacity:0.18} }
@keyframes annotationPulse { 0%,100%{opacity:0.5;transform:scale(0.9)} 50%{opacity:1;transform:scale(1.1)} }
@keyframes terrainRise { 0%,100%{transform:translate(0,0)} 50%{transform:translate(8px,-6px)} }
@keyframes tickFade { 0%,100%{opacity:0.2} 50%{opacity:0.55} }
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: contour_lines -->
<!-- 渐变底色 -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,#080818 0%,#0a1520 50%,#080818 100%)"></div>
<!-- 等高线纹理（主层，地形起伏动画） -->
<div style="position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 40%,transparent 0px,transparent 78px,rgba(0,200,200,0.06) 78px,rgba(0,200,200,0.06) 80px);animation:contourPulse 8s ease-in-out infinite,terrainRise 12s ease-in-out infinite"></div>
<!-- 等高线纹理（副层，缓慢漂移） -->
<div style="position:absolute;inset:0;opacity:0.5;background:repeating-radial-gradient(circle at 32% 42%,transparent 0px,transparent 120px,rgba(0,180,200,0.03) 120px,rgba(0,180,200,0.03) 122px);animation:contourShift 20s ease-in-out infinite"></div>
<!-- 中心辉光（脉冲动画） -->
<div style="position:absolute;top:40%;left:30%;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,180,200,0.12) 0%,transparent 70%);filter:blur(80px);
  animation:glowPulse 10s ease-in-out infinite"></div>
<!-- 对角线光带 1（呼吸动画） -->
<div style="position:absolute;top:0;left:30%;width:2px;height:100%;
  background:linear-gradient(transparent 10%,rgba(0,200,200,0.08) 50%,transparent 90%);
  animation:beamBreath 6s ease-in-out infinite"></div>
<!-- 对角线光带 2 -->
<div style="position:absolute;top:0;left:68%;width:1.5px;height:100%;
  background:linear-gradient(transparent 20%,rgba(0,200,200,0.05) 50%,transparent 80%);
  animation:beamBreath 8s ease-in-out infinite 3s"></div>
<!-- 数据标注点 1（dots + 引线，测量感） -->
<div style="position:absolute;top:38%;left:28%;width:16px;height:16px;border-radius:50%;
  background:rgba(0,255,220,0.9);box-shadow:0 0 16px rgba(0,255,220,0.6);
  animation:annotationPulse 4s ease-in-out infinite"></div>
<!-- 引线 1（clip-path 斜线，连接标注点到边缘） -->
<div style="position:absolute;top:38%;left:28%;width:120px;height:2px;
  background:linear-gradient(90deg,rgba(0,255,220,0.5),transparent);
  transform:rotate(-25deg);transform-origin:left center"></div>
<!-- 数据标注点 2 -->
<div style="position:absolute;top:52%;left:42%;width:12px;height:12px;border-radius:50%;
  background:rgba(0,240,200,0.85);box-shadow:0 0 14px rgba(0,240,200,0.5);
  animation:annotationPulse 5s ease-in-out infinite 1.5s"></div>
<!-- 数据标注点 3 -->
<div style="position:absolute;top:30%;left:55%;width:10px;height:10px;border-radius:50%;
  background:rgba(0,230,210,0.8);box-shadow:0 0 12px rgba(0,230,210,0.45);
  animation:annotationPulse 6s ease-in-out infinite 3s"></div>
<!-- 数据闪烁点 1-3（原有星点强化） -->
<div style="position:absolute;top:38%;left:28%;width:4px;height:4px;border-radius:50%;
  background:hsla(180,70%,60%,0.5);box-shadow:0 0 8px hsla(180,60%,50%,0.4);animation:starDot 3s ease-in-out infinite"></div>
<div style="position:absolute;top:52%;left:42%;width:3px;height:3px;border-radius:50%;
  background:hsla(190,65%,55%,0.4);box-shadow:0 0 6px hsla(190,55%,45%,0.3);animation:starDot 4s ease-in-out infinite 2s"></div>
<div style="position:absolute;top:30%;left:55%;width:3px;height:3px;border-radius:50%;
  background:hsla(175,60%,58%,0.45);box-shadow:0 0 7px hsla(175,50%,48%,0.35);animation:starDot 3.5s ease-in-out infinite 4s"></div>
<!-- 测量刻度（右竖排，测绘仪表感） -->
<div style="position:absolute;top:200px;right:70px;display:flex;flex-direction:column;gap:35px;opacity:0.45;
  font-family:'JetBrains Mono',monospace;color:rgba(0,200,200,0.4);font-size:13px;
  animation:tickFade 7s ease-in-out infinite">
  <span>100m</span><span>80m</span><span>60m</span><span>40m</span><span>20m</span>
</div>
<!-- 玻璃折射层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(145deg,rgba(255,255,255,0.02) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.02) 100%);
  animation:glassShimmer 9s ease-in-out infinite"></div>
<!-- 棱镜色散 -->
<div style="position:absolute;bottom:20%;left:-10%;width:120%;height:150px;opacity:0.15;
  background:linear-gradient(90deg,transparent,rgba(0,255,200,0.4),rgba(200,100,255,0.4),rgba(0,150,255,0.4),transparent);
  filter:blur(60px);transform:rotate(2deg);animation:prismShimmer 11s ease-in-out infinite"></div>
