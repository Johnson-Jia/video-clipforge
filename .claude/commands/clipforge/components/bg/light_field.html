parameters:
  orb_count: { default: 2, range: [1, 3] }

<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes orbDrift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -40px) scale(1.05); }
  50% { transform: translate(-20px, 20px) scale(0.95); }
  75% { transform: translate(15px, 35px) scale(1.02); }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.20; }
}
@keyframes starDot {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.6; }
}
@keyframes prismShimmer {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.18; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: light_field -->
<!-- 深色底 -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 40%, var(--bg-mid, #001a33), var(--bg-dark, #080818))"></div>
<!-- 光球 1 -->
<div style="position:absolute;top:25%;left:20%;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,hsla(210,70%,55%,0.18),hsla(260,50%,40%,0.06),transparent 70%);
  filter:blur(80px);animation:orbDrift 20s ease-in-out infinite 0s"></div>
<!-- 光球 2 -->
<div style="position:absolute;top:50%;left:55%;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,hsla(280,60%,50%,0.14),hsla(220,40%,35%,0.05),transparent 70%);
  filter:blur(70px);animation:orbDrift 24s ease-in-out infinite 8s"></div>
<!-- 光球 3（小型高亮补充） -->
<div style="position:absolute;top:60%;left:15%;width:250px;height:250px;border-radius:50%;
  background:radial-gradient(circle,hsla(170,55%,50%,0.12),transparent 65%);
  filter:blur(60px);animation:orbDrift 16s ease-in-out infinite 4s"></div>
<!-- 闪烁星尘 1 -->
<div style="position:absolute;top:15%;left:45%;width:3px;height:3px;border-radius:50%;
  background:white;opacity:0.35;box-shadow:0 0 5px rgba(255,255,255,0.4);animation:starDot 4s ease-in-out infinite 0s"></div>
<!-- 闪烁星尘 2 -->
<div style="position:absolute;top:40%;left:75%;width:2px;height:2px;border-radius:50%;
  background:white;opacity:0.30;box-shadow:0 0 4px rgba(255,255,255,0.35);animation:starDot 5s ease-in-out infinite 2s"></div>
<!-- 闪烁星尘 3 -->
<div style="position:absolute;top:72%;left:35%;width:3px;height:3px;border-radius:50%;
  background:white;opacity:0.38;box-shadow:0 0 6px rgba(255,255,255,0.4);animation:starDot 3.5s ease-in-out infinite 4s"></div>
<!-- 闪烁星尘 4 -->
<div style="position:absolute;top:55%;left:60%;width:2px;height:2px;border-radius:50%;
  background:white;opacity:0.28;box-shadow:0 0 4px rgba(255,255,255,0.3);animation:starDot 6s ease-in-out infinite 1s"></div>
<!-- 玻璃折射：对角线高光 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.015) 0%,transparent 35%,transparent 65%,rgba(255,255,255,0.025) 100%);
  animation:glassShimmer 10s ease-in-out infinite"></div>
<!-- 棱镜色散光晕 -->
<div style="position:absolute;top:15%;right:-5%;width:40%;height:300px;opacity:0.035;
  background:linear-gradient(180deg,rgba(255,80,80,0.4),rgba(80,255,180,0.3),rgba(80,120,255,0.4));
  filter:blur(80px);border-radius:50%;animation:prismShimmer 12s ease-in-out infinite"></div>
