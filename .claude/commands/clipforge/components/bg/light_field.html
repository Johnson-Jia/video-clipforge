description: 1-2 个大面积高斯模糊光球缓慢漂移 + 玻璃折射高光层 + 棱镜色散边缘，营造柔和玻璃质感
parameters:
  orb_count: { default: 2, range: [1, 3] }
  orb_size: { default: 500, range: [350, 650] }
  drift_period: { default: 18, range: [14, 25] }
/ComponentMeta

<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes orbDrift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -40px) scale(1.05); }
  50% { transform: translate(-20px, 20px) scale(0.95); }
  75% { transform: translate(15px, 35px) scale(1.02); }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.03; }
  50% { opacity: 0.09; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- 深色底 -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 40%, var(--bg-mid, #001a33), var(--bg-dark, #080818))"></div>
<!-- 光球 1 -->
<div style="position:absolute;top:25%;left:20%;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,hsla(210,70%,55%,0.18),hsla(260,50%,40%,0.06),transparent 70%);
  filter:blur(80px);animation:orbDrift 20s ease-in-out infinite 0s"></div>
<!-- 光球 2 -->
<div style="position:absolute;top:50%;left:55%;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,hsla(280,60%,50%,0.14),hsla(220,40%,35%,0.05),transparent 70%);
  filter:blur(70px);animation:orbDrift 24s ease-in-out infinite 8s"></div>
<!-- 玻璃折射：对角线高光 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.015) 0%,transparent 35%,transparent 65%,rgba(255,255,255,0.025) 100%);
  animation:glassShimmer 10s ease-in-out infinite"></div>
<!-- 棱镜色散光晕 -->
<div style="position:absolute;top:15%;right:-5%;width:40%;height:300px;opacity:0.035;
  background:linear-gradient(180deg,rgba(255,80,80,0.4),rgba(80,255,180,0.3),rgba(80,120,255,0.4));
  filter:blur(80px);border-radius:50%"></div>
