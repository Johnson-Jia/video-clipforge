<!-- CSS keyframes (全局共享) -->
<!--
@keyframes orbDrift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(100px, -80px) scale(1.1); }
  66% { transform: translate(-120px, 60px) scale(0.9); }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- 渐变背景 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(160deg, var(--bg-dark, #080818) 0%, var(--bg-mid, #001a33) 100%)"></div>
<!-- 暖光晕 -->
<div style="position:absolute;top:15%;left:20%;width:200px;height:200px;
  border-radius:50%;background:hsl(30,90%,55%);opacity:0.18;filter:blur(140px);
  animation:orbDrift 25s ease-in-out infinite 0s"></div>
<!-- 冷光晕 -->
<div style="position:absolute;top:60%;left:65%;width:180px;height:180px;
  border-radius:50%;background:hsl(210,80%,50%);opacity:0.15;filter:blur(140px);
  animation:orbDrift 30s ease-in-out infinite 4s"></div>
