<!--

parameters:
  ripple_color: { default: "rgba(100,100,200,0.06)", description: "波纹颜色" }
  ripple_spacing: { default: 60, range: [40, 80], description: "波纹间距(px)" }
  center_x: { default: "50%", description: "波纹中心X" }
  center_y: { default: "50%", description: "波纹中心Y" }
/ComponentMeta
-->
<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes rippleExpand {
  0% { transform: scale(0.8); opacity: 0.5; }
  100% { transform: scale(1.5); opacity: 0; }
}
@keyframes glassShimmer {
  0%, 100% { opacity: 0.03; }
  50% { opacity: 0.09; }
}
@keyframes rippleBreath {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.8; }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- 渐变底色 -->
<div style="position:absolute;inset:0;background:linear-gradient(135deg,#0a0a1a,#0a0815,#0a0a1a)"></div>
<!-- 同心波纹（带呼吸动画） -->
<div style="position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,transparent 0px,transparent 58px,rgba(100,100,200,0.05) 58px,rgba(100,100,200,0.05) 60px);animation:rippleBreath 7s ease-in-out infinite"></div>
<!-- 扩散环动画 -->
<div style="position:absolute;top:calc(50% - 200px);left:calc(50% - 200px);width:400px;height:400px;border-radius:50%;border:2px solid rgba(100,100,200,0.15);animation:rippleExpand 4s ease-out infinite"></div>
<div style="position:absolute;top:calc(50% - 200px);left:calc(50% - 200px);width:400px;height:400px;border-radius:50%;border:1px solid rgba(100,100,200,0.1);animation:rippleExpand 4s ease-out infinite 2s"></div>
<!-- 辉光 -->
<div style="position:absolute;top:35%;left:30%;width:400px;height:400px;border-radius:50%;background:rgba(80,80,180,0.12);filter:blur(100px)"></div>
<!-- 玻璃折射水纹层 -->
<div style="position:absolute;inset:0;
  background:linear-gradient(150deg,rgba(255,255,255,0.01) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.02) 100%);
  animation:glassShimmer 9s ease-in-out infinite"></div>
<!-- 棱镜色散 -->
<div style="position:absolute;top:30%;left:-10%;width:120%;height:180px;opacity:0.03;
  background:linear-gradient(90deg,transparent,rgba(100,50,255,0.4),rgba(50,200,255,0.4),rgba(100,255,200,0.4),transparent);
  filter:blur(60px);transform:rotate(-2deg)"></div>
