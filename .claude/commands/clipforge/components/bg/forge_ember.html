<!-- CSS keyframes (全局共享，在 index.html <style> 中引入) -->
<!--
@keyframes sparkBurst {
  0% { transform: translateY(0) scale(1); opacity: 0; }
  15% { opacity: 0.90; }
  100% { transform: translateY(-280px) scale(0.3); opacity: 0; }
}
@keyframes hammerFlash {
  0%, 88%, 100% { opacity: 0.20; }
  92%, 96% { opacity: 0.55; }
}
@keyframes forgePulse {
  0%, 100% { opacity: 0.32; transform: scale(1); }
  50% { opacity: 0.48; transform: scale(1.08); }
}
-->
<!-- HTML (嵌入 .layer-bg) -->
<!-- bg-component: forge_ember -->
<!-- 锻造黑底 -->
<div style="position:absolute;inset:0;background:linear-gradient(180deg,hsl(28,22%,6%),hsl(20,16%,8%))"></div>
<!-- 锻造辉光 1（橙金，锤击节奏） -->
<div style="position:absolute;top:60%;left:30%;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,hsla(30,92%,58%,0.40),hsla(20,75%,42%,0.12),transparent 70%);
  filter:blur(90px);animation:forgePulse 4s ease-in-out infinite 0s"></div>
<!-- 锤击光闪层（周期亮闪） -->
<div style="position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 65%,hsla(40,95%,65%,0.20),transparent 55%);
  animation:hammerFlash 4s ease-in-out infinite"></div>
<!-- 火花迸溅 1-8（向上轨迹） -->
<div style="position:absolute;top:65%;left:32%;width:4px;height:4px;border-radius:50%;background:hsla(40,95%,68%,0.90);box-shadow:0 0 10px hsla(40,88%,58%,0.75);animation:sparkBurst 2.5s ease-out infinite 0s"></div>
<div style="position:absolute;top:62%;left:42%;width:3px;height:3px;border-radius:50%;background:hsla(30,92%,62%,0.85);box-shadow:0 0 9px hsla(30,82%,52%,0.65);animation:sparkBurst 3s ease-out infinite 0.4s"></div>
<div style="position:absolute;top:68%;left:50%;width:4px;height:4px;border-radius:50%;background:hsla(45,95%,70%,0.90);box-shadow:0 0 11px hsla(45,85%,60%,0.75);animation:sparkBurst 2.2s ease-out infinite 0.8s"></div>
<div style="position:absolute;top:64%;left:58%;width:3px;height:3px;border-radius:50%;background:hsla(35,90%,64%,0.85);box-shadow:0 0 8px hsla(35,80%,54%,0.65);animation:sparkBurst 2.8s ease-out infinite 1.2s"></div>
<div style="position:absolute;top:66%;left:38%;width:2px;height:2px;border-radius:50%;background:hsla(50,95%,72%,0.80);box-shadow:0 0 7px hsla(50,85%,62%,0.60);animation:sparkBurst 3.2s ease-out infinite 1.6s"></div>
<div style="position:absolute;top:63%;left:48%;width:3px;height:3px;border-radius:50%;background:hsla(40,92%,66%,0.85);box-shadow:0 0 9px hsla(40,82%,56%,0.65);animation:sparkBurst 2.6s ease-out infinite 2s"></div>
<div style="position:absolute;top:67%;left:54%;width:2px;height:2px;border-radius:50%;background:hsla(38,90%,64%,0.80);box-shadow:0 0 7px hsla(38,80%,54%,0.60);animation:sparkBurst 3s ease-out infinite 0.2s"></div>
<div style="position:absolute;top:65%;left:46%;width:4px;height:4px;border-radius:50%;background:hsla(42,95%,68%,0.88);box-shadow:0 0 10px hsla(42,85%,58%,0.70);animation:sparkBurst 2.4s ease-out infinite 1.4s"></div>
<!-- 锻造辉光 2（小，亮金） -->
<div style="position:absolute;top:70%;left:55%;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,hsla(42,90%,60%,0.32),hsla(32,72%,42%,0.10),transparent 70%);
  filter:blur(70px);animation:forgePulse 5s ease-in-out infinite 2s"></div>
<!-- 锻造暗角 -->
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 32%,hsla(25,25%,3%,0.42) 100%)"></div>
