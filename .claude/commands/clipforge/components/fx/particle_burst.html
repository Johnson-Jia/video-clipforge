name: particle_burst
layer: fx
tags: [celebration, burst, confetti, climax, particles, glow, trails]

complexity: canvas-js
description: 粒子爆发庆祝特效，全色相发光粒子从中心爆射 + 拖尾 + 菱形/星形混合 + 二次爆发，适合高潮/庆祝场景
parameters:
  particle_count: { default: "80-120", description: "随机粒子数范围" }
/ComponentMeta
-->
<!-- HTML -->
<canvas class="particle-canvas" width="1080" height="1920"></canvas>

<!-- CSS -->
<style>
.particle-canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
</style>

<!-- JS (GSAP + Canvas) -->
<script>
const pCanvas = document.querySelector('.particle-canvas');
const pCtx = pCanvas.getContext('2d');
const TOTAL_COUNT = 80 + Math.floor(Math.random() * 40);
const MAIN_COUNT = Math.floor(TOTAL_COUNT * 0.6);
const SECOND_COUNT = TOTAL_COUNT - MAIN_COUNT;
let particles = [];
let secondWave = [];

function sizeCategory() {
  const r = Math.random();
  if (r < 0.20) return { min: 8, max: 13 }; // 大 20%
  if (r < 0.70) return { min: 4, max: 7 };  // 中 50%
  return { min: 2, max: 3 };                 // 小 30%
}

function shapeType() {
  return Math.random() < 0.70 ? 'circle' : (Math.random() < 0.5 ? 'diamond' : 'star');
}

function createParticle(cx, cy, isSecondary) {
  const angle = Math.random() * Math.PI * 2;
  const speed = isSecondary ? (2 + Math.random() * 4) : (3 + Math.random() * 9);
  const h = Math.random() * 360;
  const s = 70 + Math.random() * 30;
  const l = 50 + Math.random() * 25;
  const sz = sizeCategory();
  const size = sz.min + Math.random() * (sz.max - sz.min);
  return {
    x: cx, y: cy,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    size: size,
    color: `hsl(${h},${s}%,${l}%)`,
    glowColor: `hsla(${h},${s}%,${l}%,0.6)`,
    life: 1,
    shape: shapeType(),
    phase: isSecondary ? 1 : 0, // 0=main, 1=second wave
    born: isSecondary ? 0.5 : 0, // progress offset
    active: !isSecondary
  };
}

function initParticles() {
  particles = [];
  for (let i = 0; i < MAIN_COUNT; i++) {
    particles.push(createParticle(540, 960, false));
  }
  for (let i = 0; i < SECOND_COUNT; i++) {
    const sx = 300 + Math.random() * 480;
    const sy = 600 + Math.random() * 720;
    particles.push(createParticle(sx, sy, true));
  }
}

function drawShape(p, alpha) {
  const r = p.size * Math.max(0.2, alpha);
  pCtx.globalAlpha = alpha;
  pCtx.fillStyle = p.color;
  pCtx.shadowColor = p.glowColor;
  pCtx.shadowBlur = r * 2;

  if (p.shape === 'circle') {
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
    pCtx.fill();
  } else if (p.shape === 'diamond') {
    pCtx.beginPath();
    pCtx.moveTo(p.x, p.y - r);
    pCtx.lineTo(p.x + r * 0.7, p.y);
    pCtx.lineTo(p.x, p.y + r);
    pCtx.lineTo(p.x - r * 0.7, p.y);
    pCtx.closePath();
    pCtx.fill();
  } else { // star
    pCtx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (Math.PI * 2 * i) / 5 - Math.PI / 2;
      const ox = p.x + Math.cos(a) * r;
      const oy = p.y + Math.sin(a) * r;
      if (i === 0) pCtx.moveTo(ox, oy);
      else pCtx.lineTo(ox, oy);
      const ia = a + Math.PI / 5;
      pCtx.lineTo(p.x + Math.cos(ia) * r * 0.45, p.y + Math.sin(ia) * r * 0.45);
    }
    pCtx.closePath();
    pCtx.fill();
  }
  pCtx.shadowBlur = 0;
}

function drawParticles(progress) {
  // Trail effect: semi-transparent overlay instead of clearRect
  pCtx.fillStyle = 'rgba(10,10,20,0.15)';
  pCtx.fillRect(0, 0, 1080, 1920);

  const t = progress;
  particles.forEach(p => {
    // Activate second wave after their born threshold
    if (p.phase === 1 && !p.active) {
      if (t >= p.born) p.active = true;
      else return;
    }
    if (!p.active) return;

    // Life curve: scale in then fade out
    const localT = p.phase === 1 ? (t - p.born) / (1 - p.born) : t;
    if (localT < 0) return;

    // Scale: start big (2x) → settle (1x) → shrink
    let scaleMul;
    if (localT < 0.15) {
      scaleMul = 2 - localT / 0.15; // 2→1
    } else {
      scaleMul = Math.max(0.2, 1 - (localT - 0.15) * 1.2);
    }

    p.life = Math.max(0, scaleMul);
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08; // gentle gravity
    p.vx *= 0.995; // slight air resistance

    if (p.life > 0.05) {
      drawShape(p, p.life);
    }
  });
  pCtx.globalAlpha = 1;
}

initParticles();
const burstProgress = { val: 0 };
tl.to(burstProgress, {
  val: 1, duration: 3,
  onUpdate: () => drawParticles(burstProgress.val)
}, startTime);
</script>
