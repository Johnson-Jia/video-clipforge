<!-- HTML (嵌入 .layer-fx) -->
<!-- 主扫描线 + 拖尾 -->
<div class="scanline scan-main" style="position:absolute;left:0;top:10%;width:100%;height:2px;
  background:linear-gradient(90deg,transparent 5%,rgba(0,229,255,0.5) 25%,rgba(0,229,255,0.9) 50%,rgba(0,229,255,0.5) 75%,transparent 95%);
  box-shadow:0 0 60px rgba(0,229,255,0.35),0 0 15px rgba(0,229,255,0.6);
  z-index:10;pointer-events:none"></div>
<!-- 拖尾渐隐（主线下方 80px） -->
<div class="scanline scan-trail" style="position:absolute;left:0;top:10%;width:100%;height:80px;
  background:linear-gradient(180deg,rgba(0,229,255,0.08),transparent);
  z-index:9;pointer-events:none"></div>
<!-- 副扫描线（细、暗、不同速度） -->
<div class="scanline scan-sub" style="position:absolute;left:0;top:10%;width:100%;height:1px;
  background:linear-gradient(90deg,transparent 10%,rgba(0,229,255,0.3) 40%,rgba(0,229,255,0.5) 50%,rgba(0,229,255,0.3) 60%,transparent 90%);
  box-shadow:0 0 30px rgba(0,229,255,0.2);
  z-index:10;pointer-events:none;opacity:0.5"></div>

<!-- JS (GSAP) — 入场 + 持续扫描 -->
<script>
// Step 1: Main scan line enters from above
tl.from('.scan-main', {opacity:0, top:'-2%', duration:0.4, ease:'power2.out'}, startTime)
  // Step 2: Trail fades in
  .from('.scan-trail', {opacity:0, duration:0.3, ease:'power2.out'}, startTime + 0.15)
  // Step 3: Sub scan line enters with slight delay
  .from('.scan-sub', {opacity:0, top:'-2%', duration:0.35, ease:'power2.out'}, startTime + 0.3)
  // Step 4: Main line continuous sweep (top to bottom and back)
  .to('.scan-main', {top:'90%', duration:3, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.5)
  // Step 5: Trail follows main line with offset
  .to('.scan-trail', {top:'90%', duration:3, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.5)
  // Step 6: Sub line sweeps at different speed (faster)
  .to('.scan-sub', {top:'85%', duration:2.2, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.8)
  // Step 7: Main line glow pulse while sweeping
  .fromTo('.scan-main',
    {boxShadow:'0 0 60px rgba(0,229,255,0.35),0 0 15px rgba(0,229,255,0.6)'},
    {boxShadow:'0 0 80px rgba(0,229,255,0.5),0 0 25px rgba(0,229,255,0.8)', duration:1.5, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1)
  // Step 8: Sub line subtle opacity pulse
  .to('.scan-sub', {opacity:0.7, duration:1.8, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.2);
</script>
