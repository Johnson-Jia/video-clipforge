<!-- JS (GSAP) -->
<script>
// Step 1: Entry — stagger pop-in with back.out overshoot
tl.from('.fp', {opacity:0, scale:0, duration:0.5, stagger:0.06, ease:'back.out(1.8)'}, startTime)
  // Step 2: Continuous drift — each particle unique direction/speed/phase
  .to('.p1',  {y:-80, x:30,  duration:8,  repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.6)
  .to('.p2',  {y:-100,x:-25, duration:9,  repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.7)
  .to('.p3',  {y:-65, x:35,  duration:7,  repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.4)
  .to('.p4',  {y:-90, x:-18, duration:8,  repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.8)
  .to('.p5',  {y:-50, x:22,  duration:10, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.5)
  .to('.p6',  {y:-95, x:28,  duration:7.5,repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.9)
  .to('.p7',  {y:-75, x:-30, duration:8.5,repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.3)
  .to('.p8',  {y:-85, x:15,  duration:6.5,repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.0)
  .to('.p9',  {y:-60, x:-22, duration:7.5,repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.45)
  .to('.p10', {y:-70, x:32,  duration:9.5,repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.6)
  .to('.p11', {y:-105,x:-26, duration:6,  repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.75)
  .to('.p12', {y:-40, x:18,  duration:11, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.55)
  .to('.p13', {y:-80, x:-12, duration:8,  repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.85)
  .to('.p14', {y:-65, x:24,  duration:7,  repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.35)
  .to('.p15', {y:-90, x:-32, duration:9,  repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.95)
  .to('.p16', {y:-55, x:20,  duration:8,  repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.5)
  // Step 3: Scale breathing — all particles gentle pulse (larger = more amplitude)
  .to('.p1',  {scale:1.2, duration:4,   repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.6)
  .to('.p5',  {scale:1.25,duration:4.5, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.8)
  .to('.p10', {scale:1.3, duration:3.5, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.5)
  .to('.p12', {scale:1.15,duration:5,   repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.7)
  .to('.p16', {scale:1.2, duration:4.2, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.9)
  // Step 4: Opacity twinkle — select particles shimmer
  .to('.p2',  {opacity:0.4, duration:2,  repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.2)
  .to('.p4',  {opacity:0.5, duration:2.5,repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.4)
  .to('.p8',  {opacity:0.3, duration:1.8,repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.6)
  .to('.p11', {opacity:0.4, duration:2.2,repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.3)
  .to('.p15', {opacity:0.5, duration:1.5,repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.5)
  // Step 5: Glow expansion on select particles (box-shadow pulse)
  .fromTo('.p1',
    {boxShadow:'0 0 20px rgba(139,92,246,0.35)'},
    {boxShadow:'0 0 35px rgba(139,92,246,0.55), 0 0 60px rgba(139,92,246,0.15)', duration:3, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.0)
  .fromTo('.p5',
    {boxShadow:'0 0 24px rgba(6,182,212,0.3)'},
    {boxShadow:'0 0 40px rgba(6,182,212,0.5), 0 0 70px rgba(6,182,212,0.12)', duration:3.5, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.2);
</script>
