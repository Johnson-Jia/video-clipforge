<!-- HTML (嵌入 .layer-fx) -->
<!-- 四边渐变红橙边框 -->
<div class="ab ab-top" style="position:absolute;top:20px;left:20px;right:20px;height:2px;
  background:linear-gradient(90deg,transparent 5%,rgba(255,60,60,0.9) 25%,rgba(255,120,50,0.6) 50%,rgba(255,60,60,0.9) 75%,transparent 95%);
  opacity:0;pointer-events:none;
  box-shadow:0 0 20px rgba(255,60,60,0.15),0 0 60px rgba(255,60,60,0.06)"></div>
<div class="ab ab-bot" style="position:absolute;bottom:20px;left:20px;right:20px;height:2px;
  background:linear-gradient(90deg,transparent 5%,rgba(255,60,60,0.9) 25%,rgba(255,120,50,0.6) 50%,rgba(255,60,60,0.9) 75%,transparent 95%);
  opacity:0;pointer-events:none;
  box-shadow:0 0 20px rgba(255,60,60,0.15),0 0 60px rgba(255,60,60,0.06)"></div>
<div class="ab ab-left" style="position:absolute;top:20px;bottom:20px;left:20px;width:2px;
  background:linear-gradient(180deg,transparent 5%,rgba(255,60,60,0.9) 25%,rgba(255,120,50,0.6) 50%,rgba(255,60,60,0.9) 75%,transparent 95%);
  opacity:0;pointer-events:none;
  box-shadow:0 0 20px rgba(255,60,60,0.15),0 0 60px rgba(255,60,60,0.06)"></div>
<div class="ab ab-right" style="position:absolute;top:20px;bottom:20px;right:20px;width:2px;
  background:linear-gradient(180deg,transparent 5%,rgba(255,60,60,0.9) 25%,rgba(255,120,50,0.6) 50%,rgba(255,60,60,0.9) 75%,transparent 95%);
  opacity:0;pointer-events:none;
  box-shadow:0 0 20px rgba(255,60,60,0.15),0 0 60px rgba(255,60,60,0.06)"></div>
<!-- 四角标（加大 + 加粗 + 更强初始光） -->
<div class="ab ab-c1" style="position:absolute;top:10px;left:10px;width:40px;height:40px;
  border-top:3px solid rgba(255,70,70,0.95);border-left:3px solid rgba(255,70,70,0.95);
  opacity:0;pointer-events:none;
  box-shadow:-2px -2px 14px rgba(255,60,60,0.25)"></div>
<div class="ab ab-c2" style="position:absolute;top:10px;right:10px;width:40px;height:40px;
  border-top:3px solid rgba(255,70,70,0.95);border-right:3px solid rgba(255,70,70,0.95);
  opacity:0;pointer-events:none;
  box-shadow:2px -2px 14px rgba(255,60,60,0.25)"></div>
<div class="ab ab-c3" style="position:absolute;bottom:10px;left:10px;width:40px;height:40px;
  border-bottom:3px solid rgba(255,70,70,0.95);border-left:3px solid rgba(255,70,70,0.95);
  opacity:0;pointer-events:none;
  box-shadow:-2px 2px 14px rgba(255,60,60,0.25)"></div>
<div class="ab ab-c4" style="position:absolute;bottom:10px;right:10px;width:40px;height:40px;
  border-bottom:3px solid rgba(255,70,70,0.95);border-right:3px solid rgba(255,70,70,0.95);
  opacity:0;pointer-events:none;
  box-shadow:2px 2px 14px rgba(255,60,60,0.25)"></div>
<!-- 中心扫描线（顶部 + 底部各一条，一闪即逝） -->
<div class="ab ab-scan-top" style="position:absolute;top:20px;left:50%;width:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,80,60,0.8),transparent);
  pointer-events:none;transform:translateX(-50%);
  box-shadow:0 0 20px rgba(255,60,60,0.3)"></div>
<div class="ab ab-scan-bot" style="position:absolute;bottom:20px;left:50%;width:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,80,60,0.8),transparent);
  pointer-events:none;transform:translateX(-50%);
  box-shadow:0 0 20px rgba(255,60,60,0.3)"></div>

<!-- JS (GSAP) — 8 步入场 + 持续脉冲 -->
<script>
// Step 1: Border edges scale in from center
tl.from('.ab-top', {opacity:0, scaleX:0, duration:0.4, ease:'power4.out', transformOrigin:'center center'}, startTime)
  .from('.ab-bot', {opacity:0, scaleX:0, duration:0.4, ease:'power4.out', transformOrigin:'center center'}, startTime + 0.05)
  .from('.ab-left', {opacity:0, scaleY:0, duration:0.4, ease:'power4.out', transformOrigin:'center center'}, startTime + 0.1)
  .from('.ab-right', {opacity:0, scaleY:0, duration:0.4, ease:'power4.out', transformOrigin:'center center'}, startTime + 0.15)
  // Step 2: Corner brackets elastic pop with rotation overshoot
  .from('.ab-c1', {opacity:0, scale:0, rotation:-45, duration:0.6, ease:'elastic.out(1, 0.4)'}, startTime + 0.3)
  .from('.ab-c2', {opacity:0, scale:0, rotation:45, duration:0.6, ease:'elastic.out(1, 0.4)'}, startTime + 0.4)
  .from('.ab-c3', {opacity:0, scale:0, rotation:45, duration:0.6, ease:'elastic.out(1, 0.4)'}, startTime + 0.5)
  .from('.ab-c4', {opacity:0, scale:0, rotation:-45, duration:0.6, ease:'elastic.out(1, 0.4)'}, startTime + 0.6)
  // Step 3: Scan lines flash-expand from center
  .to('.ab-scan-top', {width:'60%', opacity:0.8, duration:0.35, ease:'power2.out'}, startTime + 0.35)
  .to('.ab-scan-bot', {width:'60%', opacity:0.8, duration:0.35, ease:'power2.out'}, startTime + 0.45)
  // Step 4: Sustained border pulse (staggered)
  .to('.ab-top', {opacity:0.95, duration:1.2, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.8)
  .to('.ab-bot', {opacity:0.95, duration:1.2, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.1)
  .to('.ab-left', {opacity:0.95, duration:1.2, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.95)
  .to('.ab-right', {opacity:0.95, duration:1.2, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.25)
  // Step 5: Corner brackets glow pulse
  .to('.ab-c1', {opacity:1, duration:0.8, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.8)
  .to('.ab-c2', {opacity:1, duration:0.8, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.0)
  .to('.ab-c3', {opacity:1, duration:0.8, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.9)
  .to('.ab-c4', {opacity:1, duration:0.8, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.15)
  // Step 6: Glow burst on corners (box-shadow pulse — expanded radius)
  .fromTo('.ab-c1',
    {boxShadow:'-2px -2px 14px rgba(255,60,60,0.25)'},
    {boxShadow:'-2px -2px 40px rgba(255,60,60,0.55), -2px -2px 80px rgba(255,60,60,0.15)', duration:1, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.8)
  .fromTo('.ab-c2',
    {boxShadow:'2px -2px 14px rgba(255,60,60,0.25)'},
    {boxShadow:'2px -2px 40px rgba(255,60,60,0.55), 2px -2px 80px rgba(255,60,60,0.15)', duration:1, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.0)
  .fromTo('.ab-c3',
    {boxShadow:'-2px 2px 14px rgba(255,60,60,0.25)'},
    {boxShadow:'-2px 2px 40px rgba(255,60,60,0.55), -2px 2px 80px rgba(255,60,60,0.15)', duration:1, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 0.9)
  .fromTo('.ab-c4',
    {boxShadow:'2px 2px 14px rgba(255,60,60,0.25)'},
    {boxShadow:'2px 2px 40px rgba(255,60,60,0.55), 2px 2px 80px rgba(255,60,60,0.15)', duration:1, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.15)
  // Step 7: Scan lines fade retreat (one-shot)
  .to('.ab-scan-top', {opacity:0, width:0, duration:0.3, ease:'power2.in'}, startTime + 0.8)
  .to('.ab-scan-bot', {opacity:0, width:0, duration:0.3, ease:'power2.in'}, startTime + 0.9)
  // Step 8: Border edge glow expansion
  .fromTo('.ab-top',
    {boxShadow:'0 0 20px rgba(255,60,60,0.15),0 0 60px rgba(255,60,60,0.06)'},
    {boxShadow:'0 0 35px rgba(255,60,60,0.3),0 0 80px rgba(255,60,60,0.1)', duration:1.5, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.3)
  .fromTo('.ab-bot',
    {boxShadow:'0 0 20px rgba(255,60,60,0.15),0 0 60px rgba(255,60,60,0.06)'},
    {boxShadow:'0 0 35px rgba(255,60,60,0.3),0 0 80px rgba(255,60,60,0.1)', duration:1.5, repeat:-1, yoyo:true, ease:'sine.inOut'}, startTime + 1.5);
</script>
