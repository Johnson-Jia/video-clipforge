<!-- CSS keyframes (全局共享) -->
<!--
@keyframes streakSweep {
  0% { transform: translateX(-150%) rotate(-25deg); opacity: 0; }
  30% { opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translateX(150%) rotate(-25deg); opacity: 0; }
}
-->
<!-- HTML (嵌入 .layer-fx) -->
<div style="position:absolute;top:-50%;left:-50%;width:200%;height:200%;pointer-events:none;overflow:hidden">
  <div style="position:absolute;top:0;left:0;width:200px;height:300%;transform:rotate(-25deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06) 20%,rgba(255,255,255,0.15) 50%,rgba(255,255,255,0.06) 80%,transparent);
    animation:streakSweep 4s ease-in-out infinite"></div>
</div>
