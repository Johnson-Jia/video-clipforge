<!-- HTML (嵌入 .layer-fx) -->
<!-- 光带容器：初始位置在画面左侧外，由 GSAP 驱动扫过 -->
<div class="streak-wrap" style="position:absolute;top:-50%;left:-50%;width:200%;height:200%;pointer-events:none;overflow:hidden">
  <div class="streak-band" style="position:absolute;top:0;left:-30%;width:200px;height:300%;transform:rotate(-25deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06) 20%,rgba(255,255,255,0.15) 50%,rgba(255,255,255,0.06) 80%,transparent)">
  </div>
</div>
