parameters:

<!-- HTML -->
<canvas class="three-canvas" width="1080" height="1920"></canvas>
<!-- CSS bloom 模拟层 -->
<div class="three-bloom-layer"></div>

<!-- CSS -->
<style>
.three-canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; opacity: 0.7;
  filter: brightness(1.1) contrast(1.05);
}
.three-bloom-layer {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  mix-blend-mode: screen;
  opacity: 0.12;
}
</style>

<!-- JS (Three.js + GSAP) -->
<script>
const threeCanvas = document.querySelector('.three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
renderer.setSize(1080, 1920);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080818, 0.06);

const camera = new THREE.PerspectiveCamera(60, 1080/1920, 0.1, 1000);
camera.position.set(0, 0, 6);

const CUBE_COUNT = 35;
const cubes = [];
const cubeData = [];

for (let i = 0; i < CUBE_COUNT; i++) {
  const size = 0.15 + Math.random() * 0.3;
  const isWireframe = i < Math.floor(CUBE_COUNT * 0.2);
  const h = i / CUBE_COUNT;
  const color = new THREE.Color().setHSL(h, 0.75, 0.55);

  const geo = new THREE.BoxGeometry(size, size, size);
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: isWireframe ? 0.5 : 0.3,
    transparent: true,
    opacity: isWireframe ? 0.45 : 0.75,
    wireframe: isWireframe,
    roughness: 0.4,
    metalness: 0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(
    (Math.random() - 0.5) * 10,
    (Math.random() - 0.5) * 14,
    (Math.random() - 0.5) * 5
  );
  scene.add(mesh);
  cubes.push(mesh);
  cubeData.push({
    rotSpeedX: (0.008 + Math.random() * 0.015) * (Math.random() > 0.5 ? 1 : -1),
    rotSpeedY: (0.01 + Math.random() * 0.015) * (Math.random() > 0.5 ? 1 : -1),
    floatFreq: 0.3 + Math.random() * 0.8,
    floatAmp: 0.2 + Math.random() * 0.6,
    floatPhase: Math.random() * Math.PI * 2,
    baseY: mesh.position.y
  });
}

// 主光源 — 青色点光
const mainLight = new THREE.PointLight(0x06B6D4, 2.5, 25);
mainLight.position.set(2, 3, 5);
scene.add(mainLight);

// 补光 — 暖色
const warmLight = new THREE.PointLight(0xF59E0B, 1.2, 20);
warmLight.position.set(-3, -2, 4);
scene.add(warmLight);

// 环境光
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

function updateThree(progress) {
  const t = window.__hfThreeTime || progress * sceneDuration;
  // 方块旋转 + 浮动
  cubes.forEach((cube, i) => {
    const d = cubeData[i];
    cube.rotation.x += d.rotSpeedX;
    cube.rotation.y += d.rotSpeedY;
    cube.position.y = d.baseY + Math.sin(t * d.floatFreq + d.floatPhase) * d.floatAmp;
  });
  // 相机微移 — 缓慢球形偏移
  const camAngle = t * 0.15;
  const camRadius = 0.3;
  camera.position.x = Math.sin(camAngle) * camRadius;
  camera.position.y = Math.cos(camAngle * 0.7) * camRadius * 0.5;
  camera.lookAt(0, 0, 0);
  // 光源缓慢移动
  mainLight.position.x = 2 + Math.sin(t * 0.3) * 1.5;
  warmLight.position.y = -2 + Math.cos(t * 0.25) * 1.5;

  renderer.render(scene, camera);
}

const threeProgress = { val: 0 };
tl.to(threeProgress, {
  val: 1, duration: sceneDuration,
  onUpdate: () => updateThree(threeProgress.val)
}, sceneStart);
</script>
