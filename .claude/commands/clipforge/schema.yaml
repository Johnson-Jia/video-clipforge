name: clipforge
version: 2
description: 通用短视频全流程创作 DAG（v2: 新增 rigor + trace_level 字段）

# ═══ 渐进严谨度（rigor）═══
# LITE    — 低风险、高频、简单任务（仅 HARD 规则 + HARD Gate）
# STANDARD — 通用场景（全量注入 + HARD/SOFT Gate）
# STRICT  — 高风险、复杂任务（全量注入 + Guard 完整加载 + FULL Trace 不可降级）

# ═══ 轨迹采集级别（trace_level）═══
# FULL    — 完整执行过程 + 决策节点
# SUMMARY — 仅结果 + 门禁报告
# NONE    — 不采集

artifacts:
  env-check:
    generates: "workspace/.env-checked"
    description: "当 workspace/.env-checked 缺失时使用 — 校验 Node.js、FFmpeg、edge-tts、yt-dlp 和 HyperFrames 是否就绪"
    template: "stage0-env"
    rigor: LITE
    trace_level: SUMMARY

  content:
    generates: "**/content_ready.txt"
    description: "当环境已就绪但 content_ready.txt 不存在时使用 — 从 URL、GitHub 或用户输入获取并准备原始内容"
    template: "stage1-content"
    requires: [env-check]
    rigor: STANDARD
    trace_level: FULL

  design:
    generates: "**/design.md"
    description: "当内容已就绪但 design.md 不存在时使用 — 分析内容，定义视觉风格方向、配色方案和故事板"
    template: "stage2-analysis"
    requires: [content]
    rigor: STANDARD
    trace_level: FULL

  narration:
    generates:
      - "**/narration_segments.json"
      - "**/narration.txt"
    description: "当 design.md 已存在但 narration_segments.json 缺失时使用 — 拆解场景，编写含钩子和 CTA 的旁白文案"
    template: "stage3-scenes"
    requires: [design]
    rigor: STANDARD
    trace_level: FULL

  movie-clips:
    generates: "**/clip_durations.json"
    description: "当旁白包含 video_clip 场景但 clip_durations.json 缺失时使用 — 提取并拼接电影片段，添加 xfade 转场"
    template: "_movie-clips"
    requires: [narration]
    condition: "narration_segments.json 中包含 video_clip 类型场景"
    rigor: STANDARD
    trace_level: FULL

  audio:
    generates:
      - "**/segment_durations.json"
      - "**/narration.mp3"
      - "**/narration.srt"
      - "**/bgm.wav"
    description: "当旁白已完成但 segment_durations.json 缺失时使用 — 生成分段 TTS 旁白，执行 loudnorm，选取 BGM，校准音量"
    template: "stage4-audio"
    requires: [narration]
    requires_any: [movie-clips]
    requires_any_note: "当 movie-clips 条件触发时，audio 必须等 movie-clips 完成；否则直接依赖 narration"
    rigor: STANDARD
    trace_level: FULL

  assets:
    generates: "**/assets/manifest.md"
    description: "当 design.md 已存在但 assets/manifest.md 缺失时使用 — 准备视频所需的视觉素材"
    template: "stage5-assets"
    requires: [design]
    optional: true
    optional_note: "不执行时 video 不等待，直接继续"
    rigor: LITE
    trace_level: SUMMARY

  video:
    generates:
      - "**/index.html"
      - "**/output.mp4"
      - "**/output_no_bgm.mp4"
    description: "当音频已完成但 output.mp4 缺失时使用 — 组装 HTML（内嵌音频），通过 HyperFrames 渲染，产出双版本（含/不含 BGM）"
    template: "stage6-production"
    requires: [audio]
    requires_optional: [assets]
    requires_optional_note: "assets 为 optional，不执行时不阻塞 video"
    rigor: STRICT
    trace_level: FULL

  delivery:
    generates:
      - "**/final.mp4"
      - "**/final_no_bgm.mp4"
      - "**/cover.html"
      - "**/cover.png"
      - "**/douyin.md"
    description: "当 output.mp4 已存在但 final.mp4 缺失时使用 — 拼接封面帧，生成封面图，编写抖音文案和标签"
    template: "stage7-delivery"
    requires: [video]
    rigor: STANDARD
    trace_level: FULL

  cleanup:
    generates: "**/.cleaned"
    description: "当交付已完成但 .cleaned 标记缺失时使用 — 按保留策略清理中间产物"
    template: "_cleanup-rules"
    requires: [delivery]
    rigor: LITE
    trace_level: SUMMARY
