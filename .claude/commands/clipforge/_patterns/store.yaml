# =============================================================================
# ClipForge 经验模式库（Pattern Store）
# =============================================================================
# 从高分成功案例中提炼的可复用模式
# 生命周期：发现(Discover) → 验证(Validate) → 沉淀(Deposit) → 应用(Apply) → 淘汰(Retire)
#
# ─── 首次数据驱动升级（2026-05-27）──────────────────────────────────────────
# 基于 17 天 58 条视频（抖音）+ 30 条（视频号）+ 36 条（小红书）的播放数据：
# - P-001（量化钩子）→ VALIDATED：TOP 5 全部含数字锚定（5s率≥44%），BOTTOM 5 多数无数字
# - P-003（8层卡片）→ VALIDATED：GitHub日推类型全平台 S 级表现
# - P-002（反直觉）→ 部分验证：RuView 案例完播率 9.1%（远超均值），但效果不稳定
# - P-005（时长甜区）→ 部分验证：TOP 视频集中 45-55s，但范围可能更宽
# ─────────────────────────────────────────────────────────────────────────────
#
# 消费方式：
#   1. 每次 Skill 执行前，读取与本 Skill 相关的 patterns（按 skill_scope 过滤）
#   2. 将 as_preference.text 注入 prompt 的"成功经验"段
#   3. 将 as_fewshot.example_output 注入 prompt 的 few-shot 示例段（如有，仅 VALIDATED）
#   4. as_constraint_relaxation 需人工确认后生效（仅 VALIDATED）
#
# 治理：
#   - 有效性评估（每周）：应用模式后的平均质量评分是否高于基线
#   - 淘汰（每两周）：连续 30 天未命中，或应用后评分下降 → 标记废弃
#   - 冲突检测（每周）：经验模式是否与新增禁止规则冲突

patterns:

  # ─── P-001: 量化钩子 ─────────────────────────────────────────────────────
  - id: "P-001"
    type: VALIDATED                          # 2026-05-27 升级：17天数据验证
    source: "viral-case:05-19-douyin"
    description: "量化钩子开场（≥2 个具体数字）"
    requires_validation: false
    upgraded_at: "2026-05-27"
    validation_evidence: "17天58条视频分析：TOP 5 全部包含数字锚定（5s率≥44%），BOTTOM 5 多数无数字（5s率≤35%）"
    evidence:
      sample_size: 15
      case_result: "TOP5 视频 hook 全部含具体数字，5s完播率≥44%；BOTTOM5 多数无数字锚定"
      confidence: 0.85                       # 15条数据交叉验证，高置信度
    as_preference:
      text: "视频开场使用包含 ≥2 个具体数字的量化钩子（如'6个项目，AI占了一半'）"
      weight: HIGH                           # VALIDATED 模式提升至 HIGH
    as_fewshot: null                         # sample_size < 5，暂不填充 few-shot
    as_constraint_relaxation: null
    skill_scope: "clipforge.stage3-scenes"
    source_traces: []

  # ─── P-002: 反直觉描述 ───────────────────────────────────────────────────
  - id: "P-002"
    type: SEED
    source: "viral-case:05-19-douyin"
    description: "反直觉描述（用常见事物做不常见的事）"
    requires_validation: true
    partial_validation: "RuView反直觉案例完播率9.1%（远超均值），但非所有反直觉话题都有同等效果"
    evidence:
      sample_size: 1
      case_result: "'WiFi信号做空间感知，完全不用摄像头'是最高点击率钩子句"
      confidence: 0.65                       # 部分验证：有效果但稳定性不足
    as_preference:
      text: "至少 1 个项目使用反直觉角度描述（用常见事物做不常见的事）"
      weight: LOW                            # SEED 模式统一 LOW
    as_fewshot: null
    as_constraint_relaxation: null
    skill_scope: "clipforge.stage3-scenes"
    source_traces: []

  # ─── P-003: 8层全屏卡片 ─────────────────────────────────────────────────
  - id: "P-003"
    type: VALIDATED                          # 2026-05-27 升级：全平台 S 级表现验证
    source: "viral-case:05-19-douyin"
    description: "8层全屏卡片信息结构"
    requires_validation: false
    upgraded_at: "2026-05-27"
    validation_evidence: "GitHub日推类型在所有平台S级表现：抖音均播放20276，视频号均播放6878，小红书均曝光28244"
    evidence:
      sample_size: 24
      case_result: "github-daily 类型跨平台一致碾压其他类型，24条样本验证"
      confidence: 0.80                       # 24条样本 + 三平台交叉验证
    as_preference:
      text: "标准模式使用8层信息卡片（类别标签+排名+项目名+描述+语言+星标+三词卖点+评语）"
      weight: HIGH                           # VALIDATED 模式提升至 HIGH
    as_fewshot: null
    as_constraint_relaxation: null
    skill_scope: "clipforge.stage6-production"
    source_traces: []

  # ─── P-004: 5标签跨圈 ───────────────────────────────────────────────────
  - id: "P-004"
    type: SEED
    source: "viral-case:05-19-douyin"
    description: "5标签跨圈覆盖策略"
    requires_validation: true
    evidence:
      sample_size: 1
      case_result: "5标签覆盖GitHub+程序员+开源+AI+科技5个圈层"
      confidence: 0.50                       # 单案例弱证据（原 0.70 → 降至种子置信度）
    as_preference:
      text: "抖音文案使用 ≥5 个标签，分别覆盖核心圈、领域、热点、身份、泛流量"
      weight: LOW                            # SEED 模式统一 LOW
    as_fewshot: null
    as_constraint_relaxation: null
    skill_scope: "clipforge.stage7-delivery"
    source_traces: []

  # ─── P-005: 时长甜区 ─────────────────────────────────────────────────────
  - id: "P-005"
    type: SEED
    source: "viral-case:05-19-douyin"
    description: "45-55秒时长甜区"
    requires_validation: true
    partial_validation: "TOP视频集中在45-55s范围，但也有55s+的表现良好，甜区范围可能更宽"
    evidence:
      sample_size: 1
      case_result: "55秒时长，完播率和互动率均优于过长或过短版本"
      confidence: 0.60                       # 部分验证：范围有效但可能偏窄
    as_preference:
      text: "标准模式视频总时长控制在 45-55 秒（6项目×8秒 + 4秒hook + 3秒CTA）"
      weight: LOW                            # SEED 模式统一 LOW
    as_fewshot: null
    as_constraint_relaxation: null
    skill_scope: "clipforge.stage3-scenes"
    source_traces: []
