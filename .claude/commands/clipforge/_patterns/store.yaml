# =============================================================================
# ClipForge 经验模式库（Pattern Store）
# =============================================================================
# 从高分成功案例中提炼的可复用模式
# 生命周期：发现(Discover) → 验证(Validate) → 沉淀(Deposit) → 应用(Apply) → 淘汰(Retire)
#
# ─── 种子模式说明 ───────────────────────────────────────────────────────────
# 以下 5 个模式均为 SEED 类型，来源于 05-19 爆款案例（11万播放，抖音）。
# sample_size = 1（单一案例），不满足 ≥3 案例的 VALIDATED 沉淀门槛。
# 当前作为种子模式注入，需 ≥3 个后续高分案例验证后方可升级为 VALIDATED。
# 升级路径：当 source_traces 积累 ≥3 个案例 → type 改为 VALIDATED → confidence 重新计算
# ─────────────────────────────────────────────────────────────────────────────
#
# 消费方式：
#   1. 每次 Skill 执行前，读取与本 Skill 相关的 patterns（按 skill_scope 过滤）
#   2. 将 as_preference.text 注入 prompt 的"成功经验"段
#   3. 将 as_fewshot.example_output 注入 prompt 的 few-shot 示例段（如有，仅 VALIDATED）
#   4. as_constraint_relaxation 需人工确认后生效（仅 VALIDATED）
#
# 治理：
#   - 有效性评估（每周）：应用模式后的平均软评分是否高于基线
#   - 淘汰（每两周）：连续 30 天未命中，或应用后评分下降 → 标记废弃
#   - 冲突检测（每周）：经验模式是否与新增禁止规则冲突

patterns:

  # ─── P-001: 量化钩子 ─────────────────────────────────────────────────────
  - id: "P-001"
    type: SEED                              # SEED | VALIDATED
    source: "viral-case:05-19-douyin"
    description: "量化钩子开场（≥2 个具体数字）"
    requires_validation: true                # sample_size < 3，需更多案例验证
    evidence:
      sample_size: 1
      case_result: "11万播放（抖音），远超同期平均"
      confidence: 0.55                       # 单案例弱证据（原 0.75 → 降至种子置信度）
    as_preference:
      text: "视频开场使用包含 ≥2 个具体数字的量化钩子（如'6个项目，AI占了一半'）"
      weight: LOW                            # SEED 模式统一 LOW，升级 VALIDATED 后可提升至 MEDIUM/HIGH
    as_fewshot: null                         # 升级 VALIDATED 且 sample_size ≥ 5 时填充
    as_constraint_relaxation: null           # 升级 VALIDATED 且有证据支撑时填充
    skill_scope: "clipforge.stage3-scenes"
    source_traces: []                        # 后续高分案例的 Trace ID 追加于此

  # ─── P-002: 反直觉描述 ───────────────────────────────────────────────────
  - id: "P-002"
    type: SEED
    source: "viral-case:05-19-douyin"
    description: "反直觉描述（用常见事物做不常见的事）"
    requires_validation: true
    evidence:
      sample_size: 1
      case_result: "'WiFi信号做空间感知，完全不用摄像头'是最高点击率钩子句"
      confidence: 0.58                       # 单案例弱证据（原 0.80 → 降至种子置信度）
    as_preference:
      text: "至少 1 个项目使用反直觉角度描述（用常见事物做不常见的事）"
      weight: LOW                            # SEED 模式统一 LOW
    as_fewshot: null
    as_constraint_relaxation: null
    skill_scope: "clipforge.stage3-scenes"
    source_traces: []

  # ─── P-003: 8层全屏卡片 ─────────────────────────────────────────────────
  - id: "P-003"
    type: SEED
    source: "viral-case:05-19-douyin"
    description: "8层全屏卡片信息结构"
    requires_validation: true
    evidence:
      sample_size: 1
      case_result: "一屏一项目8秒，对比同日多项目版3.3万，单项目版11万"
      confidence: 0.60                       # 单案例弱证据（原 0.85 → 降至种子置信度，保留相对较高因有 A/B 对照）
    as_preference:
      text: "标准模式使用8层信息卡片（类别标签+排名+项目名+描述+语言+星标+三词卖点+评语）"
      weight: LOW                            # SEED 模式统一 LOW
    as_fewshot: null
    as_constraint_relaxation: null
    skill_scope: "clipforge.stage6-production"
    source_traces: []

  # ─── P-004: 5标签跨圈 ───────────────────────────────────────────────────
  - id: "P-004"
    type: SEED
    source: "viral-case:05-19-douyin"
    description: "5标签跨圈覆盖策略"
    requires_validation: true
    evidence:
      sample_size: 1
      case_result: "5标签覆盖GitHub+程序员+开源+AI+科技5个圈层"
      confidence: 0.50                       # 单案例弱证据（原 0.70 → 降至种子置信度）
    as_preference:
      text: "抖音文案使用 ≥5 个标签，分别覆盖核心圈、领域、热点、身份、泛流量"
      weight: LOW                            # SEED 模式统一 LOW
    as_fewshot: null
    as_constraint_relaxation: null
    skill_scope: "clipforge.stage7-delivery"
    source_traces: []

  # ─── P-005: 时长甜区 ─────────────────────────────────────────────────────
  - id: "P-005"
    type: SEED
    source: "viral-case:05-19-douyin"
    description: "45-55秒时长甜区"
    requires_validation: true
    evidence:
      sample_size: 1
      case_result: "55秒时长，完播率和互动率均优于过长或过短版本"
      confidence: 0.50                       # 单案例弱证据（原 0.70 → 降至种子置信度）
    as_preference:
      text: "标准模式视频总时长控制在 45-55 秒（6项目×8秒 + 4秒hook + 3秒CTA）"
      weight: LOW                            # SEED 模式统一 LOW
    as_fewshot: null
    as_constraint_relaxation: null
    skill_scope: "clipforge.stage3-scenes"
    source_traces: []
