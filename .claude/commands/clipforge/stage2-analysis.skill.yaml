skill:
  meta:
    id: "clipforge.stage2-analysis"
    version: "1.0.0"
    type: GENERATIVE
    tags: ["analysis", "visual-style", "storyboard", "design"]
    dependencies: ["clipforge.stage1-content"]
    rigor: STANDARD

  intent:
    objective: "推导视觉风格方向并设计故事板"
    criteria:
      - "design.md 包含完整的风格、配色和故事板定义"
      - "视觉风格与内容情绪匹配"
      - "故事板为下游 Stage 3/6 提供明确叙事结构"

  boundary:
    scene: "video-production"
    rules:
      - inline:
          id: "R-STAGE2-001"
          type: FORBIDDEN_METHOD
          pattern: "design.md 缺少 style/mood/color_direction 字段"
          positive: "design.md 必须包含 style、mood、color_direction 三个字段"
          guardrail: "检查 design.md 是否包含 style:、mood:、color_direction: 字段"
          severity: HARD
          class: EXPERIENTIAL
          scope: SKILL
      - inline:
          id: "R-STAGE2-002"
          type: FORBIDDEN_METHOD
          pattern: "design.md 缺少 storyboard 节"
          positive: "design.md 必须包含 storyboard 节（含 narrative_template + emotion_curve）"
          guardrail: "检查 design.md 是否包含 storyboard: 节"
          severity: HARD
          class: EXPERIENTIAL
          scope: SKILL
      - inline:
          id: "R-STAGE2-003"
          type: FORBIDDEN_LOGIC
          pattern: "emotion_curve 不是 6 元素数组"
          positive: "emotion_curve 必须是精确 6 元素的数组，对应 6 个情感节拍"
          guardrail: "检查 emotion_curve 数组长度是否为 6"
          severity: HARD
          class: EXPERIENTIAL
          scope: SKILL
      - inline:
          id: "R-STAGE2-004"
          type: FORBIDDEN_LOGIC
          pattern: "immersion_mode 不是 6 种之一"
          positive: "immersion_mode 必须是 hyper-pace/hidden-gem/mega-update/versus/story-time/fun-tool 之一"
          guardrail: "检查 immersion_mode 值是否在允许列表中"
          severity: HARD
          class: EXPERIENTIAL
          scope: SKILL
      - inline:
          id: "R-STAGE2-005"
          type: FORBIDDEN_LOGIC
          pattern: "风格与内容情绪不匹配（如科技内容配暖色生活风）"
          positive: "视觉风格应放大内容的调性——科技有未来感、商业有专业感、人文有温度感"
          guardrail: "评估 style 与内容主题的匹配度"
          severity: SOFT
          class: EXPERIENTIAL
          scope: SKILL
    preferences:
      - text: "用户明确指定的风格优先于推导结果"
        weight: HIGH
      - text: "深色做底亮色做刀——深色背景让亮色元素更突出"
        weight: MEDIUM
      - text: "参考 _director-toolkit 的导演笔记校准直觉"
        weight: MEDIUM

  guard:
    red_flags:
      - thought: "风格随便定一个就行"
        reality: "不匹配内容情绪的视觉风格会导致观感割裂，前 3 秒就会让观众划走"
        trigger: "试图跳过风格推导"
      - thought: "用默认风格不用分析了"
        reality: "没有方向指导的 Stage 6 会随机配色，每期视频风格不一致"
        trigger: "试图使用默认风格"
      - thought: "故事板可以跳过，直接写文案"
        reality: "没有故事板，Stage 3 无法规划情感节奏和幽默插入点"
        trigger: "试图跳过故事板设计"
      - thought: "emotion_curve 随便填"
        reality: "错误的情感曲线导致高潮段平淡或结尾过于激动"
        trigger: "试图随意填写 emotion_curve"
      - thought: "immersion_mode 用默认就行"
        reality: "不匹配内容的沉浸模式会让视觉风格与内容情绪割裂"
        trigger: "试图跳过沉浸模式判定"
    spirit_vs_letter:
      - rule_ref: "R-STAGE2-001"
        mode: SPIRIT
        intent: "确保下游 Stage 3/6 有明确的视觉方向指引，而非机械填字段"
      - rule_ref: "R-STAGE2-002"
        mode: SPIRIT
        intent: "确保 Stage 3 有叙事结构和情感节奏的规划依据"

  gate:
    process:
      - gate: "design_completeness"
        check: "design.md 包含 style + mood + color_direction 字段"
      - gate: "storyboard_validity"
        check: "design.md 包含 storyboard 节，含 narrative_template + emotion_curve（6元素数组）+ immersion_mode"
    quality:
      - gate: "style_content_match"
        threshold: 0.7
        evaluator: HUMAN
    max_retries: 2

  trace:
    capture: true
    level: FULL
    retention: "30d"
